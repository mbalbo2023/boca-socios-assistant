# Source-only review of the Telegram V2 *candidate*. Intentionally no
# workflow_dispatch, SSH, host runner, secrets, token, webhook or Bot API call.
# All physical operations must be integrated under the sole protected Boca
# first-deploy workflow after a separate exact-SHA architecture review.
name: Boca Telegram V2 contract (PR only)

on:
  pull_request:
    paths:
      - ".github/workflows/boca-telegram-pairing.yml"
      - "src/boca_socios/telegram_*.py"
      - "src/boca_socios/panel/telegram_setup_ui.py"
      - "tests/test_telegram_*.py"
      - "docs/ADR/0134-private-telegram-pairing-discovery.md"

permissions:
  contents: read

concurrency:
  group: boca-telegram-v2-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout unprivileged candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          uv sync --frozen
      - name: Strict offline Telegram contracts
        run: |
          uv run pytest -q tests/test_telegram_bootstrap.py tests/test_telegram_one_shot.py tests/test_telegram_setup_ui.py tests/test_telegram_private_chat_discovery.py tests/test_telegram_pairing_ui.py tests/test_telegram_pairing_resolver.py tests/test_telegram_pairing_install.py tests/test_telegram_pairing_host_contract.py
          uv run ruff check src/boca_socios/telegram_pairing_host_contract.py tests/test_telegram_pairing_host_contract.py
          uv run ruff format --check src/boca_socios/telegram_pairing_host_contract.py tests/test_telegram_pairing_host_contract.py
          uv run mypy src
          uv run python scripts/check_repo_policy.py
      - name: State non-operational result
        run: |
          echo "TELEGRAM_V2_SOURCE_ONLY=PASS_OR_FAIL_FROM_TESTS"
          echo "TELEGRAM_V2_HOST_AUTHORIZED=false"
          echo "TELEGRAM_V2_CUSTODY=UNVERIFIED"
          echo "TELEGRAM_V2_SENDER=OFF"
          echo "TELEGRAM_V2_NOTIFICATION_RECEIPT=UNVERIFIED"
