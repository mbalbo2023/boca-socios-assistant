name: Boca public source status

on:
  workflow_dispatch:
    inputs:
      mode:
        description: One exclusive public observation (never both)
        type: choice
        default: http-status
        required: true
        options:
          - http-status
          - chromium-one-get
          - chromium-capture-25
  pull_request:
    paths:
      - .github/workflows/boca-source-status.yml
      - scripts/observe_public_home.py
      - scripts/public_observer_*.py
      - scripts/run_public_observer_isolated.sh
      - tests/test_public_observer*.py

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('boca-source-status-pr-{0}', github.event.pull_request.number) || 'boca-source-status' }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'http-status' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.actor == 'mbalbo2023'
    name: public-source-status
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reject reruns before any public request
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Checkout main commit selected at dispatch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python standard library runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Observe one anonymous public HTTPS response
        run: |
          set -euo pipefail
          python3 scripts/check_public_source.py > "$RUNNER_TEMP/boca-source-status.json"
          cat "$RUNNER_TEMP/boca-source-status.json"
          python3 - "$RUNNER_TEMP/boca-source-status.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          from scripts.check_public_source import validate_report

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          observation = validate_report(report)
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as summary:
              summary.write("### Boca public source status\n\n")
              summary.write(f"- Semaphore: `{observation.color}`\n")
              summary.write(f"- Observed UTC: `{observation.observed_at}`\n")
              summary.write(f"- Fixed target: `boca_public_login`\n")
              summary.write(f"- HTTP status: `{observation.http_status}`\n")
              summary.write(f"- Reason: `{observation.reason}`\n\n")
              summary.write("One public request from a GitHub runner. No login, queue or reservation was checked. External source status is an alert, not deployment authorization.\n")
          PY

  browser-isolation:
    name: public-browser-isolation
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'chromium-one-get' || inputs.mode == 'chromium-capture-25') && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.actor == 'mbalbo2023')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject reruns before any public request
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Checkout exact selected source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated browser on this disposable runner
        env:
          BOCA_OBSERVER_IMAGE: boca-observer:${{ github.sha }}
        run: docker build --file Dockerfile.browser --label "org.boca.public-image=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --tag "$BOCA_OBSERVER_IMAGE" .
      - name: Verify OS denial and Chromium sandbox without a public request
        if: github.event_name == 'pull_request'
        env:
          BOCA_OBSERVER_IMAGE: boca-observer:${{ github.sha }}
        run: timeout --signal=TERM --kill-after=10s 120s bash scripts/run_public_observer_isolated.sh --offline-check
      - name: Observe one initial public document after OS denial probes
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'chromium-one-get'
        env:
          BOCA_OBSERVER_IMAGE: boca-observer:${{ github.sha }}
        run: timeout --signal=TERM --kill-after=10s 120s bash scripts/run_public_observer_isolated.sh --one-get
      - name: Capture only the approved public paths and render with zero egress
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'chromium-capture-25'
        env:
          BOCA_OBSERVER_IMAGE: boca-observer:${{ github.sha }}
        run: timeout --signal=TERM --kill-after=10s 240s bash scripts/run_public_observer_isolated.sh --capture-25
      - name: Record observation scope
        if: always()
        run: |
          printf 'Selected source: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Exclusive modes: initial HTML (one route.fetch), or approved capture (at most 25 trusted-client HTTP GETs) followed by offline render with network none. TLS tunnel counters are separate. Offline DOM evidence is not a full connected-site check, login, queue or reservation. PR smoke uses synthetic bytes and makes zero public requests.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only this runner image if the attempt stopped before wrapper cleanup
        if: always()
        env:
          BOCA_OBSERVER_IMAGE: boca-observer:${{ github.sha }}
        run: |
          set -euo pipefail
          docker info --format '{{.ServerVersion}}' >/dev/null
          if docker image inspect "$BOCA_OBSERVER_IMAGE" >/dev/null 2>&1; then
            [[ "$(docker image inspect --format '{{index .Config.Labels "org.boca.public-image"}}' "$BOCA_OBSERVER_IMAGE")" == "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
            docker image rm "$BOCA_OBSERVER_IMAGE" >/dev/null
          fi
          [[ -z "$(docker image ls -q --filter "reference=$BOCA_OBSERVER_IMAGE")" ]]
