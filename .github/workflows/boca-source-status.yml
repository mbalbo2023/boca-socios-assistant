name: Boca public source status

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boca-source-status
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.actor == 'mbalbo2023'
    name: public-source-status
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reject reruns before any public request
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Checkout main commit selected at dispatch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python standard library runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Observe one anonymous public HTTPS response
        run: |
          set -euo pipefail
          python3 scripts/check_public_source.py > "$RUNNER_TEMP/boca-source-status.json"
          cat "$RUNNER_TEMP/boca-source-status.json"
          python3 - "$RUNNER_TEMP/boca-source-status.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          from scripts.check_public_source import validate_report

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          observation = validate_report(report)
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as summary:
              summary.write("### Boca public source status\n\n")
              summary.write(f"- Semaphore: `{observation.color}`\n")
              summary.write(f"- Observed UTC: `{observation.observed_at}`\n")
              summary.write(f"- Fixed target: `boca_public_login`\n")
              summary.write(f"- HTTP status: `{observation.http_status}`\n")
              summary.write(f"- Reason: `{observation.reason}`\n\n")
              summary.write("One public request from a GitHub runner. No login, queue or reservation was checked. External source status is an alert, not deployment authorization.\n")
          PY
