name: Boca Playwright full3 diagnostic (manual, offline)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boca-playwright-full3-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full3-diagnostic:
    if: github.repository == 'mbalbo2023/boca-socios-assistant'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build one disposable full Playwright worker image
        env:
          IMAGE: boca-browser-full3-diagnostic:${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker build --file Dockerfile.browser \
            --label "org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE" .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_SHA"
      - name: Verify all three bundles exist without blackbox execution
        env:
          IMAGE: boca-browser-full3-diagnostic:${{ github.sha }}
        run: |
          timeout 45s docker run --rm --network none \
            --user 10002:10002 --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --security-opt "seccomp=$GITHUB_WORKSPACE/docker/seccomp_profile.json" \
            --pids-limit 64 --memory 256m --cpus 0.5 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --entrypoint python "$IMAGE" -c '
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as api:
              for name in ("chromium", "firefox", "webkit"):
                  if not Path(getattr(api, name).executable_path).is_file():
                      raise SystemExit(f"missing_browser_{name}")
          print("BOCA_FULL_PLAYWRIGHT_BUNDLES chromium=PRESENT firefox=PRESENT webkit=PRESENT offline=true")
          '
      - name: Probe each Playwright engine in a separate offline process
        env:
          IMAGE: boca-browser-full3-diagnostic:${{ github.sha }}
        run: |
          set -euo pipefail
          # #402: old shared Python/PID1 process failed at Firefox new_page;
          # isolate children and use Docker init as recommended by Playwright.
          # This opt-in diagnosis is NOT a release/cutover gate or host check.
          failures=0
          for engine in chromium firefox webkit; do
            if ! timeout 50s docker run --rm --init --network none \
              --user 10002:10002 --read-only \
              --cap-drop ALL --cap-add SYS_CHROOT \
              --security-opt no-new-privileges:true \
              --security-opt "seccomp=$GITHUB_WORKSPACE/docker/seccomp_profile.json" \
              --cgroupns private --ipc private \
              --pids-limit 128 --memory 768m --cpus 1.0 --shm-size 64m \
              --tmpfs /tmp:rw,noexec,nosuid,size=32m \
              --tmpfs /home/boca-browser:rw,noexec,nosuid,size=16m,uid=10002,gid=10002,mode=0700 \
              --env BOCA_PLAYWRIGHT_ENGINE="$engine" --env DEBUG=pw:browser \
              --entrypoint python "$IMAGE" -c '
          import os
          import re
          import tempfile
          from playwright.sync_api import sync_playwright

          name = os.environ["BOCA_PLAYWRIGHT_ENGINE"]
          if name not in ("chromium", "firefox", "webkit"):
              raise SystemExit("BOCA_FULL_PLAYWRIGHT_LAUNCH state=NO_GO reason=invalid_engine")
          phase = "launch"
          with tempfile.TemporaryFile() as probe:
              saved_stderr = os.dup(2)
              try:
                  os.dup2(probe.fileno(), 2)
                  try:
                      with sync_playwright() as api:
                          browser_type = getattr(api, name)
                          options = {"chromium_sandbox": True, "args": ["--disable-background-networking"]} if name == "chromium" else {}
                          browser = browser_type.launch(headless=True, timeout=20000, **options)
                          try:
                              phase = "new_page"
                              page = browser.new_page()
                              phase = "goto"
                              page.goto("about:blank", timeout=10000)
                              if page.url != "about:blank":
                                  raise RuntimeError("internal_blank_url_mismatch")
                          finally:
                              try:
                                  browser.close()
                              except Exception:
                                  pass
                  except Exception as error:
                      os.lseek(probe.fileno(), 0, os.SEEK_SET)
                      observed = (str(error)[:16384] + "\n" + os.read(probe.fileno(), 65536).decode("utf-8", "replace")).lower()
                      flags = {
                          "sandbox": ("sandbox", "user namespace", "unshare"),
                          "permission": ("permission denied", "operation not permitted", "eperm"),
                          "library": ("shared object", "shared librar", "xpcomglue"),
                          "memory": ("out of memory", "cannot allocate memory", "oom"),
                          "process": ("resource temporarily unavailable", "pthread_create", "fork failed"),
                          "signal": ("sigsys", "sigsegv", "sigabrt", "sigkill"),
                      }
                      categories = ",".join(k for k, tokens in flags.items() if any(t in observed for t in tokens)) or "unclassified"
                      exit_match = re.search(r"(?:exitcode|exit code|code)[=:] ?(-?[0-9]{1,3})", observed)
                      code = exit_match.group(1) if exit_match else "unknown"
                      raise SystemExit(f"BOCA_FULL_PLAYWRIGHT_LAUNCH state=NO_GO engine={name} phase={phase} reason={type(error).__name__} categories={categories} exit_code={code}") from None
              finally:
                  os.dup2(saved_stderr, 2)
                  os.close(saved_stderr)
          print(f"BOCA_FULL_PLAYWRIGHT_LAUNCH engine={name} state=PASS offline=true blackbox=UNTOUCHED")
          ' ; then
              printf 'BOCA_FULL_PLAYWRIGHT_LAUNCH state=NO_GO engine=%s phase=container reason=NONZERO_OR_TIMEOUT\n' "$engine" >&2
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0
