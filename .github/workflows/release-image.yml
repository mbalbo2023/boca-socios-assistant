name: Boca image release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boca-image-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-validation:
    if: github.event_name == 'pull_request'
    name: release-image-pr-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout merge candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build one local controller image
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: boca-release-validation:${{ github.sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE" .
      - name: Verify source revision label
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: boca-release-validation:${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE")" = "https://github.com/mbalbo2023/boca-socios-assistant"
      - name: Build one local browser worker image
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: boca-browser-release-validation:${{ github.sha }}
        run: |
          docker build --file Dockerfile.browser \
            --label "org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE" .
      - name: Verify browser source revision label
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: boca-browser-release-validation:${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE")" = "https://github.com/mbalbo2023/boca-socios-assistant"
      - name: Measure disposable dual-image logical and archive bytes
        env:
          CONTROLLER_IMAGE: boca-release-validation:${{ github.sha }}
          BROWSER_IMAGE: boca-browser-release-validation:${{ github.sha }}
        run: |
          set -euo pipefail
          # Disposable PR runner only. Size is Docker's logical image size;
          # the shared tar is uncompressed. Neither is a droplet pull delta.
          controller_size="$(docker image inspect --format '{{.Size}}' "$CONTROLLER_IMAGE")"
          browser_size="$(docker image inspect --format '{{.Size}}' "$BROWSER_IMAGE")"
          [[ "$controller_size" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$browser_size" =~ ^[1-9][0-9]{0,18}$ ]]
          total_logical_bytes=$((controller_size + browser_size))
          test "$total_logical_bytes" -gt "$controller_size"
          pair_tar_bytes="$(docker image save "$CONTROLLER_IMAGE" "$BROWSER_IMAGE" | wc -c)"
          pair_tar_bytes="${pair_tar_bytes//[[:space:]]/}"
          [[ "$pair_tar_bytes" =~ ^[1-9][0-9]{0,18}$ ]]
          printf 'BOCA_PR_DUAL_IMAGE_CAPACITY source_sha=%s controller_logical_bytes=%s browser_logical_bytes=%s total_logical_bytes=%s pair_tar_bytes=%s runner=DISPOSABLE host_delta=UNVERIFIED\n' \
            "$GITHUB_SHA" "$controller_size" "$browser_size" "$total_logical_bytes" "$pair_tar_bytes" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify all full Playwright browser bundles without blackbox execution
        env:
          IMAGE: boca-browser-release-validation:${{ github.sha }}
        run: |
          set -euo pipefail
          timeout 45s docker run --rm --network none \
            --user 10002:10002 --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --security-opt "seccomp=$GITHUB_WORKSPACE/docker/seccomp_profile.json" \
            --cgroupns private --ipc private --pids-limit 64 --memory 256m --cpus 0.5 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --entrypoint python "$IMAGE" -c '
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as api:
              for name in ("chromium", "firefox", "webkit"):
                  if not Path(getattr(api, name).executable_path).is_file():
                      raise SystemExit(f"missing_browser_{name}")
          print("BOCA_FULL_PLAYWRIGHT_BUNDLES chromium=PRESENT firefox=PRESENT webkit=PRESENT offline=true blackbox=UNTOUCHED")
          '
      - name: Require the reviewed browser IPC worker command
        env:
          IMAGE: boca-browser-release-validation:${{ github.sha }}
        run: >-
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE")"
          = '["python","-m","boca_socios.browser.ipc_worker"]'
      - name: Verify isolated Chromium launch offline without owner modules
        env:
          IMAGE: boca-browser-release-validation:${{ github.sha }}
        run: |
          set -euo pipefail
          # This executes ONLY the independent about:blank preflight, never the
          # owner-controlled synthetic.py/ipc_worker.py BLACKBOX or Boca site.
          timeout 60s docker run --rm \
            --network none \
            --user 10002:10002 \
            --read-only \
            --cap-drop ALL --cap-add SYS_CHROOT \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=$GITHUB_WORKSPACE/docker/seccomp_profile.json" \
            --cgroupns private --ipc private \
            --pids-limit 128 --memory 768m --cpus 1.0 --shm-size 64m \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /home/boca-browser:rw,noexec,nosuid,size=16m \
            --entrypoint python "$IMAGE" scripts/verify_chromium_worker.py
      - name: Launch all three Playwright browsers offline without blackbox
        env:
          IMAGE: boca-browser-release-validation:${{ github.sha }}
        run: |
          set -euo pipefail
          # The binary-presence check alone does not prove Firefox/WebKit can
          # launch under the browser worker's isolation and cgroup limits.
          # Visit only the internal about:blank URL, with no public navigation.
          timeout 120s docker run --rm --network none \
            --user 10002:10002 --read-only \
            --cap-drop ALL --cap-add SYS_CHROOT \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=$GITHUB_WORKSPACE/docker/seccomp_profile.json" \
            --cgroupns private --ipc private \
            --pids-limit 128 --memory 768m --cpus 1.0 --shm-size 64m \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /home/boca-browser:rw,noexec,nosuid,size=16m,uid=10002,gid=10002,mode=0700 \
            --env DEBUG=pw:browser \
            --entrypoint python "$IMAGE" -c '
          import os
          import re
          import stat
          import tempfile
          from playwright.sync_api import sync_playwright
          home = os.environ["HOME"]
          home_stat = os.stat(home)
          print(
              "BOCA_BROWSER_HOME_CHECK "
              f"uid_ok={str(home_stat.st_uid == 10002).lower()} "
              f"gid_ok={str(home_stat.st_gid == 10002).lower()} "
              f"private_mode={str(stat.S_IMODE(home_stat.st_mode) == 0o700).lower()} "
              f"writable={str(os.access(home, os.W_OK)).lower()}",
              flush=True,
          )
          # Capture Playwright browser stderr locally (tmpfs, never artifact),
          # then emit only bounded classifications. Never log raw browser
          # arguments, paths, exception text or browser output publicly.
          with tempfile.TemporaryFile() as probe:
              saved_stderr = os.dup(2)
              try:
                  os.dup2(probe.fileno(), 2)
                  with sync_playwright() as api:
                      for name in ("chromium", "firefox", "webkit"):
                          browser_type = getattr(api, name)
                          options = {"chromium_sandbox": True, "args": ["--disable-background-networking"]} if name == "chromium" else {}
                          trace_from = os.lseek(probe.fileno(), 0, os.SEEK_CUR)
                          browser = None
                          phase = "launch"
                          try:
                              browser = browser_type.launch(headless=True, timeout=20000, **options)
                              phase = "new_page"
                              page = browser.new_page()
                              phase = "goto"
                              page.goto("about:blank", timeout=10000)
                              if page.url != "about:blank":
                                  raise RuntimeError("internal_blank_url_mismatch")
                          except Exception as error:
                              os.lseek(probe.fileno(), trace_from, os.SEEK_SET)
                              captured = os.read(probe.fileno(), 65536).decode("utf-8", "replace").lower()
                              observed = (str(error).lower()[:32768] + "\n" + captured)
                              flags = {
                                  "sandbox": ("sandbox", "user namespace", "usernamespace", "unshare"),
                                  "permission": ("permission denied", "operation not permitted", "eperm"),
                                  "library": ("shared object", "shared librar", "xpcomglue"),
                                  "memory": ("out of memory", "cannot allocate memory", "oom"),
                                  "process": ("resource temporarily unavailable", "pthread_create", "fork failed"),
                                  "signal": ("sigsys", "sigsegv", "sigabrt", "sigkill"),
                              }
                              categories = ",".join(key for key, tokens in flags.items() if any(token in observed for token in tokens)) or "unclassified"
                              exit_match = re.search(r"(?:exitcode|exit code|code)[=:] ?(-?[0-9]{1,3})", observed)
                              code = exit_match.group(1) if exit_match else "unknown"
                              raise SystemExit(f"BOCA_FULL_PLAYWRIGHT_LAUNCH state=NO_GO engine={name} phase={phase} reason={type(error).__name__} categories={categories} exit_code={code}") from None
                          finally:
                              if browser is not None:
                                  browser.close()
              finally:
                  os.dup2(saved_stderr, 2)
                  os.close(saved_stderr)
          print("BOCA_FULL_PLAYWRIGHT_LAUNCH chromium=PASS firefox=PASS webkit=PASS offline=true blackbox=UNTOUCHED")
          '
      - name: Scan before any image publication
        run: bash scripts/trivy_scan_image.sh "boca-release-validation:$GITHUB_SHA"
      - name: Scan browser image before any publication
        run: bash scripts/trivy_scan_image.sh "boca-browser-release-validation:$GITHUB_SHA"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.actor == 'mbalbo2023'
    name: publish-reviewed-image
    environment: boca-image-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Require verified protected release environment
        env:
          BOCA_RELEASE_ENV_READY: ${{ vars.BOCA_RELEASE_ENV_READY }}
        run: |
          test "$BOCA_RELEASE_ENV_READY" = 'ready'
          test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require current main source before release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref.json" "$GITHUB_SHA"
      - name: Require a unique first dispatch before release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&head_sha=$GITHUB_SHA&per_page=2" > "$RUNNER_TEMP/boca-release-runs-build.json"
          python scripts/check_release_dispatch.py "$RUNNER_TEMP/boca-release-runs-build.json" "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Build one local controller image
        env:
          IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant:sha-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE" .
      - name: Verify source revision label
        env:
          IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant:sha-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE")" = "https://github.com/mbalbo2023/boca-socios-assistant"
      - name: Build one local browser worker image
        env:
          IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant-browser:sha-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker build --file Dockerfile.browser \
            --label "org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE" .
      - name: Verify browser source revision label
        env:
          IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant-browser:sha-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE")" = "https://github.com/mbalbo2023/boca-socios-assistant"
      - name: Require the reviewed browser IPC worker command
        env:
          IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant-browser:sha-${{ github.sha }}
        run: >-
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE")"
          = '["python","-m","boca_socios.browser.ipc_worker"]'
      - name: Scan the image that will be published
        run: bash scripts/trivy_scan_image.sh "ghcr.io/mbalbo2023/boca-socios-assistant:sha-$GITHUB_SHA"
      - name: Scan browser image before any publication
        run: bash scripts/trivy_scan_image.sh "ghcr.io/mbalbo2023/boca-socios-assistant-browser:sha-$GITHUB_SHA"
      - name: Recheck current main source before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-publish.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-publish.json" "$GITHUB_SHA"
      - name: Recheck unique dispatch before registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&head_sha=$GITHUB_SHA&per_page=2" > "$RUNNER_TEMP/boca-release-runs-publish.json"
          python scripts/check_release_dispatch.py "$RUNNER_TEMP/boca-release-runs-publish.json" "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Log in only after successful scan
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish both scanned images and record immutable digests
        id: publish
        env:
          CONTROLLER_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant:sha-${{ github.sha }}
          BROWSER_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant-browser:sha-${{ github.sha }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # Publish browser first: a failed controller push cannot leave a
          # controller-only successful release manifest. Both pushes must pass.
          docker push "$BROWSER_IMAGE" | tee "$RUNNER_TEMP/boca-browser-push.log"
          browser_ref="$(python scripts/parse_image_digest.py "$RUNNER_TEMP/boca-browser-push.log" "$GITHUB_SHA" --role browser)"
          docker push "$CONTROLLER_IMAGE" | tee "$RUNNER_TEMP/boca-push.log"
          image_ref="$(python scripts/parse_image_digest.py "$RUNNER_TEMP/boca-push.log" "$GITHUB_SHA" --role controller)"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'browser_image_ref=%s\n' "$browser_ref" >> "$GITHUB_OUTPUT"
          python -m boca_socios.release_manifest write "$image_ref" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/boca-release-manifest.json"
          python -m boca_socios.browser_release_manifest write \
            "$image_ref" "$browser_ref" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/boca-browser-release-manifest.json"
          python -m boca_socios.release_manifest verify \
            "$RUNNER_TEMP/boca-release-manifest.json" "$image_ref" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          python -m boca_socios.browser_release_manifest verify \
            "$RUNNER_TEMP/boca-browser-release-manifest.json" \
            "$image_ref" "$browser_ref" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          {
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Controller digest: `%s`\n\n' "$image_ref"
            printf 'Browser worker digest: `%s`\n\n' "$browser_ref"
            printf 'Actions run: `%s`\n' "$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact published digest for the guarded install
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boca-release-manifest
          path: ${{ runner.temp }}/boca-release-manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Preserve paired browser release evidence for a future guarded install
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boca-browser-release-manifest
          path: ${{ runner.temp }}/boca-browser-release-manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Log out from registry
        if: always()
        run: docker logout ghcr.io || true
