name: Image security

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller-scan:
    name: image-security-controller-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ephemeral BuildKit for controller scan
        id: setup_buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build local controller image without publishing
        if: steps.setup_buildx.outcome == 'success'
        id: cached_controller_build
        continue-on-error: true
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: boca-socios-scan:${{ github.sha }}
          cache-from: type=gha,scope=boca-main-controller-r247,timeout=30s
      - name: Build controller cold on cache failure
        if: steps.setup_buildx.outcome == 'failure' || steps.cached_controller_build.outcome == 'failure'
        run: docker build --tag boca-socios-scan:${{ github.sha }} .
      - name: Scan OS and library vulnerabilities
        run: bash scripts/trivy_scan_image.sh "boca-socios-scan:$GITHUB_SHA"

  browser-scan:
    name: image-security-browser-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ephemeral BuildKit for browser scan
        id: setup_buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build local isolated browser worker image without publishing
        if: steps.setup_buildx.outcome == 'success'
        id: cached_browser_build
        continue-on-error: true
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.browser
          platforms: linux/amd64
          push: false
          load: true
          tags: boca-browser-scan:${{ github.sha }}
          cache-from: type=gha,scope=boca-main-browser-r247,timeout=30s
      - name: Build browser cold on cache failure
        if: steps.setup_buildx.outcome == 'failure' || steps.cached_browser_build.outcome == 'failure'
        run: docker build --file Dockerfile.browser --tag boca-browser-scan:${{ github.sha }} .
      - name: Scan browser OS and library vulnerabilities
        run: bash scripts/trivy_scan_image.sh "boca-browser-scan:$GITHUB_SHA"

  scan:
    name: image-security-scan
    needs: [controller-scan, browser-scan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require both exact-source vulnerability scans to pass
        env:
          CONTROLLER_RESULT: ${{ needs.controller-scan.result }}
          BROWSER_RESULT: ${{ needs.browser-scan.result }}
        run: |
          test "$CONTROLLER_RESULT" = success
          test "$BROWSER_RESULT" = success
