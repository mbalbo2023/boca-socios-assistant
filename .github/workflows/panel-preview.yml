name: Boca panel preview

on:
  pull_request:
    paths:
      - .github/workflows/panel-preview.yml
      - scripts/generate_panel_preview.py
      - src/boca_socios/panel/**
      - tests/test_panel_preview.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boca-panel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-preview:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.repository == 'mbalbo2023/boca-socios-assistant' &&
       github.actor == 'mbalbo2023')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Render fixed synthetic statuses
        run: |
          mkdir -p "$RUNNER_TEMP/panel-preview"
          PYTHONPATH=src python scripts/generate_panel_preview.py > "$RUNNER_TEMP/panel-preview/index.html"
      - name: Upload tablet preview
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boca-panel-synthetic-preview-${{ github.sha }}
          path: ${{ runner.temp }}/panel-preview/index.html
          if-no-files-found: error
          retention-days: 7
