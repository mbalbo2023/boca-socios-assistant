name: Boca official public news receipt (PR only)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/boca-official-news-receipt.yml
      - src/boca_socios/events/official_news_receipt.py
      - tests/test_official_news_receipt.py
      - docs/ADR/0135-official-event-catalog.md

permissions:
  contents: read

concurrency:
  group: boca-official-news-receipt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  one-anonymous-public-article-get:
    if: >-
      github.repository == 'mbalbo2023/boca-socios-assistant' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: one anonymous club-news GET, no host
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reject rerun before any external traffic
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Checkout exact PR candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up standard-library Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Make one bounded anonymous GET to one fixed public Boca article
        env:
          RECEIPT_PATH: ${{ runner.temp }}/boca-official-news-receipt.json
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m boca_socios.events.official_news_receipt > "$RECEIPT_PATH"
          python3 - "$RECEIPT_PATH" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["schema"] == "boca-public-news-receipt-v1"
          assert report["request_count"] == 1 and report["redirects_followed"] == 0
          assert report["credentials_sent"] is False and report["actionable"] is False
          assert report["feed_verified"] is False and report["availability_verified"] is False
          assert report["state"] in (
              "PUBLIC_PAGE_OBSERVED_UNVERIFIED", "CONTENT_UNVERIFIED", "SOURCE_DEGRADED"
          )
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as out:
              out.write("### Anonymous Boca club-news diagnostic (PR-only)\n\n")
              out.write(f"- PR HEAD: `{__import__('os').environ['PR_HEAD_SHA']}`; tested merge SHA: `{__import__('os').environ['GITHUB_SHA']}`\n")
              out.write(f"- Source state: `{report['state']}`; reason: `{report['reason']}`\n")
              out.write(f"- HTTP: `{report['http_status']}`; observed UTC: `{report['observed_at_utc']}`\n")
              out.write(f"- SHA-256: `{report['source_sha256']}`; bytes: `{report['content_length']}`\n")
              out.write("- No redirects, login, queue, cookies, purchase, host access, or snapshot publication.\n")
              out.write("- External source status is advisory; even complete markers are NOT an official API/feed or live ticket availability.\n")
          PY
      - name: Preserve redacted public-source evidence on this PR run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boca-official-news-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/boca-official-news-receipt.json
          if-no-files-found: warn
          retention-days: 7
