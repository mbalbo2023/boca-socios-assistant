name: Boca official public news receipt (PR only)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/boca-official-news-receipt.yml
      - src/boca_socios/events/official_news_receipt.py
      - src/boca_socios/events/official_article_observation.py
      - src/boca_socios/events/official_capture_binding.py
      - tests/test_official_news_receipt.py
      - tests/test_official_article_observation.py
      - docs/ADR/0135-official-event-catalog.md

permissions:
  contents: read

concurrency:
  group: boca-official-news-receipt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  one-anonymous-public-article-get:
    if: >-
      github.repository == 'mbalbo2023/boca-socios-assistant' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: one anonymous club-news GET, no host
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reject rerun before any external traffic
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Checkout exact PR candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up standard-library Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Make one bounded anonymous GET to one fixed public Boca article
        env:
          RECEIPT_PATH: ${{ runner.temp }}/boca-official-news-receipt.json
          ENVELOPE_PATH: ${{ runner.temp }}/boca-official-news-envelope.json
          SNAPSHOT_PATH: ${{ runner.temp }}/boca-official-news-catalog.jsonl
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m boca_socios.events.official_news_receipt --emit-offline-observation > "$ENVELOPE_PATH"
          PYTHONPATH=src python3 - "$ENVELOPE_PATH" "$RECEIPT_PATH" "$SNAPSHOT_PATH" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import os
          import pathlib
          import sys
          from boca_socios.events.official_news_receipt import split_public_observation_envelope

          envelope = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          report, catalog_jsonl = split_public_observation_envelope(envelope)
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(report, sort_keys=True, separators=(",", ":")), encoding="utf-8"
          )
          os.chmod(sys.argv[2], 0o600)
          if catalog_jsonl is not None:
              pathlib.Path(sys.argv[3]).write_text(catalog_jsonl, encoding="utf-8")
              os.chmod(sys.argv[3], 0o600)
          # The intermediate envelope is runner-local, never an artifact.
          pathlib.Path(sys.argv[1]).unlink()
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          with pathlib.Path(sys.argv[4]).open("a", encoding="utf-8") as out:
              out.write("### Anonymous Boca club-news diagnostic (PR-only)\n\n")
              out.write(f"- PR HEAD: `{os.environ['PR_HEAD_SHA']}`; tested merge SHA: `{os.environ['GITHUB_SHA']}`\n")
              out.write(f"- Source state: `{report['state']}`; reason: `{report['reason']}`\n")
              out.write(f"- HTTP: `{report['http_status']}`; observed UTC: `{report['observed_at_utc']}`\n")
              out.write(f"- SHA-256: `{report['source_sha256']}`; bytes: `{report['content_length']}`\n")
              out.write(f"- Offline JSONL: `{report['offline_snapshot_state']}`; reason: `{report['offline_snapshot_reason']}`; events: `{1 if catalog_jsonl else 0}`\n")
              out.write("- JSONL is a public-article observation for review, NOT deployed to Boca or proof of tickets.\n")
              out.write("- One GET, no redirects/login/queue/cookies/purchase/host writes; source health advisory.\n")
          PY
      - name: Preserve redacted receipt and bounded offline JSONL on this PR run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boca-official-news-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/boca-official-news-receipt.json
            ${{ runner.temp }}/boca-official-news-catalog.jsonl
          if-no-files-found: warn
          retention-days: 7
