          docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount "type=volume,source=$stage,target=/run/enrollment,volume-nocopy" \
            "$BOCA_IMAGE" python -c 'import os,sys; from pathlib import Path; from cryptography.hazmat.primitives.asymmetric import ec; from cryptography.hazmat.primitives import serialization; from boca_socios.owner_bootstrap import RecipientReceipt,seal_for_recipient,_directory,_write_new,UID; public=ec.generate_private_key(ec.SECP256R1()).public_key().public_bytes(serialization.Encoding.DER,serialization.PublicFormat.SubjectPublicKeyInfo); payload=seal_for_recipient(RecipientReceipt("PREPARED",sys.argv[1],sys.argv[2]),{"credential_id":os.urandom(32),"public_key.der":public},sys.argv[3],sys.argv[4]); directory=_directory(Path("/run/enrollment"),UID); _write_new(directory,"owner-envelope.v2",payload,UID); os.close(directory)' \
            "$public" "$fingerprint" "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT"
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            --mount "type=volume,source=$stage,target=/run/enrollment,volume-nocopy,readonly" \
            "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap -- install-staged "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")" = \
            "BOCA_OWNER_BOOTSTRAP state=CONFIGURED fingerprint=$fingerprint"
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
