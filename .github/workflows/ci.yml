            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap -- verify "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")" = \
