            --label com.docker.compose.container-number=1 \
            --user 10001:10001 --network boca-socios_telegram_egress \
            --read-only --no-healthcheck --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 0.25 \
            --tmpfs /tmp:rw,noexec,nosuid,size=8m \
            --env BOCA_ENVIRONMENT=staging --env BOCA_RUNTIME_MODE=simulation \
            --env BOCA_ENGINE_MODE=off --env BOCA_TELEGRAM_DISPATCH_MODE=explicit \
            --mount type=volume,source=boca-socios_boca_data,target=/data,volume-nocopy \
            --mount type=volume,source=boca-socios_boca_telegram,target=/run/telegram,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.telegram_one_shot test "$GITHUB_SHA" 12345 \
            eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee \
            > /dev/null 2>&1
          test_rc=$?
          set -e
          test "$test_rc" -eq 1
          docker inspect --format '{{json .}}' boca-socios-telegram-test-1 > "$RUNNER_TEMP/boca-telegram-test-container.json"
          docker network inspect --format '{{json .}}' boca-socios_telegram_egress > "$RUNNER_TEMP/boca-telegram-test-network.json"
          docker image inspect --format '{{json .}}' "$BOCA_IMAGE" > "$RUNNER_TEMP/boca-telegram-test-image.json"
          PYTHONPATH=src python3 - "$RUNNER_TEMP/boca-telegram-test-container.json" "$RUNNER_TEMP/boca-telegram-test-network.json" "$RUNNER_TEMP/boca-telegram-test-image.json" <<'PY'
          import json, sys
          from pathlib import Path
          from boca_socios import host_rootless_setup as host

          record = json.loads(Path(sys.argv[1]).read_text())
          network = Path(sys.argv[2]).read_text()
          image = json.loads(Path(sys.argv[3]).read_text())
          def only_network(_home, _binary, _endpoint, *command):
              assert command[:2] == ("network", "inspect")
              return network
          host._command = only_network
          assert record["State"]["Running"] is False
          assert host._verified_telegram_test_isolation(Path("/home/boca-deploy"), "--host=local", record)
          assert host._telegram_test_environment(record["Config"]["Env"], image["Config"]["Env"])
          PY
          docker rm boca-socios-telegram-test-1
          docker network rm boca-socios_telegram_egress
          docker volume rm boca-socios_boca_telegram
          [[ "$(docker network ls --format '{{.Name}}')" != *boca-socios_telegram_egress* ]]
      - name: Serve BETA on runner loopback with exact image, HTTP and isolation
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: |
          docker compose -p boca-socios -f compose.beta.yaml up --no-build --no-deps --wait --wait-timeout 90 -d controller
          container="$(docker compose -p boca-socios -f compose.beta.yaml ps -q controller)"
          test -n "$container"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert (h["NanoCpus"], h["Memory"], h["PidsLimit"], h["ReadonlyRootfs"], h["Privileged"], h["PortBindings"], h["PublishAllPorts"]) == (500000000, 268435456, 64, True, False, {"8443/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8443"}]}, False)'
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["NetworkMode"] == "boca-socios_boca_private" and h["CapDrop"] == ["ALL"] and h["CapAdd"] in (None, []) and h["SecurityOpt"] == ["no-new-privileges:true"] and h["Tmpfs"] == {"/tmp": "rw,noexec,nosuid,size=16m"} and h["CgroupnsMode"] in ("private", "")'
          docker inspect --format '{{json .NetworkSettings}}' "$container" | python3 -c 'import json,sys; n=json.load(sys.stdin); assert set(n["Networks"]) == {"boca-socios_boca_private"} and n["Ports"] == {"8443/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8443"}]}'
          docker inspect --format '{{json .Mounts}}' "$container" | python3 -c 'import json,sys; m=json.load(sys.stdin); assert {(x["Type"], x["Name"], x["Destination"], x["RW"]) for x in m} == {("volume", "boca-socios_boca_data", "/data", True), ("volume", "boca-socios_boca_key", "/run/secrets", False), ("volume", "boca-socios_boca_owner", "/run/owner", False)}'
          docker exec --user 10001:10001 "$container" python -m boca_socios.runtime_probe
          curl --fail --silent --show-error --noproxy '*' \
            --resolve localhost:8443:127.0.0.1 \
            http://localhost:8443/healthz > "$RUNNER_TEMP/boca-beta-health.receipt"
          test "$(cat "$RUNNER_TEMP/boca-beta-health.receipt")" = BOCA_BETA_READY
      - name: Run synthetic loopback HTTP acceptance inside capped disposable controller
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: |
          container="$(docker compose -p boca-socios -f compose.beta.yaml ps -q controller)"
          [[ "$container" =~ ^[0-9a-f]{64}$ ]]
          PYTHONPATH=src python3 scripts/check_browser_lifecycle_runtime.py acceptance "$container"
      # The owner externally validated the browser-worker as a blackbox.
      # PR runner tests never start/import its implementation. Controller-only
      # HTTP acceptance above and Telegram offline checks below remain gated.
      - name: Verify offline sender readiness and never-started production network inspect
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          docker volume create --driver local --label "boca.ci.lifecycle-attempt=$GITHUB_RUN_ID" \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_telegram boca-socios_boca_telegram
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 --no-healthcheck \
            --mount type=volume,source=boca-socios_boca_telegram,target=/run/telegram,volume-nocopy \
            "$BOCA_IMAGE" python -c 'import os; os.chown("/run/telegram",10001,10001); os.chmod("/run/telegram",0o700)'
          docker run --rm --pull never -i --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 128m \
            --cpus 0.25 --no-healthcheck --tmpfs /tmp:rw,noexec,nosuid,size=8m \
            --mount type=volume,source=boca-socios_boca_data,target=/data,volume-nocopy \
            --mount type=volume,source=boca-socios_boca_telegram,target=/run/telegram,volume-nocopy \
            "$BOCA_IMAGE" python - seed-sender "$GITHUB_SHA" < scripts/check_browser_lifecycle_runtime.py
          PYTHONPATH=src python3 scripts/check_browser_lifecycle_runtime.py sender
      - name: Remove only new lifecycle resources from disposable runner
        if: always() && steps.docs_pr_scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          for name in boca-socios-browser-worker-1 boca-socios-telegram-1 "boca-ci-telegram-offline-$GITHUB_RUN_ID"; do
            if docker inspect "$name" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{ index .Config.Labels "boca.socios.browser-ipc-attempt" }}' "$name")" = "$GITHUB_RUN_ID"
              timeout 20s docker stop --time 8 "$name" >/dev/null
              docker rm "$name" >/dev/null
              if docker inspect "$name" >/dev/null 2>&1; then exit 1; fi
            fi
          done
          # The controller may still have its read-only IPC mount after a failure.
          if docker inspect boca-socios-controller-1 >/dev/null 2>&1; then
            if [[ "$(docker inspect --format '{{ index .Config.Labels "boca.socios.browser-ipc-attempt" }}' boca-socios-controller-1)" = "$GITHUB_RUN_ID" ]]; then
              timeout 20s docker stop --time 8 boca-socios-controller-1 >/dev/null
              docker rm boca-socios-controller-1 >/dev/null
            fi
          fi
          if docker volume inspect boca-socios_boca_browser_ipc >/dev/null 2>&1; then
            test "$(docker volume inspect --format '{{ index .Labels "boca.ci.lifecycle-attempt" }}' boca-socios_boca_browser_ipc)" = "$GITHUB_RUN_ID"
            docker volume rm boca-socios_boca_browser_ipc >/dev/null
            if docker volume inspect boca-socios_boca_browser_ipc >/dev/null 2>&1; then exit 1; fi
          fi
          if docker image inspect "$BOCA_BROWSER_IMAGE" >/dev/null 2>&1; then docker image rm "$BOCA_BROWSER_IMAGE" >/dev/null; fi
      - name: Remove only synthetic Boca resources from disposable runner
        if: always() && steps.docs_pr_scope.outputs.docs_only != 'true'
        run: |
          docker compose -p boca-socios -f compose.beta.yaml stop controller || true
          docker compose -p boca-socios -f compose.beta.yaml rm -sf controller || true
          docker compose -p boca-socios -f compose.yaml stop controller || true
          docker compose -p boca-socios -f compose.yaml rm -sf controller || true
          docker rm -f boca-socios-telegram-test-1 || true
          docker network rm boca-socios_telegram_egress || true
          docker volume rm boca-socios_boca_data || true
          docker volume rm boca-socios_boca_key || true
          docker volume rm boca-socios_boca_owner || true
          docker volume rm boca-socios_boca_telegram || true
          docker network rm boca-socios_boca_private || true

      - name: Clean disposable browser runner resources
        if: always() && steps.docs_pr_scope.outputs.docs_only != 'true'
        env:
          BOCA_PUBLIC_BROWSER_NAME: boca-browser-public-dom-${{ github.run_id }}-${{ github.run_attempt }}
          BOCA_TELEGRAM_UI_NAME: boca-browser-telegram-ui-${{ github.run_id }}-${{ github.run_attempt }}
          BOCA_TELEGRAM_VERIFY_NAME: boca-telegram-ui-verify-${{ github.run_id }}-${{ github.run_attempt }}
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_CONTROLLER_TAG: boca-socios-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          # Hosted disposable runner only. Never operate a droplet or prune a daemon.
          docker info > /dev/null
          for name in "$BOCA_PUBLIC_BROWSER_NAME" "$BOCA_TELEGRAM_UI_NAME" "$BOCA_TELEGRAM_VERIFY_NAME"; do
            if docker container inspect "$name" > /dev/null 2>&1; then
              docker container stop --time 5 "$name" > /dev/null 2>&1 || true
              docker container rm --force "$name" > /dev/null
            fi
            if docker container inspect "$name" > /dev/null 2>&1; then
              echo 'BOCA_BROWSER_CLEANUP state=NO_GO container=still_present' >&2
              exit 1
            fi
          done
          for tag in "$BOCA_BROWSER_TAG" "$BOCA_CONTROLLER_TAG" "boca-release-validation:$GITHUB_SHA" "boca-browser-release-validation:$GITHUB_SHA" "boca-observer:$GITHUB_SHA"; do
            if docker image inspect "$tag" > /dev/null 2>&1; then
              docker image rm "$tag" > /dev/null
            fi
          done
          echo 'BOCA_BROWSER_CLEANUP state=PASS container=absent images=absent'

