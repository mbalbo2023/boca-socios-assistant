name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_quality:
    name: fast-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exactly the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify exact internal PR Markdown-only changes
        id: docs_pr_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          docs_only="$(python3 scripts/classify_exact_internal_pr_docs.py)" || docs_only=false
          [[ "$docs_only" == true ]] || docs_only=false
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          if [[ "$docs_only" == true ]]; then
            echo 'BOCA_CI_SCOPE mode=DOCS_ONLY fast=MARKDOWN_DIFF_ONLY event=INTERNAL_PR'
          else
            echo 'BOCA_CI_SCOPE mode=FULL fast=RUFF_FORMAT_MYPY'
          fi
      - name: Verify Markdown-only diff whitespace
        if: steps.docs_pr_scope.outputs.docs_only == 'true'
        run: git diff --check HEAD^1 HEAD -- docs/ADR docs/handoffs
      - name: Set up Python
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned package manager
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: python -m pip install --disable-pip-version-check uv==0.13.4
      - name: Verify immutable dependency graph
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: uv sync --frozen
      - name: Lint
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: uv run ruff check .
      - name: Format
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: uv run ruff format --check .
      - name: Types
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: uv run mypy src
      - name: Collect exact pytest inventory before Docker builds
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          # Import and collection closure, without executing the test cases.
          # Catches missing test-only dependencies before two Docker builds.
          if uv run pytest --collect-only -q > "$RUNNER_TEMP/boca-pytest-collection.txt" 2>&1; then
            tail -n 2 "$RUNNER_TEMP/boca-pytest-collection.txt"
          else
            tail -n 25 "$RUNNER_TEMP/boca-pytest-collection.txt"
            exit 1
          fi

  quality:
    name: quality-and-tests
    needs: fast_quality
    # Never leave a required quality context green-by-skip after a red
    # preflight. GitHub treats skipped jobs differently from failed jobs.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require successful fast-quality gate
        env:
          FAST_QUALITY_RESULT: ${{ needs.fast_quality.result }}
        run: test "$FAST_QUALITY_RESULT" = success
      - name: Checkout exactly the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify exact internal PR Markdown-only changes
        id: docs_pr_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          docs_only="$(python3 scripts/classify_exact_internal_pr_docs.py)" || docs_only=false
          [[ "$docs_only" == true ]] || docs_only=false
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          if [[ "$docs_only" == true ]]; then
            echo 'BOCA_CI_SCOPE mode=DOCS_ONLY quality=MARKDOWN_DIFF_ONLY images=NOT_REQUIRED event=INTERNAL_PR'
          else
            echo 'BOCA_CI_SCOPE mode=FULL quality=REQUIRED images=REQUIRED'
          fi
      - name: Set up Python
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned package manager
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: python -m pip install --disable-pip-version-check uv==0.13.4
      - name: Verify immutable dependency graph
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: uv sync --frozen
      - name: Validate resolved Boca-only Compose model
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_ENVIRONMENT: staging
        run: |
          docker compose -f compose.yaml config --format json > "$RUNNER_TEMP/boca-compose.json"
          uv run python scripts/check_deploy_contract.py "$RUNNER_TEMP/boca-compose.json" "$BOCA_IMAGE"
      - name: Validate optional dual-service IPC Compose resolution without host access
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_BROWSER_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant-browser@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BOCA_PANEL_ORIGIN: http://localhost:8443
          BOCA_OWNER_SUBJECT: synthetic-ci-owner
          BOCA_BROWSER_ATTEMPT_ID: "123456"
          BOCA_BROWSER_SECCOMP_PATH: /srv/boca-socios/seccomp_profile.json
          BOCA_CONTROL_DIR: /home/boca-deploy/.boca-on-demand/socket
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml config --format json > "$RUNNER_TEMP/boca-ipc-v2-model.json"
          uv run python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-ipc-v2-model.json" "$BOCA_IMAGE" --topology=browser-ipc-v2
      - name: Validate opt-in Telegram Compose syntax
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_SOURCE_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_TELEGRAM_EXPECTED_BOT_ID: "123"
          BOCA_TELEGRAM_EXPECTED_CHAT_HMAC: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BOCA_BROWSER_ATTEMPT_ID: "123456"
          BOCA_TELEGRAM_ATTEMPT_ID: "123457"
        run: docker compose -f compose.telegram.json --profile telegram-opt-in config --format json > "$RUNNER_TEMP/boca-telegram-compose.json"
      - name: Test
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        # Pytest ignores four test modules importing the two owner-locked files;
        # all unrelated tests and RCA selectors remain subject to the gates.
        # Two workers still generate one full JUnit report for the RCA gate.
        run: uv run pytest -q -n 2 --junitxml="$RUNNER_TEMP/rca-tests.xml"
      - name: Prove real AF_UNIX synthetic engine start stop on disposable Linux runner
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        # No Docker access, host SSH, outside socket or Boca/Telegram traffic.
        # Local sandbox cannot create AF_UNIX; this exact-SHA runner proof is required.
        run: uv run python scripts/check_engine_socket_linux.py
      - name: Prove real UID10001/10002 browser IPC refusal and STOP on disposable Linux runner
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        # Local executor denies AF_UNIX; GitHub-hosted runner uses sudo only to
        # create three disposable, distinct-UID fixture processes. No Docker,
        # SITE_URL, Chromium, IP traffic, secrets, host SSH or deployment.
        # Use Ubuntu's root-owned Python 3.12: setup-python's virtualenv can
        # link toolcache libpython and lose its private loader path after sudo
        # and Popen(user=UID10002). This harness imports stdlib-only IPC code.
        timeout-minutes: 1
        run: sudo --non-interactive env PYTHONPATH="$GITHUB_WORKSPACE/src" /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/check_worker_ipc_linux.py"
      - name: Verify socket activation in a disposable systemd user manager
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: python3 scripts/lab_on_demand_systemd.py
      - name: Enforce accepted RCA lessons against executed regressions
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: uv run python scripts/check_rca_lessons.py "$RUNNER_TEMP/rca-tests.xml"
      - name: Repository isolation gate
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: uv run python scripts/check_repo_policy.py
      - name: Audit GitHub Actions security (offline)
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
          advanced-security: false
          annotations: true
          online-audits: false
          persona: regular
          min-severity: medium
          min-confidence: high

  image:
    name: image-build
    needs: fast_quality
    if: needs.fast_quality.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BOCA_IMAGE: boca-socios-ci:${{ github.sha }}
      BOCA_BROWSER_IMAGE: boca-browser-ci:${{ github.sha }}
      BOCA_BROWSER_ATTEMPT_ID: ${{ github.run_id }}
      BOCA_BROWSER_SECCOMP_PATH: ${{ github.workspace }}/docker/seccomp_profile.json
      BOCA_CONTROL_DIR: /home/boca-deploy/.boca-on-demand/socket
      BOCA_ENVIRONMENT: staging
      BOCA_PANEL_ORIGIN: http://localhost:8443
      BOCA_OWNER_SUBJECT: synthetic-owner
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify exact internal PR Markdown-only changes
        id: docs_pr_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          # The same exact-Git classifier is shared by both CI jobs.
          # A failure, fork, nonmerge, source edit or missing history is FULL.
          docs_only="$(python3 scripts/classify_exact_internal_pr_docs.py)" || docs_only=false
          [[ "$docs_only" == true ]] || docs_only=false
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          if [[ "$docs_only" == true ]]; then
            echo 'BOCA_CI_SCOPE mode=DOCS_ONLY images=NOT_REQUIRED security=UNCHANGED event=INTERNAL_PR'
          else
            echo 'BOCA_CI_SCOPE mode=FULL images=REQUIRED scans=REQUIRED labs=REQUIRED'
          fi
      - name: Set up ephemeral BuildKit for exact local image pair
        # The PR can restore trusted main cache but cannot export into it.
        # Only a reviewed main push seeds each role's independent cache.
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        id: setup_buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build isolated image without deploying
        if: steps.docs_pr_scope.outputs.docs_only != 'true' && steps.setup_buildx.outcome == 'success'
        id: cached_controller_build
        # A failure of the optional cache service must not veto the exact
        # Dockerfile build; the following cold fallback is mandatory.
        continue-on-error: true
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            boca-socios-ci:${{ github.sha }}
            boca-release-validation:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=boca-main-controller-r247,timeout=30s
          cache-to: ${{ github.event_name == 'push' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.ref == 'refs/heads/main' && 'type=gha,scope=boca-main-controller-r247,mode=max,timeout=30s,ignore-error=true' || '' }}
      - name: Build controller cold if optional BuildKit cache failed
        if: steps.docs_pr_scope.outputs.docs_only != 'true' && (steps.setup_buildx.outcome == 'failure' || steps.cached_controller_build.outcome == 'failure')
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "boca-socios-ci:$SOURCE_SHA" --tag "boca-release-validation:$SOURCE_SHA" .
          echo 'BOCA_CACHE_FALLBACK role=controller cache=FAILED source=EXACT' >> "$GITHUB_STEP_SUMMARY"
      - name: Build isolated Chromium worker without deploying
        if: steps.docs_pr_scope.outputs.docs_only != 'true' && steps.setup_buildx.outcome == 'success'
        id: cached_browser_build
        continue-on-error: true
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.browser
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            boca-browser-ci:${{ github.sha }}
            boca-browser-release-validation:${{ github.sha }}
            boca-observer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant
            org.opencontainers.image.revision=${{ github.sha }}
            org.boca.public-image=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=boca-main-browser-r247,timeout=30s
          cache-to: ${{ github.event_name == 'push' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.ref == 'refs/heads/main' && 'type=gha,scope=boca-main-browser-r247,mode=max,timeout=30s,ignore-error=true' || '' }}
      - name: Build browser cold if optional BuildKit cache failed
        if: steps.docs_pr_scope.outputs.docs_only != 'true' && (steps.setup_buildx.outcome == 'failure' || steps.cached_browser_build.outcome == 'failure')
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --file Dockerfile.browser \
            --label "org.opencontainers.image.source=https://github.com/mbalbo2023/boca-socios-assistant" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.boca.public-image=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --tag "boca-browser-ci:$SOURCE_SHA" \
            --tag "boca-browser-release-validation:$SOURCE_SHA" --tag "boca-observer:$SOURCE_SHA" .
          echo 'BOCA_CACHE_FALLBACK role=browser cache=FAILED source=EXACT' >> "$GITHUB_STEP_SUMMARY"
      - name: Prove healthless worker inspect formats on disposable runner Docker
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        env:
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_DOCKER_FIXTURE_NAME: boca-r78-inspect-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # GitHub-hosted runner only: the container is NEVER started. Its
          # exact CID is removed by this same step, including on failures.
          fixture_id=""
          cleanup_fixture() {
            if [[ -n "$fixture_id" ]] && docker container inspect "$fixture_id" > /dev/null 2>&1; then
              docker container rm "$fixture_id" > /dev/null
            fi
          }
          trap cleanup_fixture EXIT
          fixture_id="$(docker create --no-healthcheck --network none \
            --name "$BOCA_DOCKER_FIXTURE_NAME" \
            --label com.docker.compose.project=boca-socios \
            --label boca.socios.cutover-preflight-attempt=42329475083 \
            --label org.opencontainers.image.revision=92624ed6b7e75c6010f59670c866df00a29766dd \
            "$BOCA_BROWSER_TAG")"
          python3 - "$fixture_id" <<'PY'
          import json
          import os
          import subprocess
          import sys

          from scripts import host_cutover_postapply_reconcile as reconcile
          from scripts import host_cutover_worker_inspect as observer

          cid = sys.argv[1]
          compact = subprocess.run(
              ("docker", "inspect", "--format", observer.INSPECT_NO_HEALTH, cid),
              check=True, capture_output=True, text=True, timeout=12,
          ).stdout.strip()
          record = json.loads(compact)
          assert record["id"] == cid and record["health"] is None
          assert record["project"] == "boca-socios"
          assert record["attempt"] == "42329475083"
          def inspect_projection(template):
              result = subprocess.run(
                  ("docker", "inspect", "--format", template, cid),
                  check=True, capture_output=True, text=True, timeout=12,
              )
              return json.loads(result.stdout)

          item = inspect_projection(reconcile.INSPECT_FORMAT)
          assert item["id"] == cid and item["health"] is None and item["running"] is False
          runtime = inspect_projection(reconcile.PINNED_RUNTIME_FORMAT)
          assert runtime[:6] == [cid, "boca-socios", "created", 0, None, 0]
          config = inspect_projection(reconcile.PINNED_CONFIG_FORMAT)
          assert config[:4] == [
              cid, "boca-socios", "/" + os.environ["BOCA_DOCKER_FIXTURE_NAME"],
              os.environ["BOCA_BROWSER_TAG"],
          ]
          size = subprocess.run(
              ("docker", "inspect", "--format", observer.INSPECT_FULL_JSON_LENGTH, cid),
              check=True, capture_output=True, text=True, timeout=12,
          ).stdout.strip()
          assert size.isdecimal() and 0 < int(size) < 10**9
          print("BOCA_WORKER_DOCKER_TEMPLATE state=PASS health=ABSENT observer_writes=0 inspect_json=REDACTED")
          # Exercise the exact stopped-only Docker primitive used by R79,
          # strictly on this disposable CI fixture (never the pinned host CID).
          removed = subprocess.run(
              ("docker", "container", "rm", cid),
              check=True, capture_output=True, text=True, timeout=12,
          )
          assert removed.stdout.strip() == cid
          for selector in (f"id={cid}", f"name=^/{os.environ['BOCA_DOCKER_FIXTURE_NAME']}$"):
              absent = subprocess.run(
                  ("docker", "ps", "-a", "-q", "--no-trunc", "--filter", selector),
                  check=True, capture_output=True, text=True, timeout=12,
              )
              assert absent.stdout.strip() == ""
          print("BOCA_WORKER_RECOVERY_DOCKER state=PASS removed=EXACT_CID post=ABSENT runner=EPHEMERAL")
          PY
      - name: Set up Python for the host-side Docker labs
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked runtime dependencies for the Docker labs
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          uv sync --frozen --no-dev --no-install-project
      - name: Verify image identity and missing-image evidence on runner Docker
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        timeout-minutes: 3
        env:
          PYTHONPATH: src
          BOCA_LAB_RUNNER: ${{ runner.environment }}
        run: uv run --no-sync python -m scripts.lab_image_recovery_916
      - name: Prove independent capture and panel restart labs in parallel
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        # The browser capture is network-none and uses only attempt-owned CIDs;
        # the separate controller fixture owns runner loopback 8443. Neither
        # script depends on the other's result or touches the deployment host.
        # Wait for BOTH, even on an early failure. Later image consumers and
        # the existing always-run cleanup start only after this barrier.
        timeout-minutes: 4
        env:
          PYTHONPATH: src
          BOCA_LAB_RUNNER: ${{ runner.environment }}
        run: |
          set -euo pipefail
          capture_log="$(mktemp "${RUNNER_TEMP}/boca-ci-capture.XXXXXXXX")"
          panel_log="$(mktemp "${RUNNER_TEMP}/boca-ci-panel.XXXXXXXX")"
          started_at="$(date +%s)"
          timeout --signal=TERM --kill-after=10s 120s \
            python3 -m scripts.check_worker_start_capture > "$capture_log" 2>&1 &
          capture_pid=$!
          timeout --signal=TERM --kill-after=10s 180s \
            uv run --no-sync python -m scripts.lab_panel_restart_921 > "$panel_log" 2>&1 &
          panel_pid=$!
          capture_rc=0
          panel_rc=0
          if wait "$capture_pid"; then :; else capture_rc=$?; fi
          if wait "$panel_pid"; then :; else panel_rc=$?; fi
          printf '::group::Boca network-none browser capture lab\n'
          cat "$capture_log"
          printf '::endgroup::\n::group::Boca isolated controller panel restart lab\n'
          cat "$panel_log"
          printf '::endgroup::\n'
          result=PASS
          if (( capture_rc != 0 || panel_rc != 0 )); then result=FAIL; fi
          elapsed=$(( $(date +%s) - started_at ))
          printf 'BOCA_CI_PARALLEL_LABS result=%s capture_rc=%s panel_rc=%s wall_seconds=%s source_sha=%s\n' \
            "$result" "$capture_rc" "$panel_rc" "$elapsed" "$GITHUB_SHA" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$result" == PASS ]]
      - name: Measure one offline Chromium startup under resource caps
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        run: >-
          docker run --rm --init --network none --cgroupns=private --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777
          --tmpfs /home/boca-browser:rw,nosuid,nodev,noexec,size=32m,uid=10002,gid=10002,mode=700
          --shm-size=128m --pids-limit=128 --memory=768m --cpus=1
          --security-opt seccomp=docker/seccomp_profile.json
          --security-opt no-new-privileges --cap-drop ALL --cap-add SYS_CHROOT
          --user 10002:10002 boca-browser-ci:${{ github.sha }}
          python -m scripts.measure_browser_budget
      # No synthetic Chromium DOM journey is run against owner-locked browser
      # modules. Their external validation is owner-managed (ADR0123).
      - name: Run public-login structural fixtures in offline Chromium
        if: steps.docs_pr_scope.outputs.docs_only != 'true'
        env:
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_PUBLIC_BROWSER_NAME: boca-browser-public-dom-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Bind only the offline fixture runner; the browser image already
          # contains the reviewed public DOM predicate at this exact SHA.
