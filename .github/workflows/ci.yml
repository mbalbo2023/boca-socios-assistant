name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exactly the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned package manager
        run: python -m pip install --disable-pip-version-check uv==0.13.4
      - name: Verify immutable dependency graph
        run: uv sync --frozen
      - name: Validate resolved Boca-only Compose model
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_ENVIRONMENT: staging
        run: |
          docker compose -f compose.yaml config --format json > "$RUNNER_TEMP/boca-compose.json"
          uv run python scripts/check_deploy_contract.py "$RUNNER_TEMP/boca-compose.json" "$BOCA_IMAGE"
      - name: Validate optional dual-service IPC Compose resolution without host access
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_BROWSER_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant-browser@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BOCA_PANEL_ORIGIN: http://localhost:8443
          BOCA_OWNER_SUBJECT: synthetic-ci-owner
          BOCA_BROWSER_ATTEMPT_ID: "123456"
          BOCA_BROWSER_SECCOMP_PATH: /srv/boca-socios/seccomp_profile.json
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml config --format json > "$RUNNER_TEMP/boca-ipc-v2-model.json"
          uv run python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-ipc-v2-model.json" "$BOCA_IMAGE" --topology=browser-ipc-v2
      - name: Validate opt-in Telegram Compose syntax
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_SOURCE_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_TELEGRAM_EXPECTED_BOT_ID: "123"
          BOCA_TELEGRAM_EXPECTED_CHAT_HMAC: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BOCA_BROWSER_ATTEMPT_ID: "123456"
          BOCA_TELEGRAM_ATTEMPT_ID: "123457"
        run: docker compose -f compose.telegram.json --profile telegram-opt-in config --format json > "$RUNNER_TEMP/boca-telegram-compose.json"
      - name: Lint
        # Ruff excludes only the two owner-controlled blackbox modules in pyproject.toml.
        run: uv run ruff check .
      - name: Format
        # The owner's exact bytes are not formatted or interpreted by this job.
        run: uv run ruff format --check .
      - name: Types
        # Mypy excludes the blackbox paths and skips following imports of those modules.
        run: uv run mypy src
      - name: Test
        # Pytest ignores four test modules importing the two owner-locked files;
        # all unrelated tests and RCA selectors remain subject to the gates.
        # Two workers still generate one full JUnit report for the RCA gate.
        run: uv run pytest -q -n 2 --junitxml="$RUNNER_TEMP/rca-tests.xml"
      - name: Prove real AF_UNIX synthetic engine start stop on disposable Linux runner
        # No Docker access, host SSH, outside socket or Boca/Telegram traffic.
        # Local sandbox cannot create AF_UNIX; this exact-SHA runner proof is required.
        run: uv run python scripts/check_engine_socket_linux.py
      - name: Enforce accepted RCA lessons against executed regressions
        run: uv run python scripts/check_rca_lessons.py "$RUNNER_TEMP/rca-tests.xml"
      - name: Repository isolation gate
        run: uv run python scripts/check_repo_policy.py
      - name: Audit GitHub Actions security (offline)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
          advanced-security: false
          annotations: true
          online-audits: false
          persona: regular
          min-severity: medium
          min-confidence: high

  image:
    name: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated image without deploying
        run: docker build --tag boca-socios-ci:${{ github.sha }} .
      - name: Build isolated Chromium worker without deploying
        run: docker build --file Dockerfile.browser --tag boca-browser-ci:${{ github.sha }} .
      - name: Prove healthless worker inspect formats on disposable runner Docker
        env:
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_DOCKER_FIXTURE_NAME: boca-r78-inspect-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # GitHub-hosted runner only: the container is NEVER started. Its
          # exact CID is removed by this same step, including on failures.
          fixture_id=""
          cleanup_fixture() {
            if [[ -n "$fixture_id" ]] && docker container inspect "$fixture_id" > /dev/null 2>&1; then
              docker container rm "$fixture_id" > /dev/null
            fi
          }
          trap cleanup_fixture EXIT
          fixture_id="$(docker create --no-healthcheck --network none \
            --name "$BOCA_DOCKER_FIXTURE_NAME" \
            --label com.docker.compose.project=boca-socios \
            --label boca.socios.cutover-preflight-attempt=42329475083 \
            --label org.opencontainers.image.revision=92624ed6b7e75c6010f59670c866df00a29766dd \
            "$BOCA_BROWSER_TAG")"
          python3 - "$fixture_id" <<'PY'
          import json
          import os
          import subprocess
          import sys

          from scripts import host_cutover_worker_inspect as observer

          cid = sys.argv[1]
          compact = subprocess.run(
              ("docker", "inspect", "--format", observer.INSPECT_NO_HEALTH, cid),
              check=True, capture_output=True, text=True, timeout=12,
          ).stdout.strip()
          record = json.loads(compact)
          assert record["id"] == cid and record["health"] is None
          assert record["project"] == "boca-socios"
          assert record["attempt"] == "42329475083"
          size = subprocess.run(
              ("docker", "inspect", "--format", observer.INSPECT_FULL_JSON_LENGTH, cid),
              check=True, capture_output=True, text=True, timeout=12,
          ).stdout.strip()
          assert size.isdecimal() and 0 < int(size) < 10**9
          print("BOCA_WORKER_DOCKER_TEMPLATE state=PASS health=ABSENT observer_writes=0 inspect_json=REDACTED")
          # Exercise the exact stopped-only Docker primitive used by R79,
          # strictly on this disposable CI fixture (never the pinned host CID).
          removed = subprocess.run(
              ("docker", "container", "rm", cid),
              check=True, capture_output=True, text=True, timeout=12,
          )
          assert removed.stdout.strip() == cid
          for selector in (f"id={cid}", f"name=^/{os.environ['BOCA_DOCKER_FIXTURE_NAME']}$"):
              absent = subprocess.run(
                  ("docker", "ps", "-a", "-q", "--no-trunc", "--filter", selector),
                  check=True, capture_output=True, text=True, timeout=12,
              )
              assert absent.stdout.strip() == ""
          print("BOCA_WORKER_RECOVERY_DOCKER state=PASS removed=EXACT_CID post=ABSENT runner=EPHEMERAL")
          PY
      - name: Measure one offline Chromium startup under resource caps
        run: >-
          docker run --rm --init --network none --cgroupns=private --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777
          --tmpfs /home/boca-browser:rw,nosuid,nodev,noexec,size=32m,uid=10002,gid=10002,mode=700
          --shm-size=128m --pids-limit=128 --memory=768m --cpus=1
          --security-opt seccomp=docker/seccomp_profile.json
          --security-opt no-new-privileges --cap-drop ALL --cap-add SYS_CHROOT
          --user 10002:10002 boca-browser-ci:${{ github.sha }}
          python -m scripts.measure_browser_budget
      # No synthetic Chromium DOM journey is run against owner-locked browser
      # modules. Their external validation is owner-managed (ADR0123).
      - name: Run public-login structural fixtures in offline Chromium
        env:
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_PUBLIC_BROWSER_NAME: boca-browser-public-dom-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Bind only the offline fixture runner; the browser image already
          # contains the reviewed public DOM predicate at this exact SHA.
          # No navigation or Boca request: set_content() with invented HTML.
          timeout --signal=TERM --kill-after=10s 90s \
            docker run --rm --init --name "$BOCA_PUBLIC_BROWSER_NAME" --network none \
            --cgroupns=private --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --tmpfs /home/boca-browser:rw,nosuid,nodev,noexec,size=32m,uid=10002,gid=10002,mode=700 \
            --shm-size=128m --pids-limit=128 --memory=768m --cpus=1 \
            --security-opt seccomp=docker/seccomp_profile.json \
            --security-opt no-new-privileges --cap-drop ALL --cap-add SYS_CHROOT \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/run_public_observer_offline_chromium.py,target=/app/scripts/run_public_observer_offline_chromium.py,readonly" \
            --user 10002:10002 "$BOCA_BROWSER_TAG" \
            python -m scripts.run_public_observer_offline_chromium --run-offline-fixtures \
            > "$RUNNER_TEMP/boca-public-dom-offline.receipt"
          python3 - "$RUNNER_TEMP/boca-public-dom-offline.receipt" <<'PY'
          import json
          from pathlib import Path
          import sys

          from scripts.run_public_observer_offline_chromium import validate_receipt

          receipt = validate_receipt(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")))
          print(f"BOCA_PUBLIC_DOM_OFFLINE state=PASS cases={receipt['cases']} network=none")
          PY
      - name: Verify private Telegram setup in offline Chromium and existing decryptor
        env:
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_CONTROLLER_TAG: boca-socios-ci:${{ github.sha }}
          BOCA_TELEGRAM_UI_NAME: boca-browser-telegram-ui-${{ github.run_id }}-${{ github.run_attempt }}
          BOCA_TELEGRAM_VERIFY_NAME: boca-telegram-ui-verify-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 scripts/run_telegram_setup_ui_offline_chromium.py --make-fixture > "$RUNNER_TEMP/boca-telegram-ui.fixture.json"
          timeout --signal=TERM --kill-after=10s 90s \
            docker run --rm --init --name "$BOCA_TELEGRAM_UI_NAME" --network none \
            --cgroupns=private --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --tmpfs /home/boca-browser:rw,nosuid,nodev,noexec,size=32m,uid=10002,gid=10002,mode=700 \
            --shm-size=128m --pids-limit=128 --memory=768m --cpus=1 \
            --security-opt seccomp=docker/seccomp_profile.json \
            --security-opt no-new-privileges --cap-drop ALL --cap-add SYS_CHROOT \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/run_telegram_setup_ui_offline_chromium.py,target=/app/scripts/run_telegram_setup_ui_offline_chromium.py,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/boca-telegram-ui.fixture.json,target=/tmp/telegram-ui.fixture.json,readonly" \
            --user 10002:10002 "$BOCA_BROWSER_TAG" \
            python -m scripts.run_telegram_setup_ui_offline_chromium --run-offline-fixture /tmp/telegram-ui.fixture.json \
            > "$RUNNER_TEMP/boca-telegram-ui.receipt"
          timeout --signal=TERM --kill-after=5s 20s \
            docker run --rm --init -i --name "$BOCA_TELEGRAM_VERIFY_NAME" --network none \
            --cgroupns=private --read-only --pids-limit=32 --memory=128m --cpus=0.25 \
            --security-opt no-new-privileges --cap-drop ALL --user 10001:10001 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/run_telegram_setup_ui_offline_chromium.py,target=/tmp/verify.py,readonly" \
            "$BOCA_CONTROLLER_TAG" python /tmp/verify.py --verify-receipt \
            < "$RUNNER_TEMP/boca-telegram-ui.receipt"
      - name: Clean disposable browser runner resources
        if: always()
        env:
          BOCA_PUBLIC_BROWSER_NAME: boca-browser-public-dom-${{ github.run_id }}-${{ github.run_attempt }}
          BOCA_TELEGRAM_UI_NAME: boca-browser-telegram-ui-${{ github.run_id }}-${{ github.run_attempt }}
          BOCA_TELEGRAM_VERIFY_NAME: boca-telegram-ui-verify-${{ github.run_id }}-${{ github.run_attempt }}
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_CONTROLLER_TAG: boca-socios-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          # Hosted disposable runner only. Never operate a droplet or prune a daemon.
          docker info > /dev/null
          for name in "$BOCA_PUBLIC_BROWSER_NAME" "$BOCA_TELEGRAM_UI_NAME" "$BOCA_TELEGRAM_VERIFY_NAME"; do
            if docker container inspect "$name" > /dev/null 2>&1; then
              docker container stop --time 5 "$name" > /dev/null 2>&1 || true
              docker container rm --force "$name" > /dev/null
            fi
            if docker container inspect "$name" > /dev/null 2>&1; then
              echo 'BOCA_BROWSER_CLEANUP state=NO_GO container=still_present' >&2
              exit 1
            fi
          done
          for tag in "$BOCA_BROWSER_TAG" "$BOCA_CONTROLLER_TAG"; do
            if docker image inspect "$tag" > /dev/null 2>&1; then
              docker image rm "$tag" > /dev/null
            fi
          done
          echo 'BOCA_BROWSER_CLEANUP state=PASS container=absent images=absent'

