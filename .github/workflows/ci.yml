name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exactly the requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned package manager
        run: python -m pip install --disable-pip-version-check uv==0.13.4
      - name: Verify immutable dependency graph
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q
      - name: Repository isolation gate
        run: uv run python scripts/check_repo_policy.py

  image:
    name: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build isolated image without deploying
        run: docker build --tag boca-socios-ci:${{ github.sha }} .

