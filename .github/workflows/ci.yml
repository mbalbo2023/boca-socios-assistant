name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exactly the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned package manager
        run: python -m pip install --disable-pip-version-check uv==0.13.4
      - name: Verify immutable dependency graph
        run: uv sync --frozen
      - name: Validate resolved Boca-only Compose model
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_ENVIRONMENT: staging
        run: |
          docker compose -f compose.yaml config --format json > "$RUNNER_TEMP/boca-compose.json"
          uv run python scripts/check_deploy_contract.py "$RUNNER_TEMP/boca-compose.json" "$BOCA_IMAGE"
      - name: Validate opt-in Telegram Compose syntax
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose -f compose.telegram.json --profile telegram-opt-in config --format json > "$RUNNER_TEMP/boca-telegram-compose.json"
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q --junitxml="$RUNNER_TEMP/rca-tests.xml"
      - name: Enforce accepted RCA lessons against executed regressions
        run: uv run python scripts/check_rca_lessons.py "$RUNNER_TEMP/rca-tests.xml"
      - name: Repository isolation gate
        run: uv run python scripts/check_repo_policy.py
      - name: Audit GitHub Actions security (offline)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
          advanced-security: false
          annotations: true
          online-audits: false
          persona: regular
          min-severity: medium
          min-confidence: high

  image:
    name: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated image without deploying
        run: docker build --tag boca-socios-ci:${{ github.sha }} .
      - name: Build isolated Chromium worker without deploying
        run: docker build --file Dockerfile.browser --tag boca-browser-ci:${{ github.sha }} .
      - name: Measure one offline Chromium startup under resource caps
        run: >-
          docker run --rm --init --network none --cgroupns=private --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777
          --tmpfs /home/boca-browser:rw,nosuid,nodev,noexec,size=32m,uid=10002,gid=10002,mode=700
          --shm-size=128m --pids-limit=128 --memory=768m --cpus=1
          --security-opt seccomp=docker/seccomp_profile.json
          --security-opt no-new-privileges --cap-drop ALL --cap-add SYS_CHROOT
          --user 10002:10002 boca-browser-ci:${{ github.sha }}
          python -m scripts.measure_browser_budget
      - name: Run synthetic Chromium DOM journey offline
        env:
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_BROWSER_NAME: boca-browser-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # The existing script loads only inline synthetic HTML; the container
          # network namespace denies external egress including browser background I/O.
          timeout --signal=TERM --kill-after=10s 90s \
            docker run --rm --init --name "$BOCA_BROWSER_NAME" --network none \
            --cgroupns=private --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --tmpfs /home/boca-browser:rw,nosuid,nodev,noexec,size=32m,uid=10002,gid=10002,mode=700 \
            --shm-size=128m --pids-limit=128 --memory=768m --cpus=1 \
            --security-opt seccomp=docker/seccomp_profile.json \
            --security-opt no-new-privileges --cap-drop ALL --cap-add SYS_CHROOT \
            --user 10002:10002 "$BOCA_BROWSER_TAG" \
            python -m scripts.run_synthetic_ticket_flow \
            > "$RUNNER_TEMP/boca-synthetic-browser.receipt"
          python3 scripts/check_synthetic_browser_receipt.py \
            "$RUNNER_TEMP/boca-synthetic-browser.receipt"
      - name: Clean disposable browser runner resources
        if: always()
        env:
          BOCA_BROWSER_NAME: boca-browser-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          BOCA_BROWSER_TAG: boca-browser-ci:${{ github.sha }}
          BOCA_CONTROLLER_TAG: boca-socios-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          # Hosted disposable runner only. Never operate a droplet or prune a daemon.
          docker info > /dev/null
          if docker container inspect "$BOCA_BROWSER_NAME" > /dev/null 2>&1; then
            docker container stop --time 5 "$BOCA_BROWSER_NAME" > /dev/null 2>&1 || true
            docker container rm --force "$BOCA_BROWSER_NAME" > /dev/null
          fi
          if docker container inspect "$BOCA_BROWSER_NAME" > /dev/null 2>&1; then
            echo 'BOCA_BROWSER_CLEANUP state=NO_GO container=still_present' >&2
            exit 1
          fi
          for tag in "$BOCA_BROWSER_TAG" "$BOCA_CONTROLLER_TAG"; do
            if docker image inspect "$tag" > /dev/null 2>&1; then
              docker image rm "$tag" > /dev/null
            fi
          done
          echo 'BOCA_BROWSER_CLEANUP state=PASS container=absent images=absent'

