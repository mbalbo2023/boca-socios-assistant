name: Boca first deploy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Boca host operation; BETA install requires separate private owner/TLS and protected release gates
        required: true
        type: choice
        options: [inspect-prerequisites, port-check, prepare-rootless, preflight, first-install, diagnostic, stop-test, site-prepare, site-install, site-verify, owner-prepare, owner-install, owner-verify, beta-install, beta-acceptance, telegram-migrate, telegram-prepare, telegram-install, telegram-verify, telegram-test]
      source_sha:
        description: Exact current main commit approved for the operation
        required: true
        type: string
      image_ref:
        description: Full reviewed GHCR digest for install/diagnostic; blank for inspection/preflight
        required: false
        type: string
      release_run_id:
        description: Reviewed image release run ID for install/diagnostic/Site; blank for inspection/preflight
        required: false
        type: string
      site_envelope:
        description: Site-install only; canonical sealed JSON envelope encoded as unpadded base64url (ciphertext, never plaintext)
        required: false
        type: string
      telegram_envelope:
        description: Telegram-install only; sealed canonical JSON as unpadded base64url ciphertext
        required: false
        type: string
      owner_envelope:
        description: Owner-install only; sealed passkey/TLS JSON as unpadded base64url ciphertext
        required: false
        type: string
      service:
        description: Fixed Boca-only service
        required: true
        type: choice
        options: [controller]
      resource_budget:
        description: Fixed Boca-only maximum budget
        required: true
        type: choice
        options: [0.5cpu-256m-64pids]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('boca-first-deploy-pr-{0}', github.event.pull_request.number) || 'boca-first-deploy' }}
  cancel-in-progress: false

jobs:
  pr-validation:
    if: github.event_name == 'pull_request'
    name: first-deploy-pr-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout proposed workflow without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install frozen development graph
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          uv sync --frozen
      - name: Check dispatch and first-install boundaries offline
        run: |
          uv run pytest -q tests/test_deploy_inputs.py tests/test_deploy_contract.py tests/test_beta_deploy_contract.py tests/test_host_first_deploy.py tests/test_host_loopback_port.py tests/test_host_beta_install.py tests/test_host_beta_cleanup.py tests/test_host_beta_acceptance.py tests/test_host_site_bootstrap.py tests/test_owner_bootstrap.py tests/test_host_owner_bootstrap.py tests/test_host_cleanup.py tests/test_host_stop_test.py tests/test_host_start_existing.py tests/test_telegram_storage_gate.py tests/test_telegram_one_shot.py tests/test_host_telegram.py tests/test_key_custody.py tests/test_release_run.py
          uv run python scripts/check_repo_policy.py
      - name: Validate optional served BETA Compose model without host access
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_PANEL_ORIGIN: http://localhost:8443
          BOCA_OWNER_SUBJECT: synthetic-owner
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml config --format json > "$RUNNER_TEMP/boca-beta-model.json"
          uv run python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-beta-model.json" "$BOCA_IMAGE"

  pr-runtime-smoke:
    if: github.event_name == 'pull_request'
    name: first-deploy-runtime-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BOCA_IMAGE: boca-first-install-smoke:${{ github.sha }}
      BOCA_ENVIRONMENT: staging
      BOCA_PANEL_ORIGIN: http://localhost:8443
      BOCA_OWNER_SUBJECT: synthetic-owner
    steps:
      - name: Checkout proposed runtime without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build local simulation image only
        run: docker build --tag "$BOCA_IMAGE" .
      - name: Exercise sealed Site intake in a disposable Boca owner volume
        run: |
          set -euo pipefail
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_owner boca-socios_boca_owner
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -c 'import os; os.chmod("/run/owner", 0o700); os.chown("/run/owner", 10001, 10001)'
          receipt="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.site_bootstrap prepare)"
          [[ "$receipt" =~ ^BOCA_SITE_BOOTSTRAP\ state=PREPARED\ public_key=([A-Za-z0-9_-]{43})\ fingerprint=([0-9a-f]{64})$ ]]
          public="${BASH_REMATCH[1]}"
          fingerprint="${BASH_REMATCH[2]}"
          sealed="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "$BOCA_IMAGE" python -c 'import base64,sys; from boca_socios.site_bootstrap import RecipientReceipt,seal_for_recipient; sealed=seal_for_recipient(RecipientReceipt("PREPARED",sys.argv[1],sys.argv[2]),"synthetic-ci-payload-00000000",b"x"*32); print(base64.urlsafe_b64encode(sealed).rstrip(b"=").decode("ascii"))' "$public" "$fingerprint")"
          PYTHONPATH=src python3 -c 'import sys; from boca_socios.host_first_deploy import _site_envelope; sys.stdout.write(_site_envelope(sys.argv[1]))' "$sealed" | \
            docker run --rm -i --pull never --user 10001:10001 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
              --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
              "$BOCA_IMAGE" python -m boca_socios.site_bootstrap install
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.site_bootstrap verify)" = \
            "BOCA_SITE_BOOTSTRAP state=VERIFIED fingerprint=$fingerprint"
          docker volume rm boca-socios_boca_owner
      - name: Exercise sealed HTTP owner passkey custody in a disposable Boca volume
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/boca-owner-custody-fixture"
          mkdir -m 700 "$fixture"
          openssl ecparam -name prime256v1 -genkey -noout -out "$fixture/passkey.pem"
          openssl pkey -in "$fixture/passkey.pem" -pubout -outform DER -out "$fixture/public_key.der"
          python3 -c 'import os,pathlib,sys; pathlib.Path(sys.argv[1]).write_bytes(os.urandom(32))' "$fixture/credential_id"
          chmod 0755 "$fixture"
          chmod 0644 "$fixture/credential_id" "$fixture/public_key.der"
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_owner boca-socios_boca_owner
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -c 'import os; os.chmod("/run/owner", 0o700); os.chown("/run/owner", 10001, 10001)'
          receipt="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --tmpfs /tmp:rw,noexec,nosuid,size=4m \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap prepare "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")"
          [[ "$receipt" =~ ^BOCA_OWNER_BOOTSTRAP\ state=PREPARED\ public_key=([A-Za-z0-9_-]{43})\ fingerprint=([0-9a-f]{64})$ ]]
          public="${BASH_REMATCH[1]}"
          fingerprint="${BASH_REMATCH[2]}"
          sealed="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --tmpfs /tmp:rw,noexec,nosuid,size=4m \
            --mount "type=bind,source=$fixture,target=/fixture,readonly" \
            "$BOCA_IMAGE" python -c 'import base64,sys; from pathlib import Path; from boca_socios.owner_bootstrap import RecipientReceipt,seal_for_recipient,_bundle_limits; bundle={name:(Path("/fixture")/name).read_bytes() for name in _bundle_limits(sys.argv[3])}; sealed=seal_for_recipient(RecipientReceipt("PREPARED",sys.argv[1],sys.argv[2]),bundle,sys.argv[3],sys.argv[4]); print(base64.urlsafe_b64encode(sealed).rstrip(b"=").decode())' "$public" "$fingerprint" "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")"
          test "$(PYTHONPATH=src python3 -c 'import sys; from boca_socios.host_first_deploy import _owner_envelope; sys.stdout.write(_owner_envelope(*sys.argv[1:]))' "$sealed" "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT" | \
            docker run --rm -i --pull never --user 10001:10001 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
              --tmpfs /tmp:rw,noexec,nosuid,size=4m \
              --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
              "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap install "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")" = \
            "BOCA_OWNER_BOOTSTRAP state=CONFIGURED fingerprint=$fingerprint"
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --tmpfs /tmp:rw,noexec,nosuid,size=4m \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap verify "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")" = \
            "BOCA_OWNER_BOOTSTRAP state=VERIFIED fingerprint=$fingerprint"
          docker volume rm boca-socios_boca_owner
          rm -rf "$fixture"
      - name: Exercise sealed Telegram custody in a disposable offline Boca volume
        run: |
          set -euo pipefail
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_telegram boca-socios_boca_telegram
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_telegram,target=/run/telegram,volume-nocopy \
            "$BOCA_IMAGE" python -c 'import os; os.chmod("/run/telegram", 0o700); os.chown("/run/telegram", 10001, 10001)'
          receipt="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_telegram,target=/run/telegram,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.telegram_bootstrap prepare)"
          [[ "$receipt" =~ ^BOCA_TELEGRAM_BOOTSTRAP\ state=PREPARED\ public_key=([A-Za-z0-9_-]{43})\ fingerprint=([0-9a-f]{64})$ ]]
          printf 'BOCA_TELEGRAM_SMOKE phase=recipient_prepared\n'
          public="${BASH_REMATCH[1]}"
          fingerprint="${BASH_REMATCH[2]}"
          sealed="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "$BOCA_IMAGE" python -c 'import base64,sys; from boca_socios.telegram_bootstrap import RecipientReceipt,seal_for_recipient; value=seal_for_recipient(RecipientReceipt("PREPARED",sys.argv[1],sys.argv[2]),"12345:synthetic-bot-token-for-ci","-123456789"); print(base64.urlsafe_b64encode(value).rstrip(b"=").decode("ascii"))' "$public" "$fingerprint")"
          printf 'BOCA_TELEGRAM_SMOKE phase=sealed_offline\n'
          test "$(PYTHONPATH=src python3 -c 'import sys; from boca_socios.host_first_deploy import _telegram_envelope; sys.stdout.write(_telegram_envelope(sys.argv[1]))' "$sealed" | \
            docker run --rm -i --pull never --user 10001:10001 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
              --mount type=volume,source=boca-socios_boca_telegram,target=/run/telegram,volume-nocopy \
              "$BOCA_IMAGE" python -m boca_socios.telegram_bootstrap install)" = \
            "BOCA_TELEGRAM_BOOTSTRAP state=CONFIGURED fingerprint=$fingerprint"
          printf 'BOCA_TELEGRAM_SMOKE phase=installed_offline\n'
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_telegram,target=/run/telegram,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.telegram_bootstrap verify)" = \
            "BOCA_TELEGRAM_BOOTSTRAP state=VERIFIED fingerprint=$fingerprint"
          docker volume rm boca-socios_boca_telegram
      - name: Provision separate owner-only key volume on disposable runner
        run: |
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_key boca-socios_boca_key
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.security.key_custody init
          if docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.security.key_custody init >/dev/null 2>&1; then
            exit 1
          fi
          docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.security.key_custody verify
      - name: Start isolated Compose controller and verify health without third-party traffic
        run: |
          docker compose -p boca-socios -f compose.yaml up --no-build --no-deps --wait --wait-timeout 90 -d controller
          container="$(docker compose -p boca-socios -f compose.yaml ps -q controller)"
          test -n "$container"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          test "$(docker exec --user 10001:10001 "$container" python -m boca_socios.security.key_custody inspect)" = BOCA_KEY_READY
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert (h["NanoCpus"], h["Memory"], h["PidsLimit"], h["ReadonlyRootfs"], h["Privileged"], h["PortBindings"], h["PublishAllPorts"]) == (500000000, 268435456, 64, True, False, {}, False)'
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["NetworkMode"] == "boca-socios_boca_private" and h["CapDrop"] == ["ALL"] and h["CapAdd"] in (None, []) and h["SecurityOpt"] == ["no-new-privileges:true"] and h["Tmpfs"] == {"/tmp": "rw,noexec,nosuid,size=16m"} and h["CgroupnsMode"] in ("private", "")'
          docker inspect --format '{{json .NetworkSettings}}' "$container" | python3 -c 'import json,sys; n=json.load(sys.stdin); assert n["Ports"] == {} and set(n["Networks"]) == {"boca-socios_boca_private"} and len(n["Networks"]["boca-socios_boca_private"]["NetworkID"]) == 64'
          network_id="$(docker inspect --format '{{json .NetworkSettings}}' "$container" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Networks"]["boca-socios_boca_private"]["NetworkID"])')"
          docker network inspect --format '{{json .}}' "$network_id" | python3 -c 'import json,sys; n=json.load(sys.stdin); cid,nid=sys.argv[1:]; assert n["Id"] == nid and n["Name"] == "boca-socios_boca_private" and n["Driver"] == "bridge" and n["Scope"] == "local" and n["Internal"] is False and n["Attachable"] is False and n["Ingress"] is False and set(n["Containers"]) == {cid} and n["Labels"]["com.docker.compose.project"] == "boca-socios" and n["Labels"]["com.docker.compose.network"] == "boca_private"' "$container" "$network_id"
          docker exec --user 10001:10001 "$container" python -m boca_socios.runtime_probe
          docker inspect --format '{{json .Mounts}}' "$container" | python3 -c 'import json,sys; m=json.load(sys.stdin); assert {(x["Type"], x["Name"], x["Destination"], x["RW"]) for x in m} == {("volume", "boca-socios_boca_data", "/data", True), ("volume", "boca-socios_boca_key", "/run/secrets", False)}'
          docker logs "$container" | python3 -c 'import json,sys; rows=[json.loads(x) for x in sys.stdin if x.strip()]; assert rows == [{"event": "started", "mode": "simulation", "engine": "off", "site_calls": 0}]'
      - name: Prepare synthetic owner bundle and new-only BETA database on disposable runner
        run: |
          docker compose -p boca-socios -f compose.yaml stop controller
          docker compose -p boca-socios -f compose.yaml rm -sf controller
          docker volume rm boca-socios_boca_data
          mkdir -m 700 "$RUNNER_TEMP/boca-owner-fixture"
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/boca-owner-fixture/passkey.pem"
          openssl pkey -in "$RUNNER_TEMP/boca-owner-fixture/passkey.pem" -pubout -outform DER -out "$RUNNER_TEMP/boca-owner-fixture/public_key.der"
          python3 -c 'import os,pathlib,sys; pathlib.Path(sys.argv[1]).write_bytes(os.urandom(32))' "$RUNNER_TEMP/boca-owner-fixture/credential_id"
          # Only disposable synthetic inputs are readable by the cap-dropped copy container.
          chmod 0755 "$RUNNER_TEMP/boca-owner-fixture"
          chmod 0644 "$RUNNER_TEMP/boca-owner-fixture/credential_id" \
            "$RUNNER_TEMP/boca-owner-fixture/public_key.der"
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_owner boca-socios_boca_owner
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner \
            --mount "type=bind,source=$RUNNER_TEMP/boca-owner-fixture,target=/fixture,readonly" \
            "$BOCA_IMAGE" sh -eu -c 'cp /fixture/credential_id /fixture/public_key.der /run/owner/; chmod 0400 /run/owner/*; chown 10001:10001 /run/owner/*; chmod 0700 /run/owner; chown 10001:10001 /run/owner'
          # Probe the actual image with an owner-only mount, then key+owner;
          # neither can open a database or listener before data creation.
          beta_env=(
            --env BOCA_ENVIRONMENT=staging --env BOCA_RUNTIME_MODE=simulation
            --env BOCA_ENGINE_MODE=off --env BOCA_DB_PATH=/data/boca.sqlite3
            --env BOCA_MASTER_KEY_FILE=/run/secrets/boca_master_key
            --env "BOCA_PANEL_ORIGIN=$BOCA_PANEL_ORIGIN"
            --env "BOCA_OWNER_SUBJECT=$BOCA_OWNER_SUBJECT"
            --env BOCA_PASSKEY_CREDENTIAL_ID_FILE=/run/owner/credential_id
            --env BOCA_PASSKEY_PUBLIC_KEY_DER_FILE=/run/owner/public_key.der
            --env BOCA_BIND_HOST=0.0.0.0 --env BOCA_BIND_PORT=8443
          )
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "${beta_env[@]}" \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.runtime check-beta-owner)" = \
            '{"event":"beta_owner_ready","mode":"simulation","engine":"off"}'
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "${beta_env[@]}" \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.runtime check-beta-config)" = \
            '{"event":"beta_config_ready","mode":"simulation","engine":"off"}'
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_data boca-socios_boca_data
          docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 256m --cpus 0.50 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --env BOCA_ENVIRONMENT=staging \
            --env BOCA_RUNTIME_MODE=simulation --env BOCA_ENGINE_MODE=off \
            --env BOCA_DB_PATH=/data/boca.sqlite3 \
            --env BOCA_MASTER_KEY_FILE=/run/secrets/boca_master_key \
            --mount type=volume,source=boca-socios_boca_data,target=/data \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,readonly \
            "$BOCA_IMAGE" python -m boca_socios.runtime init-beta
      - name: Inspect real disposable one-shot Docker isolation without Bot API traffic
        run: |
          set -euo pipefail
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_telegram boca-socios_boca_telegram
          docker network create --driver bridge \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.network=telegram_egress boca-socios_telegram_egress
          set +e
          docker run --pull never --name boca-socios-telegram-test-1 \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.service=telegram-test \
            --label com.docker.compose.container-number=1 \
            --user 10001:10001 --network boca-socios_telegram_egress \
            --read-only --no-healthcheck --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 0.25 \
            --tmpfs /tmp:rw,noexec,nosuid,size=8m \
            --env BOCA_ENVIRONMENT=staging --env BOCA_RUNTIME_MODE=simulation \
            --env BOCA_ENGINE_MODE=off --env BOCA_TELEGRAM_DISPATCH_MODE=explicit \
            --mount type=volume,source=boca-socios_boca_data,target=/data,volume-nocopy \
            --mount type=volume,source=boca-socios_boca_telegram,target=/run/telegram,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.telegram_one_shot test "$GITHUB_SHA" 12345 \
            eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee \
            > /dev/null 2>&1
          test_rc=$?
          set -e
          test "$test_rc" -eq 1
          docker inspect --format '{{json .}}' boca-socios-telegram-test-1 > "$RUNNER_TEMP/boca-telegram-test-container.json"
          docker network inspect --format '{{json .}}' boca-socios_telegram_egress > "$RUNNER_TEMP/boca-telegram-test-network.json"
          docker image inspect --format '{{json .}}' "$BOCA_IMAGE" > "$RUNNER_TEMP/boca-telegram-test-image.json"
          PYTHONPATH=src python3 - "$RUNNER_TEMP/boca-telegram-test-container.json" "$RUNNER_TEMP/boca-telegram-test-network.json" "$RUNNER_TEMP/boca-telegram-test-image.json" <<'PY'
          import json, sys
          from pathlib import Path
          from boca_socios import host_rootless_setup as host

          record = json.loads(Path(sys.argv[1]).read_text())
          network = Path(sys.argv[2]).read_text()
          image = json.loads(Path(sys.argv[3]).read_text())
          def only_network(_home, _binary, _endpoint, *command):
              assert command[:2] == ("network", "inspect")
              return network
          host._command = only_network
          assert record["State"]["Running"] is False
          assert host._verified_telegram_test_isolation(Path("/home/boca-deploy"), "--host=local", record)
          assert host._telegram_test_environment(record["Config"]["Env"], image["Config"]["Env"])
          PY
          docker rm boca-socios-telegram-test-1
          docker network rm boca-socios_telegram_egress
          docker volume rm boca-socios_boca_telegram
          [[ "$(docker network ls --format '{{.Name}}')" != *boca-socios_telegram_egress* ]]
      - name: Serve BETA on runner loopback with exact image, HTTP and isolation
        run: |
          docker compose -p boca-socios -f compose.beta.yaml up --no-build --no-deps --wait --wait-timeout 90 -d controller
          container="$(docker compose -p boca-socios -f compose.beta.yaml ps -q controller)"
          test -n "$container"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert (h["NanoCpus"], h["Memory"], h["PidsLimit"], h["ReadonlyRootfs"], h["Privileged"], h["PortBindings"], h["PublishAllPorts"]) == (500000000, 268435456, 64, True, False, {"8443/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8443"}]}, False)'
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["NetworkMode"] == "boca-socios_boca_private" and h["CapDrop"] == ["ALL"] and h["CapAdd"] in (None, []) and h["SecurityOpt"] == ["no-new-privileges:true"] and h["Tmpfs"] == {"/tmp": "rw,noexec,nosuid,size=16m"} and h["CgroupnsMode"] in ("private", "")'
          docker inspect --format '{{json .NetworkSettings}}' "$container" | python3 -c 'import json,sys; n=json.load(sys.stdin); assert set(n["Networks"]) == {"boca-socios_boca_private"} and n["Ports"] == {"8443/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8443"}]}'
          docker inspect --format '{{json .Mounts}}' "$container" | python3 -c 'import json,sys; m=json.load(sys.stdin); assert {(x["Type"], x["Name"], x["Destination"], x["RW"]) for x in m} == {("volume", "boca-socios_boca_data", "/data", True), ("volume", "boca-socios_boca_key", "/run/secrets", False), ("volume", "boca-socios_boca_owner", "/run/owner", False)}'
          docker exec --user 10001:10001 "$container" python -m boca_socios.runtime_probe
          curl --fail --silent --show-error --noproxy '*' \
            --resolve localhost:8443:127.0.0.1 \
            http://localhost:8443/healthz > "$RUNNER_TEMP/boca-beta-health.receipt"
          test "$(cat "$RUNNER_TEMP/boca-beta-health.receipt")" = BOCA_BETA_READY
      - name: Run synthetic loopback HTTP acceptance inside capped disposable controller
        run: |
          container="$(docker compose -p boca-socios -f compose.beta.yaml ps -q controller)"
          [[ "$container" =~ ^[0-9a-f]{64}$ ]]
          docker exec --user 10001:10001 "$container" \
            python -m boca_socios.acceptance.host_probe \
            > "$RUNNER_TEMP/boca-synthetic-probe.receipt" 2>/dev/null
          PYTHONPATH=src python3 - "$RUNNER_TEMP/boca-synthetic-probe.receipt" <<'PY'
          import sys
          from pathlib import Path
          from boca_socios.host_first_deploy import _validate_beta_acceptance_receipt

          try:
              path = Path(sys.argv[1])
              if path.stat().st_size > 385:
                  raise ValueError("synthetic receipt exceeds bounded output")
              raw = path.read_text(encoding="ascii")
              if raw.count("\n") != 1 or not raw.endswith("\n"):
                  raise ValueError("unexpected synthetic receipt lines")
              print(_validate_beta_acceptance_receipt(raw[:-1]))
          except (OSError, UnicodeError, ValueError):
              print("BOCA_NO_GO: disposable synthetic receipt invalid", file=sys.stderr)
              raise SystemExit(1) from None
          PY
      - name: Remove only synthetic Boca resources from disposable runner
        if: always()
        run: |
          docker compose -p boca-socios -f compose.beta.yaml stop controller || true
          docker compose -p boca-socios -f compose.beta.yaml rm -sf controller || true
          docker compose -p boca-socios -f compose.yaml stop controller || true
          docker compose -p boca-socios -f compose.yaml rm -sf controller || true
          docker rm -f boca-socios-telegram-test-1 || true
          docker network rm boca-socios_telegram_egress || true
          docker volume rm boca-socios_boca_data || true
          docker volume rm boca-socios_boca_key || true
          docker volume rm boca-socios_boca_owner || true
          docker volume rm boca-socios_boca_telegram || true
          docker network rm boca-socios_boca_private || true

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.actor == 'mbalbo2023'
    name: approved-boca-manual-operation
    environment: boca-first-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      BOCA_OPERATION: ${{ inputs.operation }}
      BOCA_IMAGE_REF: ${{ inputs.image_ref }}
      BOCA_SOURCE_SHA: ${{ inputs.source_sha }}
      BOCA_SERVICE: ${{ inputs.service }}
      BOCA_BUDGET: ${{ inputs.resource_budget }}
      BOCA_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - name: Require verified protected environment and matching main commit
        env:
          BOCA_HOST_READONLY_ENV_READY: ${{ vars.BOCA_HOST_READONLY_ENV_READY }}
          BOCA_DEPLOY_ENV_READY: ${{ vars.BOCA_DEPLOY_ENV_READY }}
          BOCA_BETA_ENV_READY: ${{ vars.BOCA_BETA_ENV_READY }}
          BOCA_TELEGRAM_ENV_READY: ${{ vars.BOCA_TELEGRAM_ENV_READY }}
          BOCA_TELEGRAM_OWNER_READY: ${{ vars.BOCA_TELEGRAM_OWNER_READY }}
          BOCA_TELEGRAM_EXPECTED_BOT_ID: ${{ secrets.BOCA_TELEGRAM_EXPECTED_BOT_ID }}
          BOCA_TELEGRAM_EXPECTED_CHAT_HMAC: ${{ secrets.BOCA_TELEGRAM_EXPECTED_CHAT_HMAC }}
          BOCA_BETA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          BOCA_SITE_ENVELOPE: ${{ inputs.site_envelope }}
          BOCA_TELEGRAM_ENVELOPE: ${{ inputs.telegram_envelope }}
          BOCA_OWNER_ENVELOPE: ${{ inputs.owner_envelope }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BOCA_SOURCE_SHA" = "$GITHUB_SHA"
          test "$BOCA_SERVICE" = controller
          test "$BOCA_BUDGET" = 0.5cpu-256m-64pids
          if [[ "$BOCA_OPERATION" != telegram-install ]]; then test -z "$BOCA_TELEGRAM_ENVELOPE"; fi
          if [[ "$BOCA_OPERATION" != owner-install ]]; then test -z "$BOCA_OWNER_ENVELOPE"; fi
          case "$BOCA_OPERATION" in
            inspect-prerequisites|port-check|preflight)
              test "$BOCA_HOST_READONLY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            prepare-rootless)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            stop-test)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            first-install|diagnostic)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            site-prepare|site-verify)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            site-install)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -n "$BOCA_SITE_ENVELOPE"
              ;;
            owner-prepare|owner-verify|owner-install)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = owner-install ]]; then
                test -n "$BOCA_OWNER_ENVELOPE"
              fi
              ;;
            beta-install|beta-acceptance)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            telegram-migrate|telegram-prepare|telegram-install|telegram-verify|telegram-test)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_TELEGRAM_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = telegram-install ]]; then test -n "$BOCA_TELEGRAM_ENVELOPE"; fi
              if [[ "$BOCA_OPERATION" = telegram-test ]]; then
                test "$BOCA_TELEGRAM_OWNER_READY" = ready
                [[ "$BOCA_TELEGRAM_EXPECTED_BOT_ID" =~ ^[1-9][0-9]{0,15}$ ]]
                [[ "$BOCA_TELEGRAM_EXPECTED_CHAT_HMAC" =~ ^[0-9a-f]{64}$ ]]
              fi
              ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact main commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm current main HEAD before host access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref.json" "$BOCA_SOURCE_SHA"
      - name: Validate immutable inputs and successful matching release
        if: inputs.operation == 'first-install' || inputs.operation == 'diagnostic' || inputs.operation == 'site-prepare' || inputs.operation == 'site-install' || inputs.operation == 'site-verify' || startsWith(inputs.operation, 'owner-') || inputs.operation == 'beta-install' || inputs.operation == 'beta-acceptance' || startsWith(inputs.operation, 'telegram-')
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_deploy_inputs.py "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOCA_RELEASE_RUN_ID" \
            > "$RUNNER_TEMP/boca-release-run.json"
          python scripts/check_release_run.py "$RUNNER_TEMP/boca-release-run.json" "$BOCA_SOURCE_SHA" "$BOCA_RELEASE_RUN_ID"
          gh run download "$BOCA_RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name boca-release-manifest --dir "$RUNNER_TEMP/boca-release-manifest"
          python -m boca_socios.release_manifest verify \
            "$RUNNER_TEMP/boca-release-manifest/boca-release-manifest.json" \
            "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_RELEASE_RUN_ID"
      - name: Hash reviewed Boca Compose file
        run: sha256sum compose.yaml | cut -d' ' -f1 > "$RUNNER_TEMP/boca-compose.sha"
      - name: Hash reviewed served BETA Compose file
        if: inputs.operation == 'beta-install' || inputs.operation == 'beta-acceptance' || startsWith(inputs.operation, 'telegram-')
        run: sha256sum compose.beta.yaml | cut -d' ' -f1 > "$RUNNER_TEMP/boca-beta-compose.sha"
      - name: Validate reviewed runner Compose model
        if: inputs.operation == 'first-install' || inputs.operation == 'diagnostic'
        env:
          BOCA_IMAGE: ${{ inputs.image_ref }}
          BOCA_ENVIRONMENT: staging
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.yaml config --format json > "$RUNNER_TEMP/boca-runner-model.json"
          python scripts/check_deploy_contract.py "$RUNNER_TEMP/boca-runner-model.json" "$BOCA_IMAGE_REF"
      - name: Validate reviewed served BETA runner Compose model
        if: inputs.operation == 'beta-install' || inputs.operation == 'beta-acceptance' || startsWith(inputs.operation, 'telegram-')
        env:
          BOCA_IMAGE: ${{ inputs.image_ref }}
          BOCA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml config --format json > "$RUNNER_TEMP/boca-beta-runner-model.json"
          python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-beta-runner-model.json" "$BOCA_IMAGE_REF"
      - name: Configure pinned SSH host key and dedicated identity
        env:
          BOCA_HOST: ${{ vars.BOCA_DEPLOY_HOST }}
          BOCA_SSH_KEY: ${{ secrets.BOCA_DEPLOY_SSH_KEY }}
          BOCA_KNOWN_HOSTS: ${{ secrets.BOCA_DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$BOCA_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,252}$ ]]
          test -n "$BOCA_SSH_KEY"
          test -n "$BOCA_KNOWN_HOSTS"
          mkdir -m 700 "$RUNNER_TEMP/boca-ssh"
          printf '%s\n' "$BOCA_SSH_KEY" > "$RUNNER_TEMP/boca-ssh/key"
          printf '%s\n' "$BOCA_KNOWN_HOSTS" > "$RUNNER_TEMP/boca-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/boca-ssh/key" "$RUNNER_TEMP/boca-ssh/known_hosts"
          {
            printf 'Host boca-target\n'
            printf '  HostName %s\n' "$BOCA_HOST"
            printf '  User boca-deploy\n'
            printf '  IdentityFile %s/boca-ssh/key\n' "$RUNNER_TEMP"
            printf '  UserKnownHostsFile %s/boca-ssh/known_hosts\n' "$RUNNER_TEMP"
            printf '  GlobalKnownHostsFile /dev/null\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  BatchMode yes\n'
            printf '  IdentitiesOnly yes\n'
            printf '  IdentityAgent none\n'
            printf '  PasswordAuthentication no\n'
            printf '  KbdInteractiveAuthentication no\n'
            printf '  ClearAllForwardings yes\n'
            printf '  RequestTTY no\n'
            printf '  UpdateHostKeys no\n'
            printf '  ConnectTimeout 10\n'
            printf '  NumberOfPasswordPrompts 0\n'
            printf '  ForwardAgent no\n'
          } > "$RUNNER_TEMP/boca-ssh/config"
          chmod 600 "$RUNNER_TEMP/boca-ssh/config"
      - name: Recheck current main before Site custody operation
        if: inputs.operation == 'site-prepare' || inputs.operation == 'site-install' || inputs.operation == 'site-verify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-site.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-site.json" "$BOCA_SOURCE_SHA"
      - name: Recheck current main before owner custody operation
        if: startsWith(inputs.operation, 'owner-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-owner.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-owner.json" "$BOCA_SOURCE_SHA"
      - name: Mark owner custody host attempt before starting dedicated daemon
        id: boca_owner_attempt
        if: startsWith(inputs.operation, 'owner-')
        run: printf 'started=true\n' >> "$GITHUB_OUTPUT"
      - name: Start only the stopped prepared Boca rootless daemon for owner custody
        if: startsWith(inputs.operation, 'owner-')
        run: |
          set +e
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - start-existing "$BOCA_SOURCE_SHA")"
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_rootless_setup.py > "$RUNNER_TEMP/boca-owner-start.receipt" 2>/dev/null
          start_rc=$?
          set -e
          receipt=''
          if [[ "$start_rc" -eq 0 ]]; then receipt="$(cat "$RUNNER_TEMP/boca-owner-start.receipt")"; fi
          pattern='^BOCA_ROOTLESS_START state=READY source_sha=([0-9a-f]{40}) inventory=known_stopped data=preserved$'
          if [[ "$start_rc" -ne 0 || ${#receipt} -gt 180 || ! "$receipt" =~ $pattern || "${BASH_REMATCH[1]}" != "$BOCA_SOURCE_SHA" ]]; then
            printf 'Boca owner custody: prepared daemon start NO_GO; Boca-only stop follows.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Prepare, install or verify only Boca owner-volume public passkey custody
        if: startsWith(inputs.operation, 'owner-')
        env:
          BOCA_BETA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          BOCA_OWNER_ENVELOPE: ${{ inputs.owner_envelope }}
        run: |
          set +e
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - "$BOCA_OPERATION" "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$(cat "$RUNNER_TEMP/boca-compose.sha")" "$BOCA_BETA_PANEL_ORIGIN" "$BOCA_BETA_OWNER_SUBJECT" '' '' '' "$BOCA_OWNER_ENVELOPE")"
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_first_deploy.py > "$RUNNER_TEMP/boca-owner.receipt" 2>/dev/null
          owner_rc=$?
          set -e
          receipt=''
          if [[ "$owner_rc" -eq 0 ]]; then receipt="$(cat "$RUNNER_TEMP/boca-owner.receipt")"; fi
          case "$BOCA_OPERATION" in
            owner-prepare) pattern='^BOCA_OWNER_BOOTSTRAP state=(PREPARED|ALREADY_PREPARED) public_key=([A-Za-z0-9_-]{43}) fingerprint=([0-9a-f]{64})$' ;;
            owner-install) pattern='^BOCA_OWNER_BOOTSTRAP state=CONFIGURED fingerprint=([0-9a-f]{64})$' ;;
            owner-verify) pattern='^BOCA_OWNER_BOOTSTRAP state=VERIFIED fingerprint=([0-9a-f]{64})$' ;;
            *) exit 1 ;;
          esac
          if [[ "$owner_rc" -ne 0 || ${#receipt} -gt 180 || ! "$receipt" =~ $pattern ]]; then
            printf 'Boca owner custody: NO_GO; preserve owner volume and inspect before retry. No BETA service started.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'Boca owner custody: `%s`. No BETA service started. Source: `%s`; image: `%s`.\n' "$receipt" "$BOCA_SOURCE_SHA" "$BOCA_IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop only Boca services and daemon after owner custody
        if: always() && startsWith(inputs.operation, 'owner-') && steps.boca_owner_attempt.outputs.started == 'true'
        run: |
          set +e
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - stop-test "$BOCA_SOURCE_SHA")"
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_rootless_setup.py > "$RUNNER_TEMP/boca-owner-stop.receipt" 2>/dev/null
          stop_rc=$?
          set -e
          receipt=''
