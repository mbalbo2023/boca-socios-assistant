              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            site-prepare|site-verify)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            site-install)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -n "$BOCA_SITE_ENVELOPE"
              ;;
            owner-prepare|owner-verify|owner-install|owner-enroll)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = owner-install ]]; then
                test -n "$BOCA_OWNER_ENVELOPE"
              fi
              if [[ "$BOCA_OPERATION" = owner-enroll ]]; then
                [[ "$BOCA_OWNER_CAPABILITY_SHA256" =~ ^[0-9a-f]{64}$ ]]
              fi
              ;;
            beta-install|beta-start|beta-acceptance)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            beta-browser-install)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_BROWSER_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            beta-browser-start|beta-browser-restart|beta-browser-status|beta-browser-acceptance|beta-browser-telegram-start|beta-browser-telegram-recover)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_BROWSER_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = beta-browser-telegram-start || "$BOCA_OPERATION" = beta-browser-telegram-recover ]]; then
                test "$BOCA_TELEGRAM_ENV_READY" = ready
                test "$BOCA_TELEGRAM_OWNER_READY" = ready
                [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              fi
              if [[ "$BOCA_TELEGRAM_OWNER_READY" = ready ]]; then
                test "$BOCA_TELEGRAM_ENV_READY" = ready
                [[ "$BOCA_TELEGRAM_EXPECTED_BOT_ID" =~ ^[1-9][0-9]{0,15}$ ]]
                [[ "$BOCA_TELEGRAM_EXPECTED_CHAT_HMAC" =~ ^[0-9a-f]{64}$ ]]
              fi
              ;;
            cutover-a-observe|cutover-a-worker-preflight|cutover-a-apply)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_BROWSER_ENV_READY" = ready
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              if [[ "$BOCA_OPERATION" = cutover-a-observe || "$BOCA_OPERATION" = cutover-a-worker-preflight || -n "$BOCA_PROTECTED_ACTION_CONTEXT" ]]; then
                [[ "$BOCA_LEGACY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
                [[ "$BOCA_LEGACY_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant@sha256:[0-9a-f]{64}$ ]]
                [[ "$BOCA_LEGACY_RELEASE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
                if [[ "$BOCA_OPERATION" = cutover-a-apply || "$BOCA_OPERATION" = cutover-a-worker-preflight ]]; then
                  [[ "$BOCA_LEGACY_CONTROLLER_ID" =~ ^[0-9a-f]{64}$ ]]
                fi
              else
                # Historic SHA/image/CID are observed; never input by Tincho.
                test -z "$BOCA_LEGACY_SOURCE_SHA"
                test -z "$BOCA_LEGACY_IMAGE_REF"
                test -z "$BOCA_LEGACY_RELEASE_RUN_ID"
                test -z "$BOCA_LEGACY_CONTROLLER_ID"
              fi
              [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              if [[ "$BOCA_OPERATION" = cutover-a-observe || "$BOCA_OPERATION" = cutover-a-worker-preflight || -n "$BOCA_PROTECTED_ACTION_CONTEXT" ]]; then
                test "$BOCA_LEGACY_SOURCE_SHA" != "$BOCA_SOURCE_SHA"
                test "$BOCA_LEGACY_IMAGE_REF" != "$BOCA_IMAGE_REF"
              fi
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = cutover-a-worker-preflight ]]; then
                # Reversible Boca-only rootless pull/probe; NO PREPARE/GO/port switch.
                test -z "$BOCA_PROTECTED_ACTION_CONTEXT"
                test -z "$BOCA_TELEGRAM_ENVELOPE"
                test -z "$BOCA_OWNER_ENVELOPE"
              fi
              ;;
            official-notice-import)
              # Information-only data import, never a new application deploy.
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              test "$BOCA_BROWSER_ENV_READY" = ready
              [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              if [[ -z "$BOCA_PROTECTED_ACTION_CONTEXT" ]]; then
                # One short user-reviewed source run ID; 7 digests/CID observed.
                [[ "$BOCA_OFFICIAL_NEWS_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
                test -z "$BOCA_OFFICIAL_CONTROLLER_ID"
                test -z "$BOCA_OFFICIAL_NEWS_SOURCE_SHA"
                test -z "$BOCA_OFFICIAL_NEWS_ARTIFACT_ID"
                test -z "$BOCA_OFFICIAL_NEWS_ZIP_SHA256"
                test -z "$BOCA_OFFICIAL_NEWS_JSONL_SHA256"
                test -z "$BOCA_OFFICIAL_NEWS_HTML_SHA256"
                test -z "$BOCA_OFFICIAL_NEWS_OBSERVED_AT_UTC"
              else
                [[ "$BOCA_OFFICIAL_CONTROLLER_ID" =~ ^[0-9a-f]{64}$ ]]
                [[ "$BOCA_OFFICIAL_NEWS_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
                [[ "$BOCA_OFFICIAL_NEWS_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
                [[ "$BOCA_OFFICIAL_NEWS_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
                [[ "$BOCA_OFFICIAL_NEWS_ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
                [[ "$BOCA_OFFICIAL_NEWS_JSONL_SHA256" =~ ^[0-9a-f]{64}$ ]]
                [[ "$BOCA_OFFICIAL_NEWS_HTML_SHA256" =~ ^[0-9a-f]{64}$ ]]
                test -n "$BOCA_OFFICIAL_NEWS_OBSERVED_AT_UTC"
              fi
              ;;
            protected-go-prepare|lifecycle-apply)
              # New Boca actions are only reviewed after independent GO B.
              # PREPARE performs one Boca-only attested host READ_ONLY
              # inspection, without effect. APPLY needs separate independently
              # approved GO, same-lease replay marker and exact physical ACK.
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_BROWSER_ENV_READY" = ready
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              [[ "$BOCA_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant@sha256:[0-9a-f]{64}$ ]]
              [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              [[ "$BOCA_RELEASE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              if [[ "$BOCA_OPERATION" = protected-go-prepare ]]; then
                # Zero manual Docker pins: host observer issues the exact context.
                test -z "$BOCA_PROTECTED_ACTION_CONTEXT"
              else
                # Android Voice Access: a SHORT existing PREPARE run ID only.
                [[ "$BOCA_PROTECTED_ACTION_CONTEXT" =~ ^[1-9][0-9]{0,19}$ ]]
                test "$BOCA_PROTECTED_ACTION_CONTEXT" != "$GITHUB_RUN_ID"
              fi
              test -z "$BOCA_SITE_ENVELOPE"
              test -z "$BOCA_TELEGRAM_ENVELOPE"
              test -z "$BOCA_OWNER_ENVELOPE"
              ;;
            telegram-activate)
              # Only runner-side release/ancestry review is connected. The
              # postcutover physical caller and independent GO_B are NOT.
              # An unconditional NO_GO step remains before every SSH path.
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_BROWSER_ENV_READY" = ready
              test "$BOCA_TELEGRAM_ENV_READY" = ready
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              [[ "$BOCA_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant@sha256:[0-9a-f]{64}$ ]]
              [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              [[ "$BOCA_RELEASE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              test -z "$BOCA_SITE_ENVELOPE"
              test -z "$BOCA_TELEGRAM_ENVELOPE"
              test -z "$BOCA_OWNER_ENVELOPE"
              ;;
            telegram-migrate|telegram-prepare|telegram-install|telegram-verify|telegram-test)
              if [[ -n "$BOCA_BROWSER_IMAGE_REF" ]]; then
                test "$BOCA_BROWSER_ENV_READY" = ready
                [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              fi
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_TELEGRAM_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = telegram-install ]]; then test -n "$BOCA_TELEGRAM_ENVELOPE"; fi
              if [[ "$BOCA_OPERATION" = telegram-test ]]; then
                test "$BOCA_TELEGRAM_OWNER_READY" = ready
                [[ "$BOCA_TELEGRAM_EXPECTED_BOT_ID" =~ ^[1-9][0-9]{0,15}$ ]]
                [[ "$BOCA_TELEGRAM_EXPECTED_CHAT_HMAC" =~ ^[0-9a-f]{64}$ ]]
              fi
              ;;
            *) exit 1 ;;
          esac
      - name: Reject legacy install routes without same-lease Boca-only postflight
        # The historical first/beta/browser/Site/owner/Telegram installers use
        # multiple SSH processes and failure-only cleanup. Their effects cannot
        # be followed by an authenticated same-lease SUCCESS finalizer. They
        # must remain inert until each is refactored to one reviewed protected
        # transaction. The live-controller upgrade uses cutover-a-apply with
        # independent exact-GO and a try/finally Boca-only postflight instead.
        run: |
          set -euo pipefail
          case "$BOCA_OPERATION" in
            first-install|beta-install|beta-browser-install|site-install|owner-install|telegram-install)
              printf 'BOCA_POSTDEPLOY state=NO_GO reason=legacy_install_without_same_lease_finalizer operation=%s host=untouched preserve=all_boca_data_and_foreign_resources action=fix_forward_only\n' "$BOCA_OPERATION" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            cutover-a-apply)
              # V3 deliberately replaces separate GO_B with owner dispatch.
              # Exact source, manifests, single lease and physical ACK remain.
              printf 'BOCA_POSTDEPLOY route=protected_cutover_v3 authority=owner_dispatch host=untouched\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              # Observers, existing-service starts/stops and non-install
              # actions keep their existing independent gates unchanged.
              ;;
          esac
      - name: Checkout exact main commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm current main HEAD before host access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref.json"
          verified_main="$BOCA_SOURCE_SHA"
          if [[ "$BOCA_OPERATION" = telegram-activate ]]; then verified_main="$GITHUB_SHA"; fi
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref.json" "$verified_main"
      - name: Validate image-free infrastructure coordinates before SSH
        if: inputs.operation == 'infrastructure-preflight' || inputs.operation == 'infrastructure-inspect'
        env:
          PYTHONPATH: src
        run: python scripts/check_deploy_inputs.py --infrastructure-preflight "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
      - name: Validate immutable inputs and successful matching release
        if: inputs.operation == 'first-install' || inputs.operation == 'diagnostic' || inputs.operation == 'site-prepare' || inputs.operation == 'site-install' || inputs.operation == 'site-verify' || startsWith(inputs.operation, 'owner-') || inputs.operation == 'beta-install' || inputs.operation == 'beta-start' || startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '') || inputs.operation == 'beta-acceptance' || startsWith(inputs.operation, 'telegram-') || inputs.operation == 'cutover-a-observe' || inputs.operation == 'cutover-a-worker-preflight' || inputs.operation == 'cutover-a-apply' || inputs.operation == 'official-notice-import' || inputs.operation == 'protected-go-prepare' || inputs.operation == 'lifecycle-apply'
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$BOCA_BUDGET" = 1.75cpu-1152m-224pids ]]; then
            python scripts/check_deploy_inputs.py --browser-ipc-v2 --telegram-runtime "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
          elif [[ "$BOCA_OPERATION" = beta-browser-* || "$BOCA_OPERATION" = cutover-a-observe || "$BOCA_OPERATION" = cutover-a-worker-preflight || "$BOCA_OPERATION" = cutover-a-apply || "$BOCA_OPERATION" = official-notice-import || "$BOCA_OPERATION" = protected-go-prepare || "$BOCA_OPERATION" = lifecycle-apply || ( "$BOCA_OPERATION" = telegram-* && -n "$BOCA_BROWSER_IMAGE_REF" ) ]]; then
            python scripts/check_deploy_inputs.py --browser-ipc-v2 "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
          else
            python scripts/check_deploy_inputs.py "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOCA_RELEASE_RUN_ID" \
            > "$RUNNER_TEMP/boca-release-run.json"
          python scripts/check_release_run.py "$RUNNER_TEMP/boca-release-run.json" "$BOCA_SOURCE_SHA" "$BOCA_RELEASE_RUN_ID"
          gh run download "$BOCA_RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name boca-release-manifest --dir "$RUNNER_TEMP/boca-release-manifest"
          python -m boca_socios.release_manifest verify \
            "$RUNNER_TEMP/boca-release-manifest/boca-release-manifest.json" \
            "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_RELEASE_RUN_ID"
      - name: Require same-run immutable browser companion release manifest
        if: startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '') || inputs.operation == 'cutover-a-observe' || inputs.operation == 'cutover-a-worker-preflight' || inputs.operation == 'cutover-a-apply' || inputs.operation == 'official-notice-import' || inputs.operation == 'protected-go-prepare' || inputs.operation == 'lifecycle-apply'
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh run download "$BOCA_RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name boca-browser-release-manifest --dir "$RUNNER_TEMP/boca-browser-release-manifest"
          python -m boca_socios.browser_release_manifest verify \
            "$RUNNER_TEMP/boca-browser-release-manifest/boca-browser-release-manifest.json" \
            "$BOCA_IMAGE_REF" "$BOCA_BROWSER_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_RELEASE_RUN_ID"
      - name: Prove Telegram dual-source release ancestry CODE_ONLY then reject physical activation
        if: inputs.operation == 'telegram-activate'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          # This GitHub compare projection contains no sensitive credentials.
          # Both SHAs were checked against current main and immutable release
          # manifests separately; ancestry cannot authorize a host mutation.
          gh api "repos/$GITHUB_REPOSITORY/compare/$BOCA_SOURCE_SHA...$GITHUB_SHA" \
            --jq '{status,ahead_by,behind_by,base_sha:.base_commit.sha,merge_base_sha:.merge_base_commit.sha}' \
            -H 'Accept: application/vnd.github+json' \
            | jq -cS . > "$RUNNER_TEMP/boca-telegram-source-lineage.json"
          python scripts/check_telegram_release_lineage.py \
            "$BOCA_SOURCE_SHA" "$GITHUB_SHA" "$RUNNER_TEMP/boca-telegram-source-lineage.json"
          python scripts/build_protected_telegram_bundle.py \
            . "$RUNNER_TEMP/boca-telegram-host-review.pyz"
          # The distinct GO_B, real rootless/owner volume backend, one lease,
          # four GETs, custody and same-job postflight are NOT yet connected.
          printf 'BOCA_TELEGRAM_POSTCUTOVER state=NO_GO reason=host_same_lease_backend_unverified host=untouched sender=OFF\n' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Build reviewed Boca-only inventory ZIP for legacy PREPARE without effects
        if: (inputs.operation == 'cutover-a-apply' || inputs.operation == 'official-notice-import') && inputs.protected_action_context == ''
        env:
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          python scripts/build_protected_boca_bundle.py . "$RUNNER_TEMP/boca-legacy-inventory-review.pyz"
          python scripts/check_legacy_go_dispatch.py observer-request \
            "$RUNNER_TEMP/boca-legacy-inventory-request.token"
      - name: Configure pinned READ_ONLY SSH exclusively for legacy PREPARE
        if: (inputs.operation == 'cutover-a-apply' || inputs.operation == 'official-notice-import') && inputs.protected_action_context == ''
        env:
          BOCA_HOST: ${{ vars.BOCA_DEPLOY_HOST }}
          BOCA_SSH_KEY: ${{ secrets.BOCA_DEPLOY_SSH_KEY }}
          BOCA_KNOWN_HOSTS: ${{ secrets.BOCA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$BOCA_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,252}$ ]]
          test -n "$BOCA_SSH_KEY"
          test -n "$BOCA_KNOWN_HOSTS"
          mkdir -m 700 "$RUNNER_TEMP/boca-legacy-readonly-ssh"
          printf '%s\n' "$BOCA_SSH_KEY" > "$RUNNER_TEMP/boca-legacy-readonly-ssh/key"
          printf '%s\n' "$BOCA_KNOWN_HOSTS" > "$RUNNER_TEMP/boca-legacy-readonly-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/boca-legacy-readonly-ssh/key" "$RUNNER_TEMP/boca-legacy-readonly-ssh/known_hosts"
          {
            printf 'Host boca-legacy-readonly\n'
            printf '  HostName %s\n' "$BOCA_HOST"
            printf '  User boca-deploy\n'
            printf '  IdentityFile %s/boca-legacy-readonly-ssh/key\n' "$RUNNER_TEMP"
            printf '  UserKnownHostsFile %s/boca-legacy-readonly-ssh/known_hosts\n' "$RUNNER_TEMP"
            printf '  GlobalKnownHostsFile /dev/null\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  BatchMode yes\n'
            printf '  IdentitiesOnly yes\n'
            printf '  IdentityAgent none\n'
            printf '  PasswordAuthentication no\n'
            printf '  KbdInteractiveAuthentication no\n'
            printf '  ClearAllForwardings yes\n'
            printf '  RequestTTY no\n'
            printf '  UpdateHostKeys no\n'
            printf '  ConnectTimeout 10\n'
            printf '  NumberOfPasswordPrompts 0\n'
            printf '  ForwardAgent no\n'
          } > "$RUNNER_TEMP/boca-legacy-readonly-ssh/config"
          chmod 600 "$RUNNER_TEMP/boca-legacy-readonly-ssh/config"
      - name: Observe ONLY Boca rootless original/installed controller before reviewed transaction
        id: legacy_inventory_host_read
        if: (inputs.operation == 'cutover-a-apply' || inputs.operation == 'official-notice-import') && inputs.protected_action_context == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            > "$RUNNER_TEMP/boca-main-ref-legacy-inventory.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-legacy-inventory.json" "$BOCA_SOURCE_SHA"
          test -s "$RUNNER_TEMP/boca-legacy-inventory-review.pyz"
          test -s "$RUNNER_TEMP/boca-legacy-inventory-request.token"
          IFS= read -r public_request < "$RUNNER_TEMP/boca-legacy-inventory-request.token"
          digest="$(sha256sum "$RUNNER_TEMP/boca-legacy-inventory-review.pyz" | cut -d' ' -f1)"
          mode=cutover-inventory-observe
          if [[ "$BOCA_OPERATION" = official-notice-import ]]; then mode=official-inventory-observe; fi
          remote_command="$(python3 - "$public_request" "$digest" "$mode" <<'PY'
          import shlex
          import sys

          token, digest, mode = sys.argv[1:]
          with open("scripts/boca_protected_memfd_bootstrap.py", encoding="utf-8") as source:
              bootstrap = source.read()
          print(shlex.join(["python3", "-c", bootstrap, digest, mode, token]))
          PY
          )"
          # Sole host read: exactly named Boca original/installed controller.
          # The reviewed helper owns rootless lease; lock metadata under /run
          # is allowed, application/Docker mutations are ZERO.
          # Keep NO_GO authoritative. On failure only a fixed, reviewed code is
          # printed; never forward raw SSH/Docker stderr, host paths or env.
          observer_rc=0
          timeout --signal=TERM --kill-after=5s 150s ssh \
            -F "$RUNNER_TEMP/boca-legacy-readonly-ssh/config" \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            boca-legacy-readonly "$remote_command" \
            < "$RUNNER_TEMP/boca-legacy-inventory-review.pyz" \
            > "$RUNNER_TEMP/boca-legacy-inventory-host.receipt" \
            2> "$RUNNER_TEMP/boca-legacy-inventory-host.stderr" || observer_rc=$?
          if [[ "$observer_rc" -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/boca-legacy-inventory-host.stderr" <<'PY'
          import sys
          from pathlib import Path
          from boca_socios.host_cutover_inventory_observe import parse_cutover_no_go_stderr

          with Path(sys.argv[1]).open("rb") as stream:
              redacted = parse_cutover_no_go_stderr(stream.read(4097))
          print(f"BOCA_LEGACY_PREPARE state=NO_GO reason={redacted}")
          PY
            exit "$observer_rc"
          fi
          python scripts/check_legacy_go_dispatch.py accept-observer \
            "$RUNNER_TEMP/boca-legacy-inventory-host.receipt" \
            "$RUNNER_TEMP/boca-legacy-inventory.observed.json"
      - name: Resolve original Cutover image release by exact host-observed SHA
        if: inputs.operation == 'cutover-a-apply' && inputs.protected_action_context == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          [[ "$BOCA_LEGACY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$BOCA_LEGACY_SOURCE_SHA&per_page=100" \
            > "$RUNNER_TEMP/boca-cutover-history-runs.json"
          python scripts/check_legacy_go_dispatch.py select-legacy-release \
            "$RUNNER_TEMP/boca-cutover-history-runs.json" \
            "$RUNNER_TEMP/boca-legacy-inventory.observed.json" \
            "$RUNNER_TEMP/boca-cutover-observed-release.id"
          IFS= read -r historical_run < "$RUNNER_TEMP/boca-cutover-observed-release.id"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$historical_run" > "$RUNNER_TEMP/boca-legacy-historical-run.json"
          python scripts/check_release_run.py "$RUNNER_TEMP/boca-legacy-historical-run.json" "$BOCA_LEGACY_SOURCE_SHA" "$historical_run"
          mkdir -m 700 "$RUNNER_TEMP/boca-cutover-observed-manifest"
          gh run download "$historical_run" --repo "$GITHUB_REPOSITORY" \
            --name boca-release-manifest --dir "$RUNNER_TEMP/boca-cutover-observed-manifest"
          python scripts/check_legacy_go_dispatch.py verify-legacy-release \
            "$RUNNER_TEMP/boca-cutover-observed-manifest/boca-release-manifest.json" \
            "$RUNNER_TEMP/boca-legacy-inventory.observed.json" \
            "$RUNNER_TEMP/boca-cutover-observed-release.id"
      - name: Discover the one selected reviewed public notice artifact automatically
        if: inputs.operation == 'official-notice-import' && inputs.protected_action_context == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          [[ "$BOCA_OFFICIAL_NEWS_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOCA_OFFICIAL_NEWS_RUN_ID" \
            > "$RUNNER_TEMP/boca-official-source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOCA_OFFICIAL_NEWS_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/boca-official-source-artifacts.json"
          python scripts/check_legacy_go_dispatch.py select-official-artifact \
            "$RUNNER_TEMP/boca-official-source-artifacts.json" \
            "$RUNNER_TEMP/boca-official-observed-artifact.id"
          IFS= read -r artifact_id < "$RUNNER_TEMP/boca-official-observed-artifact.id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            > "$RUNNER_TEMP/boca-official-artifact.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 40 \
            --proto '=https' --proto-redir '=https' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o "$RUNNER_TEMP/boca-official-artifact.zip"
          python scripts/check_legacy_go_dispatch.py resolve-official-source \
            "$RUNNER_TEMP/boca-official-source-run.json" \
            "$RUNNER_TEMP/boca-official-artifact.json" \
            "$RUNNER_TEMP/boca-official-artifact.zip" \
            "$RUNNER_TEMP/boca-legacy-inventory.observed.json"
      - name: Authenticate separate historical controller release and original Compose file
        if: inputs.operation == 'cutover-a-observe' || inputs.operation == 'cutover-a-worker-preflight' || inputs.operation == 'cutover-a-apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          # Current main's release does not authenticate the *old installed*
          # controller.  Check both historical release provenance and original
          # Compose content independently before any SSH connection.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOCA_LEGACY_RELEASE_RUN_ID" \
            > "$RUNNER_TEMP/boca-cutover-legacy-run.json"
          python scripts/check_release_run.py \
            "$RUNNER_TEMP/boca-cutover-legacy-run.json" \
            "$BOCA_LEGACY_SOURCE_SHA" "$BOCA_LEGACY_RELEASE_RUN_ID"
          gh run download "$BOCA_LEGACY_RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name boca-release-manifest --dir "$RUNNER_TEMP/boca-cutover-legacy-manifest"
          python -m boca_socios.release_manifest verify \
            "$RUNNER_TEMP/boca-cutover-legacy-manifest/boca-release-manifest.json" \
            "$BOCA_LEGACY_IMAGE_REF" "$BOCA_LEGACY_SOURCE_SHA" "$BOCA_LEGACY_RELEASE_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/contents/compose.beta.yaml?ref=$BOCA_LEGACY_SOURCE_SHA" \
            > "$RUNNER_TEMP/boca-cutover-legacy-compose.json"
          python3 - "$RUNNER_TEMP/boca-cutover-legacy-compose.json" \
            "$RUNNER_TEMP/boca-cutover-legacy-compose.yaml" \
            > "$RUNNER_TEMP/boca-cutover-legacy-compose.sha" <<'PY'
          import base64
          import hashlib
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as content:
              body = json.load(content)
          assert isinstance(body, dict)
          assert body.get("type") == "file" and body.get("path") == "compose.beta.yaml"
          assert body.get("encoding") == "base64"
          encoded = body.get("content")
          assert isinstance(encoded, str) and len(encoded) <= 45_000
          original = base64.b64decode(encoded, validate=False)
          assert 0 < len(original) <= 32_768 and body.get("size") == len(original)
          # The reviewed original bytes are needed for the exact-run GO;
          # O_EXCL prevents a later preflight from silently replacing them.
          import os
          fd = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "wb") as output:
              output.write(original)
              output.flush()
              os.fsync(output.fileno())
          print(hashlib.sha256(original).hexdigest())
          PY
      - name: Hash reviewed Boca Compose file
        run: sha256sum compose.yaml | cut -d' ' -f1 > "$RUNNER_TEMP/boca-compose.sha"
      - name: Hash reviewed served BETA Compose file
        if: inputs.operation == 'beta-install' || inputs.operation == 'beta-start' || startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '') || inputs.operation == 'beta-acceptance' || startsWith(inputs.operation, 'telegram-') || inputs.operation == 'cutover-a-observe' || inputs.operation == 'cutover-a-worker-preflight' || inputs.operation == 'cutover-a-apply' || inputs.operation == 'official-notice-import' || inputs.operation == 'protected-go-prepare' || inputs.operation == 'lifecycle-apply'
        run: sha256sum compose.beta.yaml | cut -d' ' -f1 > "$RUNNER_TEMP/boca-beta-compose.sha"
      - name: Hash reviewed optional browser IPC overlay and seccomp
        if: startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '') || inputs.operation == 'cutover-a-observe' || inputs.operation == 'cutover-a-worker-preflight' || inputs.operation == 'cutover-a-apply' || inputs.operation == 'official-notice-import' || inputs.operation == 'protected-go-prepare' || inputs.operation == 'lifecycle-apply'
        run: |
          sha256sum compose.beta.browser.yaml | cut -d' ' -f1 > "$RUNNER_TEMP/boca-browser-overlay.sha"
          sha256sum docker/seccomp_profile.json | cut -d' ' -f1 > "$RUNNER_TEMP/boca-browser-seccomp.sha"
      - name: Validate reviewed runner Compose model
        if: inputs.operation == 'first-install' || inputs.operation == 'diagnostic'
        env:
          BOCA_IMAGE: ${{ inputs.image_ref }}
          BOCA_ENVIRONMENT: staging
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.yaml config --format json > "$RUNNER_TEMP/boca-runner-model.json"
          python scripts/check_deploy_contract.py "$RUNNER_TEMP/boca-runner-model.json" "$BOCA_IMAGE_REF"
      - name: Validate reviewed served BETA runner Compose model
        if: inputs.operation == 'beta-install' || inputs.operation == 'beta-start' || inputs.operation == 'beta-acceptance' || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref == '')
        env:
          BOCA_IMAGE: ${{ inputs.image_ref }}
          BOCA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml config --format json > "$RUNNER_TEMP/boca-beta-runner-model.json"
          python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-beta-runner-model.json" "$BOCA_IMAGE_REF"
      - name: Validate exact optional dual-service IPC Compose model before SSH
        id: reviewed_browser_model
        if: startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '') || inputs.operation == 'cutover-a-observe' || inputs.operation == 'cutover-a-worker-preflight' || inputs.operation == 'cutover-a-apply' || inputs.operation == 'official-notice-import' || inputs.operation == 'protected-go-prepare' || inputs.operation == 'lifecycle-apply'
        env:
          BOCA_IMAGE: ${{ inputs.image_ref }}
          BOCA_BROWSER_IMAGE: ${{ inputs.browser_image_ref }}
          BOCA_BROWSER_ATTEMPT_ID: ${{ github.run_id }}
          BOCA_BROWSER_SECCOMP_PATH: /srv/boca-socios/seccomp_profile.json
          BOCA_CONTROL_DIR: /home/boca-deploy/.boca-on-demand/socket
          BOCA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # PREPARE/APPLY mobile dispatches intentionally leave image_ref inputs
          # blank. Earlier authenticated Actions receipts populate these exact
          # environment pins; Compose must use those reviewed bytes, not input.
          case "$BOCA_OPERATION" in
            cutover-a-apply|official-notice-import|protected-go-prepare|lifecycle-apply)
              [[ -n "$BOCA_IMAGE_REF" && -n "$BOCA_BROWSER_IMAGE_REF" ]]
              [[ -z "$BOCA_IMAGE" || "$BOCA_IMAGE" == "$BOCA_IMAGE_REF" ]]
              [[ -z "$BOCA_BROWSER_IMAGE" || "$BOCA_BROWSER_IMAGE" == "$BOCA_BROWSER_IMAGE_REF" ]]
              BOCA_IMAGE="$BOCA_IMAGE_REF"
              BOCA_BROWSER_IMAGE="$BOCA_BROWSER_IMAGE_REF"
              export BOCA_IMAGE BOCA_BROWSER_IMAGE
              ;;
          esac
          docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml config --format json > "$RUNNER_TEMP/boca-browser-runner-model.json"
          python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-browser-runner-model.json" "$BOCA_IMAGE_REF" --topology=browser-ipc-v2
          mode="$(jq -er '.services.controller.environment.BOCA_BOT_CONTROL // "legacy"' "$RUNNER_TEMP/boca-browser-runner-model.json")"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          if [[ "$mode" == on-demand ]]; then
            case "$BOCA_OPERATION" in
              beta-browser-start|beta-browser-restart|beta-browser-acceptance|lifecycle-apply)
                printf 'BOCA_BOT_CONTROL state=REFUSED reason=owner_session_controls_runtime host_effects=none\n' >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          fi
      - name: Build exact reviewed Cutover A ZIP for owner dispatch V3
        if: inputs.operation == 'cutover-a-apply'
        env:
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          python scripts/build_protected_boca_bundle.py . "$RUNNER_TEMP/boca-cutover-a-review.pyz"
      - name: Recheck exact official source before independent APPLY GO_B
        if: inputs.operation == 'official-notice-import' && inputs.protected_action_context != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          [[ "$BOCA_OFFICIAL_NEWS_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$BOCA_OFFICIAL_NEWS_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOCA_OFFICIAL_NEWS_RUN_ID" \
            > "$RUNNER_TEMP/boca-official-source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BOCA_OFFICIAL_NEWS_ARTIFACT_ID" \
            > "$RUNNER_TEMP/boca-official-artifact.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 40 \
            --proto '=https' --proto-redir '=https' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BOCA_OFFICIAL_NEWS_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/boca-official-artifact.zip"
      - name: Prepare no-effect immutable Cutover or official GO_B review object
        id: legacy_go_prepare
        if: inputs.operation == 'official-notice-import' && inputs.protected_action_context == ''
        env:
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          # The PREPARE review object includes exact SHA/image/browser/release,
          # observed host CID if applicable, original Compose or public notice
          # ZIP bytes, owner subject digest and an immutable PREPARE run ID.
          # It does NOT authorize any host effect: no GO env is read here.
          python scripts/check_legacy_go_dispatch.py prepare
          printf 'BOCA_LEGACY_PREPARE state=READY host_effects=0 prepared_run=%s\n' "$GITHUB_RUN_ID"
      - name: Publish inert reviewed GO_B PREPARE coordinates and receipt
        if: inputs.operation == 'official-notice-import' && inputs.protected_action_context == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boca-protected-legacy-go-prepare
          path: |
            ${{ runner.temp }}/boca-legacy-prepare.coordinates.json
            ${{ runner.temp }}/boca-legacy-prepare.receipt.json
          if-no-files-found: error
          retention-days: 2
      - name: Bind owner dispatch V3 to exact dual release and reviewed bytes
        id: cutover_go_preflight
        if: inputs.operation == 'cutover-a-apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          # No Environment GO_B or PREPARE artifact authorizes V3. This hash
          # binds the already authenticated owner's dispatch to reviewed bytes.
          python scripts/check_boca_deploy_dispatch.py "$RUNNER_TEMP/boca-dispatch-v3" --write-invocation
      - name: Require independent GO and exact official source artifact before SSH
        id: official_import_go_preflight
        if: inputs.operation == 'official-notice-import' && inputs.protected_action_context != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOCA_OFFICIAL_IMPORT_GO_BINDING_SHA256: ${{ vars.BOCA_OFFICIAL_IMPORT_GO_BINDING_SHA256 }}
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          [[ "$BOCA_OFFICIAL_IMPORT_GO_BINDING_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-official.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-official.json" "$BOCA_SOURCE_SHA"
          python scripts/check_legacy_go_dispatch.py apply \
            "$RUNNER_TEMP/boca-legacy-prepare-run.json" \
            "$RUNNER_TEMP/boca-legacy-prepared/boca-legacy-prepare.coordinates.json" \
            "$RUNNER_TEMP/boca-legacy-prepared/boca-legacy-prepare.receipt.json"
          python -m boca_socios.host_official_notice_actions runner-preflight-prepared \
            "$RUNNER_TEMP/boca-official-source-run.json" \
            "$RUNNER_TEMP/boca-official-artifact.json" \
            "$RUNNER_TEMP/boca-official-artifact.zip" \
            "$RUNNER_TEMP/boca-official-import.token"
      - name: Configure pinned READ_ONLY SSH for lifecycle PREPARE
        if: inputs.operation == 'protected-go-prepare'
        env:
          BOCA_HOST: ${{ vars.BOCA_DEPLOY_HOST }}
          BOCA_SSH_KEY: ${{ secrets.BOCA_DEPLOY_SSH_KEY }}
          BOCA_KNOWN_HOSTS: ${{ secrets.BOCA_DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$BOCA_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,252}$ ]]
          test -n "$BOCA_SSH_KEY"
          test -n "$BOCA_KNOWN_HOSTS"
          mkdir -m 700 "$RUNNER_TEMP/boca-ssh"
          printf '%s\n' "$BOCA_SSH_KEY" > "$RUNNER_TEMP/boca-ssh/key"
          printf '%s\n' "$BOCA_KNOWN_HOSTS" > "$RUNNER_TEMP/boca-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/boca-ssh/key" "$RUNNER_TEMP/boca-ssh/known_hosts"
          {
            printf 'Host boca-target\n'
            printf '  HostName %s\n' "$BOCA_HOST"
            printf '  User boca-deploy\n'
            printf '  IdentityFile %s/boca-ssh/key\n' "$RUNNER_TEMP"
            printf '  UserKnownHostsFile %s/boca-ssh/known_hosts\n' "$RUNNER_TEMP"
            printf '  GlobalKnownHostsFile /dev/null\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  BatchMode yes\n'
            printf '  IdentitiesOnly yes\n'
            printf '  IdentityAgent none\n'
            printf '  PasswordAuthentication no\n'
            printf '  KbdInteractiveAuthentication no\n'
            printf '  ClearAllForwardings yes\n'
            printf '  RequestTTY no\n'
            printf '  UpdateHostKeys no\n'
            printf '  ConnectTimeout 10\n'
            printf '  NumberOfPasswordPrompts 0\n'
            printf '  ForwardAgent no\n'
          } > "$RUNNER_TEMP/boca-ssh/config"
          chmod 600 "$RUNNER_TEMP/boca-ssh/config"
      - name: Observe one existing Boca owner intent and installed pins READ_ONLY
        id: lifecycle_host_observe
        if: inputs.operation == 'protected-go-prepare'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src:scripts
        run: |
          set -euo pipefail
          # No permissions to start/stop anything; one Boca-only read via the
          # same reviewed ZIP/memfd bootstrap, pinned SSH and existing lease.
          # Host derives component/target from the ONE current REQUESTED.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            > "$RUNNER_TEMP/boca-main-ref-lifecycle-observe.json"
          python scripts/check_main_ref.py \
            "$RUNNER_TEMP/boca-main-ref-lifecycle-observe.json" "$BOCA_SOURCE_SHA"
          python scripts/build_protected_boca_bundle.py . "$RUNNER_TEMP/boca-protected-lifecycle-review.pyz"
          python scripts/check_protected_go_prepare.py --observe-request
          IFS= read -r observe_token < "$RUNNER_TEMP/boca-lifecycle-observe.request"
          bundle_digest="$(sha256sum "$RUNNER_TEMP/boca-protected-lifecycle-review.pyz" | cut -d' ' -f1)"
          remote_command="$(python3 - "$observe_token" "$bundle_digest" <<'PY'
          import shlex
          import sys

          observe_token, bundle_sha256 = sys.argv[1:]
          with open("scripts/boca_protected_memfd_bootstrap.py", encoding="utf-8") as source:
              reviewed_bootstrap = source.read()
          args = ["python3", "-c", reviewed_bootstrap, bundle_sha256, "lifecycle-observe", observe_token]
          print(shlex.join(args))
          PY
          )"
          timeout --signal=TERM --kill-after=5s 95s ssh \
            -F "$RUNNER_TEMP/boca-ssh/config" \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            boca-target "$remote_command" \
            < "$RUNNER_TEMP/boca-protected-lifecycle-review.pyz" \
            > "$RUNNER_TEMP/boca-lifecycle-observed-public.json" 2>/dev/null
          python scripts/check_protected_go_prepare.py --assert-observed \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare one reviewed lifecycle GO from Boca READ_ONLY observation
        id: lifecycle_go_prepare
        if: inputs.operation == 'protected-go-prepare'
        env:
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: scripts:src
        run: |
          set -euo pipefail
          # Browser release/ZIP, installed Docker pins and the one Boca
          # REQUESTED are now verified. The host read made ZERO mutations.
          # No second SSH, no Docker effect, Bot API or browser mutation.
          test -s "$RUNNER_TEMP/boca-lifecycle-observed-public.json"
          test -s "$RUNNER_TEMP/boca-protected-lifecycle-review.pyz"
          python scripts/check_protected_go_prepare.py --prepare \
            > "$RUNNER_TEMP/boca-lifecycle-prepare-summary.txt"
