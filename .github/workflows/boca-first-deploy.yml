          receipt=''
          if [[ "$acceptance_rc" -eq 0 ]]; then receipt="$(cat "$RUNNER_TEMP/boca-beta-acceptance.receipt")"; fi
          receipt_pattern='^BOCA_BETA_ACCEPTANCE state=PASS source_sha=([0-9a-f]{40}) image=(ghcr[.]io/mbalbo2023/boca-socios-assistant@sha256:[0-9a-f]{64}) scope=container_loopback requests=([0-9]+) median_ms=([0-9]+[.][0-9]{2}) p95_ms=([0-9]+[.][0-9]{2}) elapsed_ms=([0-9]+[.][0-9]{2}) cpu_ms=([0-9]+[.][0-9]{2}) process_peak_rss_kib=([0-9]+) scratch_bytes=([0-9]+) members=1 intents=1 notices=1 local_http=verified engine=off site=not_contacted telegram=not_sent stage_free_mib=([0-9]+) docker_free_mib=([0-9]+) stage_inodes=([0-9]+) docker_inodes=([0-9]+)$'
          if [[ "$acceptance_rc" -ne 0 || ${#receipt} -gt 600 || ! "$receipt" =~ $receipt_pattern ]]; then
            printf 'Boca BETA synthetic acceptance: NO_GO; host output withheld. Boca-only stop follows if its protected gate remains valid.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$BOCA_SOURCE_SHA" || "${BASH_REMATCH[2]}" != "$BOCA_IMAGE_REF" ]]; then
            printf 'Boca BETA synthetic acceptance: NO_GO; source or digest receipt mismatch.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'Boca BETA synthetic container-loopback acceptance: `%s`. This does not verify owner tablet access, Site or Telegram.\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop positively identified Boca services after BETA acceptance
        if: always() && inputs.operation == 'beta-acceptance' && steps.boca_beta_acceptance_attempt.outputs.started == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-beta-stop.json" 2>/dev/null
          main_rc=$?
          if [[ "$main_rc" -eq 0 ]]; then python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-beta-stop.json" "$BOCA_SOURCE_SHA" >/dev/null 2>&1; main_rc=$?; fi
          if [[ "$main_rc" -ne 0 ]]; then
            printf 'Boca BETA acceptance: NO_GO; main changed or is unavailable after the test. Boca-only stop remains required under the positively marked host attempt.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - stop-test "$BOCA_SOURCE_SHA")"
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_rootless_setup.py > "$RUNNER_TEMP/boca-beta-stop.receipt" 2>/dev/null
          stop_rc=$?
          set -e
          receipt=''
          if [[ "$stop_rc" -eq 0 ]]; then receipt="$(cat "$RUNNER_TEMP/boca-beta-stop.receipt")"; fi
          stop_pattern='^BOCA_STOP_TEST state=STOPPED source_sha=([0-9a-f]{40}) containers=1 data=preserved$'
          if [[ "$stop_rc" -ne 0 || ${#receipt} -gt 180 || ! "$receipt" =~ $stop_pattern ]]; then
            printf 'Boca BETA stop: NO_GO; positive Boca stop receipt absent. Controller state unverified; original acceptance failure, if any, remains.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$BOCA_SOURCE_SHA" ]]; then
            printf 'Boca BETA stop: NO_GO; source receipt mismatch.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'Boca BETA tests ended: `%s`; data/key/owner retained.\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$main_rc" -ne 0 ]]; then exit 1; fi
      - name: Recheck current main before Telegram post-install custody
        if: startsWith(inputs.operation, 'telegram-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-telegram.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-telegram.json" "$BOCA_SOURCE_SHA"
      - name: Mark Telegram host attempt before starting existing Boca daemon
        id: boca_telegram_attempt
        if: startsWith(inputs.operation, 'telegram-')
        run: printf 'started=true\n' >> "$GITHUB_OUTPUT"
      - name: Start only stopped existing dedicated Boca daemon
        if: startsWith(inputs.operation, 'telegram-')
        run: |
          set +e
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - start-existing "$BOCA_SOURCE_SHA")"
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_rootless_setup.py > "$RUNNER_TEMP/boca-telegram-start.receipt" 2>/dev/null
          start_rc=$?
          set -e
          receipt=''
          if [[ "$start_rc" -eq 0 ]]; then receipt="$(cat "$RUNNER_TEMP/boca-telegram-start.receipt")"; fi
          pattern='^BOCA_ROOTLESS_START state=READY source_sha=([0-9a-f]{40}) inventory=known_stopped data=preserved$'
          if [[ "$start_rc" -ne 0 || ${#receipt} -gt 180 || ! "$receipt" =~ $pattern || "${BASH_REMATCH[1]}" != "$BOCA_SOURCE_SHA" ]]; then
            printf 'Boca Telegram start-existing: NO_GO; stopped-state provenance unverified. Boca-only stop follows.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Execute protected Telegram schema, custody or one-shot test
        if: startsWith(inputs.operation, 'telegram-')
        env:
          BOCA_BETA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          BOCA_TELEGRAM_ENVELOPE: ${{ inputs.telegram_envelope }}
          BOCA_TELEGRAM_EXPECTED_BOT_ID: ${{ secrets.BOCA_TELEGRAM_EXPECTED_BOT_ID }}
          BOCA_TELEGRAM_EXPECTED_CHAT_HMAC: ${{ secrets.BOCA_TELEGRAM_EXPECTED_CHAT_HMAC }}
        run: |
          set +e
          expected_bot=''
          expected_chat=''
          if [[ "$BOCA_OPERATION" = telegram-test ]]; then
            expected_bot="$BOCA_TELEGRAM_EXPECTED_BOT_ID"
            expected_chat="$BOCA_TELEGRAM_EXPECTED_CHAT_HMAC"
          fi
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - "$BOCA_OPERATION" "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$(cat "$RUNNER_TEMP/boca-beta-compose.sha")" "$BOCA_BETA_PANEL_ORIGIN" "$BOCA_BETA_OWNER_SUBJECT" "$BOCA_TELEGRAM_ENVELOPE" "$expected_bot" "$expected_chat")"
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_first_deploy.py > "$RUNNER_TEMP/boca-telegram-phase.receipt" 2>/dev/null
          phase_rc=$?
          set -e
          receipt=''
          if [[ "$phase_rc" -eq 0 ]]; then receipt="$(cat "$RUNNER_TEMP/boca-telegram-phase.receipt")"; fi
          case "$BOCA_OPERATION" in
            telegram-migrate) pattern='^BOCA_TELEGRAM_HOST state=SCHEMA_READY source_sha=([0-9a-f]{40}) schema=0007$' ;;
            telegram-prepare) pattern='^BOCA_TELEGRAM_BOOTSTRAP state=(PREPARED|ALREADY_PREPARED) public_key=([A-Za-z0-9_-]{43}) fingerprint=([0-9a-f]{64})$' ;;
            telegram-install) pattern='^BOCA_TELEGRAM_BOOTSTRAP state=CONFIGURED fingerprint=([0-9a-f]{64})$' ;;
            telegram-verify) pattern='^BOCA_TELEGRAM_BOOTSTRAP state=VERIFIED fingerprint=([0-9a-f]{64})$' ;;
            telegram-test) pattern='^BOCA_TELEGRAM_TEST state=API_ACCEPTED source_sha=([0-9a-f]{40}) synthetic=1 human_receipt=unverified$' ;;
            *) exit 1 ;;
          esac
          if [[ "$phase_rc" -ne 0 || ${#receipt} -gt 180 || ! "$receipt" =~ $pattern ]]; then
            printf 'Boca Telegram post-install custody: NO_GO; private details withheld. Boca-only stop follows.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$BOCA_OPERATION" = telegram-migrate || "$BOCA_OPERATION" = telegram-test ]] && [[ "${BASH_REMATCH[1]}" != "$BOCA_SOURCE_SHA" ]]; then
            printf 'Boca Telegram schema receipt mismatch; Boca-only stop follows.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'Boca Telegram protected phase: `%s`. Only telegram-test may report Bot API acceptance; human receipt remains unverified.\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop positively identified Boca services after Telegram custody
        if: always() && startsWith(inputs.operation, 'telegram-') && steps.boca_telegram_attempt.outputs.started == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-telegram-stop.json" 2>/dev/null
          main_rc=$?
          if [[ "$main_rc" -eq 0 ]]; then python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-telegram-stop.json" "$BOCA_SOURCE_SHA" >/dev/null 2>&1; main_rc=$?; fi
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - stop-test "$BOCA_SOURCE_SHA")"
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_rootless_setup.py > "$RUNNER_TEMP/boca-telegram-stop.receipt" 2>/dev/null
          stop_rc=$?
          set -e
          receipt=''
          if [[ "$stop_rc" -eq 0 ]]; then receipt="$(cat "$RUNNER_TEMP/boca-telegram-stop.receipt")"; fi
          pattern='^BOCA_STOP_TEST state=(STOPPED|ALREADY_STOPPED) source_sha=([0-9a-f]{40}) containers=(0|1|not_queried) data=preserved$'
          if [[ "$stop_rc" -ne 0 || ${#receipt} -gt 180 || ! "$receipt" =~ $pattern || "${BASH_REMATCH[2]}" != "$BOCA_SOURCE_SHA" ]]; then
            printf 'Boca Telegram stop: NO_GO; positive Boca-only stop receipt absent. Preserve all volumes and inspect before retry.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$BOCA_OPERATION" != telegram-test && "${BASH_REMATCH[3]}" = 1 ]]; then
            printf 'Boca Telegram stop: NO_GO; unexpected running container outside one-shot test.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'Boca Telegram custody phase ended: `%s`; controller and daemon stopped; app/key/owner/Telegram volumes retained.\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$main_rc" -ne 0 ]]; then exit 1; fi
      - name: Validate host Compose model for read-only diagnostic
        if: inputs.operation == 'diagnostic'
        env:
          PYTHONPATH: src
        run: |
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target python3 - diagnostic-config "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$(cat "$RUNNER_TEMP/boca-compose.sha")" < src/boca_socios/host_first_deploy.py > "$RUNNER_TEMP/boca-host-model.json"
          python scripts/check_deploy_contract.py "$RUNNER_TEMP/boca-host-model.json" "$BOCA_IMAGE_REF"
      - name: Inspect only Boca health and dormant motor
        if: inputs.operation == 'diagnostic'
        run: |
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target python3 - diagnostic "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$(cat "$RUNNER_TEMP/boca-compose.sha")" < src/boca_socios/host_first_deploy.py
          {
            printf 'Boca read-only diagnostic: healthy controller, engine off\n\n'
            printf 'Commit: `%s`\n\nImage: `%s`\n\nRelease run: `%s`\n\nService: `controller`\n' "$BOCA_SOURCE_SHA" "$BOCA_IMAGE_REF" "$BOCA_RELEASE_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
