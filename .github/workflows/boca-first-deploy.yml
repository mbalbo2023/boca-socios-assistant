name: Boca first deploy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Boca-only host operation; browser IPC is a separate, opt-in, protected BETA gate
        required: true
        type: choice
        options: [inspect-prerequisites, chrome-host-inspect, chrome-host-public-smoke, port-check, network-probe, network-probe-icc-true, prepare-rootless, preflight, infrastructure-preflight, infrastructure-inspect, first-install, diagnostic, stop-test, site-prepare, site-install, site-verify, owner-prepare, owner-install, owner-verify, owner-enroll, beta-install, beta-browser-install, beta-browser-start, beta-browser-restart, beta-browser-status, beta-browser-acceptance, beta-browser-telegram-start, beta-browser-telegram-recover, beta-acceptance, telegram-migrate, telegram-prepare, telegram-install, telegram-verify, telegram-test]
      source_sha:
        description: Exact current main commit approved for the operation
        required: true
        type: string
      image_ref:
        description: Full reviewed GHCR digest for install/diagnostic; blank for inspection/preflight
        required: false
        type: string
      browser_image_ref:
        description: Reviewed browser-worker GHCR digest for browser IPC install/lifecycle or dual-service Telegram
        required: false
        type: string
      release_run_id:
        description: Reviewed image release run ID for install/diagnostic/Site; blank for inspection/preflight
        required: false
        type: string
      site_envelope:
        description: Site-install only; canonical sealed JSON envelope encoded as unpadded base64url (ciphertext, never plaintext)
        required: false
        type: string
      telegram_envelope:
        description: Telegram-install only; sealed canonical JSON as unpadded base64url ciphertext
        required: false
        type: string
      owner_envelope:
        description: Owner-install only; sealed passkey/TLS JSON as unpadded base64url ciphertext
        required: false
        type: string
      owner_capability_sha256:
        description: Owner-enroll only; SHA-256 hex of a private 32-byte Chrome URL key, NEVER the bearer key
        required: false
        type: string
      failed_telegram_run_id:
        description: Telegram recovery only; exact prior failed run ID, never the current run or a guessed attempt
        required: false
        type: string
      service:
        description: Fixed Boca-only service
        required: true
        type: choice
        options: [controller]
      resource_budget:
        description: Exact cap; new-only browser IPC includes a separately capped worker
        required: true
        type: choice
        options: [0.5cpu-256m-64pids, 1.5cpu-1024m-192pids, 1.75cpu-1152m-224pids]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('boca-first-deploy-pr-{0}', github.event.pull_request.number) || 'boca-first-deploy' }}
  cancel-in-progress: false

jobs:
  pr-validation:
    if: github.event_name == 'pull_request'
    name: first-deploy-pr-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout proposed workflow without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install frozen development graph
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          uv sync --frozen
      - name: Check dispatch and first-install boundaries offline
        run: |
          uv run pytest -q tests/test_effective_unit_shape.py tests/test_infrastructure_diagnostics.py tests/test_owner_enrollment_argv.py tests/test_host_cpu_capacity.py tests/test_infrastructure_preflight.py tests/test_deploy_inputs.py tests/test_deploy_contract.py tests/test_beta_deploy_contract.py tests/test_beta_browser_deploy_contract.py tests/test_browser_ipc_workflow.py tests/test_host_browser_lifecycle.py tests/test_host_browser_ipc_file_stage.py tests/test_host_browser_ipc_install.py tests/test_host_browser_ipc_cleanup.py tests/test_host_browser_ipc_cross_contract.py tests/test_host_first_deploy.py tests/test_host_loopback_port.py tests/test_host_beta_install.py tests/test_host_beta_cleanup.py tests/test_host_beta_acceptance.py tests/test_host_site_bootstrap.py tests/test_owner_bootstrap.py tests/test_host_owner_bootstrap.py tests/test_host_owner_enroll_lifecycle.py tests/test_host_owner_enroll_cleanup.py tests/test_host_operation_gate.py tests/test_main_ref_gate.py tests/test_host_cleanup.py tests/test_host_stop_test.py tests/test_host_start_existing.py tests/test_telegram_storage_gate.py tests/test_telegram_one_shot.py tests/test_host_telegram.py tests/test_key_custody.py tests/test_release_run.py
          uv run python scripts/check_repo_policy.py
      - name: Validate optional served BETA Compose model without host access
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_PANEL_ORIGIN: http://localhost:8443
          BOCA_OWNER_SUBJECT: synthetic-owner
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml config --format json > "$RUNNER_TEMP/boca-beta-model.json"
          uv run python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-beta-model.json" "$BOCA_IMAGE"
      - name: Validate opt-in dual-service browser IPC Compose model offline
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_BROWSER_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant-browser@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BOCA_BROWSER_ATTEMPT_ID: "123456789"
          BOCA_BROWSER_SECCOMP_PATH: /srv/boca-socios/seccomp_profile.json
          BOCA_PANEL_ORIGIN: http://localhost:8443
          BOCA_OWNER_SUBJECT: synthetic-owner
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml config --format json > "$RUNNER_TEMP/boca-browser-model.json"
          uv run python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-browser-model.json" "$BOCA_IMAGE" --topology=browser-ipc-v2

  pr-runtime-smoke:
    if: github.event_name == 'pull_request'
    name: first-deploy-runtime-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BOCA_IMAGE: boca-first-install-smoke:${{ github.sha }}
      BOCA_BROWSER_IMAGE: boca-browser-lifecycle-smoke:${{ github.sha }}
      BOCA_BROWSER_ATTEMPT_ID: ${{ github.run_id }}
      BOCA_BROWSER_SECCOMP_PATH: ${{ github.workspace }}/docker/seccomp_profile.json
      BOCA_ENVIRONMENT: staging
      BOCA_PANEL_ORIGIN: http://localhost:8443
      BOCA_OWNER_SUBJECT: synthetic-owner
    steps:
      - name: Checkout proposed runtime without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build local simulation image only
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$BOCA_IMAGE" .
      - name: Build local browser lifecycle image without publication
        run: docker build --file Dockerfile.browser --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$BOCA_BROWSER_IMAGE" .
      - name: Verify disposable browser IPC one-shot Docker inspect and auto-remove defaults
        run: |
          set -euo pipefail
          # A disposable GitHub runner ONLY: no droplet, external image, host
          # socket mount, owner/key/data, published port or provider traffic.
          probe_name="boca-ci-ipc-one-shot-$GITHUB_RUN_ID"
          cidfile="$RUNNER_TEMP/boca-ci-ipc-one-shot.cid"
          probe_id=''
          cleanup_probe() {
            if [[ -z "$probe_id" && -f "$cidfile" ]]; then probe_id="$(cat "$cidfile")"; fi
            if [[ "$probe_id" =~ ^[0-9a-f]{64}$ ]]; then
              # Never stop an identity with another attempt's label.
              owned="$(docker inspect --format '{{ index .Config.Labels "boca.ci.ipc-probe" }}' "$probe_id" 2>/dev/null)" || return 0
              if [[ "$owned" = "$GITHUB_RUN_ID" ]]; then
                timeout 10s docker stop -t 2 "$probe_id" >/dev/null 2>&1 || true
              fi
            fi
          }
          trap cleanup_probe EXIT
          probe_id="$(timeout 30s docker run -d --rm --pull never --cidfile "$cidfile" \
            --name "$probe_name" --label "boca.ci.ipc-probe=$GITHUB_RUN_ID" \
            --user 10001:10001 --network none --ipc=private --cgroupns=private \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            "$BOCA_IMAGE" python -c 'import time; time.sleep(60)')"
          [[ "$probe_id" =~ ^[0-9a-f]{64}$ ]]
          timeout 10s docker inspect "$probe_id" > "$RUNNER_TEMP/boca-ci-ipc-one-shot.inspect.json"
          python - "$RUNNER_TEMP/boca-ci-ipc-one-shot.inspect.json" "$probe_id" "$probe_name" "$BOCA_IMAGE" "$GITHUB_RUN_ID" <<'PY'
          import json
          import sys

          record, = json.load(open(sys.argv[1], encoding="utf-8"))
          config, host = record["Config"], record["HostConfig"]
          assert record["Id"] == sys.argv[2]
          assert record["Name"] == "/" + sys.argv[3]
          assert config["Image"] == sys.argv[4]
          assert config["Labels"]["boca.ci.ipc-probe"] == sys.argv[5]
          assert config["User"] == "10001:10001"
          assert host["AutoRemove"] is True
          assert host["NetworkMode"] == "none"
          assert host["IpcMode"] == host["CgroupnsMode"] == "private"
          assert host["PidMode"] in ("", "private")
          assert host["UsernsMode"] == host["UTSMode"] == ""
          assert host["ReadonlyRootfs"] is True and host["Privileged"] is False
          assert host["CapDrop"] == ["ALL"] and not host["CapAdd"]
          assert host["PortBindings"] in ({}, None)
          assert record["NetworkSettings"]["Ports"] in ({}, None)
          assert record["Mounts"] == []
          PY
          timeout 10s docker stop -t 2 "$probe_id" >/dev/null
          # `--rm` can finish asynchronously; allow only a bounded observation,
          # never another run or an unlabelled cleanup.
          removed=''
          for _ in 1 2 3 4 5; do
            if ! docker inspect "$probe_id" >/dev/null 2>&1; then removed=yes; break; fi
            sleep 1
          done
          test "$removed" = yes
          probe_id=''
      - name: Exercise sealed Site intake in a disposable Boca owner volume
        run: |
          set -euo pipefail
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_owner boca-socios_boca_owner
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -c 'import os; os.chmod("/run/owner", 0o700); os.chown("/run/owner", 10001, 10001)'
          receipt="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.site_bootstrap prepare)"
          [[ "$receipt" =~ ^BOCA_SITE_BOOTSTRAP\ state=PREPARED\ public_key=([A-Za-z0-9_-]{43})\ fingerprint=([0-9a-f]{64})$ ]]
          public="${BASH_REMATCH[1]}"
          fingerprint="${BASH_REMATCH[2]}"
          sealed="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "$BOCA_IMAGE" python -c 'import base64,sys; from boca_socios.site_bootstrap import RecipientReceipt,seal_for_recipient; sealed=seal_for_recipient(RecipientReceipt("PREPARED",sys.argv[1],sys.argv[2]),"synthetic-ci-payload-00000000",b"x"*32); print(base64.urlsafe_b64encode(sealed).rstrip(b"=").decode("ascii"))' "$public" "$fingerprint")"
          PYTHONPATH=src python3 -c 'import sys; from boca_socios.host_first_deploy import _site_envelope; sys.stdout.write(_site_envelope(sys.argv[1]))' "$sealed" | \
            docker run --rm -i --pull never --user 10001:10001 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
              --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
              "$BOCA_IMAGE" python -m boca_socios.site_bootstrap install
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.site_bootstrap verify)" = \
            "BOCA_SITE_BOOTSTRAP state=VERIFIED fingerprint=$fingerprint"
          docker volume rm boca-socios_boca_owner
      - name: Exercise sealed HTTP owner passkey custody in a disposable Boca volume
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/boca-owner-custody-fixture"
          mkdir -m 700 "$fixture"
          openssl ecparam -name prime256v1 -genkey -noout -out "$fixture/passkey.pem"
          openssl pkey -in "$fixture/passkey.pem" -pubout -outform DER -out "$fixture/public_key.der"
          python3 -c 'import os,pathlib,sys; pathlib.Path(sys.argv[1]).write_bytes(os.urandom(32))' "$fixture/credential_id"
          chmod 0755 "$fixture"
          chmod 0644 "$fixture/credential_id" "$fixture/public_key.der"
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_owner boca-socios_boca_owner
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -c 'import os; os.chmod("/run/owner", 0o700); os.chown("/run/owner", 10001, 10001)'
          receipt="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --tmpfs /tmp:rw,noexec,nosuid,size=4m \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap -- prepare "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")"
          [[ "$receipt" =~ ^BOCA_OWNER_BOOTSTRAP\ state=PREPARED\ public_key=([A-Za-z0-9_-]{43})\ fingerprint=([0-9a-f]{64})$ ]]
          public="${BASH_REMATCH[1]}"
          fingerprint="${BASH_REMATCH[2]}"
          sealed="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --tmpfs /tmp:rw,noexec,nosuid,size=4m \
            --mount "type=bind,source=$fixture,target=/fixture,readonly" \
            "$BOCA_IMAGE" python -c 'import base64,sys; from pathlib import Path; from boca_socios.owner_bootstrap import RecipientReceipt,seal_for_recipient,_bundle_limits; bundle={name:(Path("/fixture")/name).read_bytes() for name in _bundle_limits(sys.argv[3])}; sealed=seal_for_recipient(RecipientReceipt("PREPARED",sys.argv[1],sys.argv[2]),bundle,sys.argv[3],sys.argv[4]); print(base64.urlsafe_b64encode(sealed).rstrip(b"=").decode())' "$public" "$fingerprint" "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")"
          test "$(PYTHONPATH=src python3 -c 'import sys; from boca_socios.host_first_deploy import _owner_envelope; sys.stdout.write(_owner_envelope(*sys.argv[1:]))' "$sealed" "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT" | \
            docker run --rm -i --pull never --user 10001:10001 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
              --tmpfs /tmp:rw,noexec,nosuid,size=4m \
              --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
              "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap -- install "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")" = \
            "BOCA_OWNER_BOOTSTRAP state=CONFIGURED fingerprint=$fingerprint"
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --tmpfs /tmp:rw,noexec,nosuid,size=4m \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap -- verify "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")" = \
            "BOCA_OWNER_BOOTSTRAP state=VERIFIED fingerprint=$fingerprint"
          docker volume rm boca-socios_boca_owner
          rm -rf "$fixture"
      - name: Smoke disposable Chrome listener and offline staged owner import
        run: |
          set -euo pipefail
          stage=boca-socios_owner_enroll_staging
          private_net=boca-socios_owner_enroll_private
          temporary=boca-socios-owner-enroll-1
          cleanup_enroll_smoke() {
            docker container rm --force "$temporary" >/dev/null 2>&1 || true
            docker network rm "$private_net" >/dev/null 2>&1 || true
            docker volume rm "$stage" >/dev/null 2>&1 || true
            docker volume rm boca-socios_boca_owner >/dev/null 2>&1 || true
          }
          test -z "$(docker ps -aq --filter "name=^/$temporary$")"
          test -z "$(docker network ls -q --filter "name=^$private_net$")"
          test -z "$(docker volume ls -q --filter "name=^$stage$")"
          test -z "$(docker volume ls -q --filter 'name=^boca-socios_boca_owner$')"
          trap cleanup_enroll_smoke EXIT
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_owner boca-socios_boca_owner
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=owner_enroll_staging "$stage"
          for volume in boca-socios_boca_owner "$stage"; do
            mountpoint=/run/owner
            if [[ "$volume" = "$stage" ]]; then mountpoint=/run/enrollment; fi
            docker run --rm --pull never --user 0:0 --network none --read-only \
              --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
              --pids-limit 16 --memory 64m --cpus 0.25 \
              --mount "type=volume,source=$volume,target=$mountpoint,volume-nocopy" \
              "$BOCA_IMAGE" python -c 'import os,sys; os.chmod(sys.argv[1],0o700); os.chown(sys.argv[1],10001,10001)' "$mountpoint"
          done
          recipient="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.owner_bootstrap -- prepare "$BOCA_PANEL_ORIGIN" "$BOCA_OWNER_SUBJECT")"
          [[ "$recipient" =~ ^BOCA_OWNER_BOOTSTRAP\ state=PREPARED\ public_key=([A-Za-z0-9_-]{43})\ fingerprint=([0-9a-f]{64})$ ]]
          public="${BASH_REMATCH[1]}"
          fingerprint="${BASH_REMATCH[2]}"
          private_digest="$(python3 -c 'import hashlib; print(hashlib.sha256(bytes([7])*32).hexdigest())')"
          docker network create --driver bridge \
            --opt com.docker.network.bridge.enable_ip_masquerade=false \
            --opt com.docker.network.bridge.enable_icc=false \
            --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.network=owner_enroll_private "$private_net"
          network_options="$(docker network inspect --format '{{json .Options}}' "$private_net")"
          python3 -c 'import json,sys; actual=json.loads(sys.argv[1]); expected={"com.docker.network.bridge.enable_ip_masquerade":"false","com.docker.network.bridge.enable_icc":"false","com.docker.network.bridge.host_binding_ipv4":"127.0.0.1"}; assert actual==expected' "$network_options"
          docker run --detach --pull never --name "$temporary" --user 10001:10001 \
            --network "$private_net" --publish 127.0.0.1:8443:8443/tcp \
            --restart no --no-healthcheck --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 0.5 \
            --mount "type=volume,source=$stage,target=/run/enrollment,volume-nocopy" \
            "$BOCA_IMAGE" python -m boca_socios.owner_enrollment -- \
            "$BOCA_OWNER_SUBJECT" "$private_digest" "$public" "$fingerprint"
          state="$(docker inspect --format '{{.State.Status}}/{{.State.ExitCode}}' "$temporary")"
          if [[ "$state" != running/0 ]]; then
            diagnostic="$(docker logs "$temporary" 2>&1 || true)"
            if [[ "$diagnostic" == *"BOCA_OWNER_ENROLL state=NO_GO"* ]]; then
              reason=owner_enrollment_rejected
            else
              reason=container_exited_without_proof
            fi
            printf 'BOCA_ENROLL_SMOKE state=NO_GO reason=%s container_status=%s\n' "$reason" "$state"
            exit 1
          fi
          published_ports="$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$temporary")"
          python3 -c 'import json,sys; actual=json.loads(sys.argv[1]); assert actual=={"8443/tcp":[{"HostIp":"127.0.0.1","HostPort":"8443"}]}' "$published_ports"
          ready=0
          for attempt in {1..40}; do
            if curl --noproxy '*' --silent --show-error --fail --max-time 2 \
              --header 'Host: localhost:8443' http://127.0.0.1:8443/activar \
              -o "$RUNNER_TEMP/boca-enroll-smoke.html"; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" -ne 1 ]]; then
            state="$(docker inspect --format '{{.State.Status}}/{{.State.ExitCode}}' "$temporary")"
            printf 'BOCA_ENROLL_SMOKE state=NO_GO reason=loopback_unreachable container_status=%s\n' "$state"
          fi
          test "$ready" -eq 1
          grep -q 'navigator.credentials' "$RUNNER_TEMP/boca-enroll-smoke.html" || \
            grep -q 'activar.js' "$RUNNER_TEMP/boca-enroll-smoke.html"
          test -z "$(docker inspect --format '{{range .Mounts}}{{if eq .Name "boca-socios_boca_owner"}}owner{{end}}{{end}}' "$temporary")"
          docker container stop --time 3 "$temporary" >/dev/null
          docker container rm "$temporary" >/dev/null
          docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount "type=volume,source=$stage,target=/run/enrollment,volume-nocopy" \
