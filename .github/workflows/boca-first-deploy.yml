          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-rootless.json" "$BOCA_SOURCE_SHA"
      - name: Prepare only dedicated Boca rootless user service
        if: inputs.operation == 'prepare-rootless'
