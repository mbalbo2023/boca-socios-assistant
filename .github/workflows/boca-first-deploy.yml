      - name: Observe original RUNNING singleton for cutover A without host effects
        if: inputs.operation == 'cutover-a-observe'
        env:
          BOCA_BETA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
        run: |
          set -euo pipefail
          # Only runner-local diagnostic files; no raw stderr in Actions logs
          # or artifacts. A child file-size limit also bounds hostile output
          # *during* SSH, rather than checking disk usage after it has grown.
          # mktemp -d creates an exclusive private runner directory, so a
          # preplanted symlink/hardlink at a predictable path cannot redirect
          # raw host output before the bounded reader validates it.
          umask 077
          observe_dir="$(mktemp -d "$RUNNER_TEMP/boca-cutover-a-observe.XXXXXXXX")"
          trap 'rm -f -- "$observe_dir/receipt" "$observe_dir/stderr"; rmdir -- "$observe_dir"' EXIT
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' \
            python3 - --browser-image "$BOCA_BROWSER_IMAGE_REF" \
            --cutover-target-image "$BOCA_IMAGE_REF" \
            --cutover-target-sha "$BOCA_SOURCE_SHA" \
            --cutover-legacy-id "$BOCA_LEGACY_CONTROLLER_ID" \
            -- cutover-a-observe "$BOCA_LEGACY_IMAGE_REF" "$BOCA_LEGACY_SOURCE_SHA" \
            "$(cat "$RUNNER_TEMP/boca-cutover-legacy-compose.sha")" \
            "$BOCA_BETA_PANEL_ORIGIN" "$BOCA_BETA_OWNER_SUBJECT")"
