          [[ "$receipt" =~ ^BOCA_TELEGRAM_BOOTSTRAP\ state=PREPARED\ public_key=([A-Za-z0-9_-]{43})\ fingerprint=([0-9a-f]{64})$ ]]
          printf 'BOCA_TELEGRAM_SMOKE phase=recipient_prepared\n'
          public="${BASH_REMATCH[1]}"
          fingerprint="${BASH_REMATCH[2]}"
          sealed="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "$BOCA_IMAGE" python -c 'import base64,sys; from boca_socios.telegram_bootstrap import RecipientReceipt,seal_for_recipient; value=seal_for_recipient(RecipientReceipt("PREPARED",sys.argv[1],sys.argv[2]),"12345:synthetic-bot-token-for-ci","-123456789"); print(base64.urlsafe_b64encode(value).rstrip(b"=").decode("ascii"))' "$public" "$fingerprint")"
          printf 'BOCA_TELEGRAM_SMOKE phase=sealed_offline\n'
          test "$(PYTHONPATH=src python3 -c 'import sys; from boca_socios.host_first_deploy import _telegram_envelope; sys.stdout.write(_telegram_envelope(sys.argv[1]))' "$sealed" | \
            docker run --rm -i --pull never --user 10001:10001 --network none --read-only \
