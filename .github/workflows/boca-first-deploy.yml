            "$BOCA_IMAGE" python -m boca_socios.telegram_one_shot test "$GITHUB_SHA" 12345 \
            eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee \
