name: Boca first deploy
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-stage-recover' && format('BOCA-V3-STAGE-RECOVER-{0}', inputs.protected_action_context) || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-apply' && 'BOCA-SIMULATION-DEPLOY-V3' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-stage-recover-844' && 'BOCA-R96-STAGE-844-RECOVER-ONCE' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-recover-834' && 'BOCA-R94-WORKER-834-RECOVER-ONCE' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-recover-827' && 'BOCA-R91-WORKER-827-RECOVER-ONCE' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-recover-819' && 'BOCA-R87-WORKER-819-RECOVER-ONCE' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-preflight' && 'BOCA-R84-WORKER-PREFLIGHT-ONCE' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-recover-807' && 'BOCA-R82-WORKER-807-RECOVER-ONCE' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-recover' && 'BOCA-R80-WORKER-RECOVER-ONCE' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-inspect' && inputs.protected_action_context == '42375050546' && 'BOCA-R93-WORKER-834-READONLY' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-inspect' && inputs.protected_action_context == '42368541950' && 'BOCA-R90-WORKER-827-READONLY' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-inspect' && inputs.protected_action_context == '42353468231' && 'BOCA-R86-WORKER-819-READONLY' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-worker-inspect' && inputs.protected_action_context == '42341290485' && 'BOCA-R81-WORKER-807-READONLY' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-reconcile' && inputs.protected_action_context == '42742150879' && 'BOCA-R137-904-RECOVERY-INVENTORY' || github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover-a-reconcile' && inputs.protected_action_context == '42750940352' && 'BOCA-R138-916-IMAGE-PLAN' || 'Boca first deploy' }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: cutover-a-apply is ONE simulation deploy dispatch; leave all pins and protected_action_context blank. No login/tickets.
        required: true
        type: choice
        options: [inspect-prerequisites, chrome-host-inspect, chrome-host-public-smoke, port-check, network-probe, network-probe-icc-true, network-probe-icc-true-cleanup-only, prepare-rootless, preflight, infrastructure-preflight, infrastructure-inspect, first-install, diagnostic, stop-test, site-prepare, site-install, site-verify, owner-prepare, owner-install, owner-verify, owner-enroll, beta-install, beta-start, beta-browser-install, beta-browser-start, beta-browser-restart, beta-browser-status, beta-browser-acceptance, beta-browser-telegram-start, beta-browser-telegram-recover, worker-diagnose-once, worker-physical-once, cutover-a-reconcile, cutover-a-stage-recover, cutover-a-stage-recover-844, cutover-a-image-retire, cutover-a-observe, cutover-a-worker-inspect, cutover-a-worker-events-r112, cutover-a-worker-recover, cutover-a-worker-recover-807, cutover-a-worker-recover-819, cutover-a-worker-recover-827, cutover-a-worker-recover-834, cutover-a-worker-preflight, cutover-a-apply, official-notice-import, protected-go-prepare, lifecycle-apply, telegram-activate, beta-acceptance, telegram-migrate, telegram-prepare, telegram-install, telegram-verify, telegram-test]
      source_sha:
        description: REQUIRED cutover-a-worker-preflight - exact current main SHA for the new dual release; Cutover APPLY/PREPARE derives github.sha
        required: false
        type: string
      image_ref:
        description: REQUIRED cutover-a-worker-preflight - new dual release controller GHCR image @sha256:64-hex digest; not legacy
        required: false
        type: string
      browser_image_ref:
        description: REQUIRED cutover-a-worker-preflight - browser GHCR image @sha256:64-hex digest from the same new dual release
        required: false
        type: string
      release_run_id:
        description: REQUIRED cutover-a-worker-preflight - successful new dual release run with both controller/browser immutable manifests
        required: false
        type: string
      site_envelope:
        description: Site-install only; canonical sealed JSON envelope encoded as unpadded base64url (ciphertext, never plaintext)
        required: false
        type: string
      telegram_envelope:
        description: Telegram-install only; sealed canonical JSON as unpadded base64url ciphertext
        required: false
        type: string
      owner_envelope:
        description: Owner-install only; sealed passkey/TLS JSON as unpadded base64url ciphertext
        required: false
        type: string
      owner_capability_sha256:
        description: Owner-enroll only; SHA-256 hex of a private 32-byte Chrome URL key, NEVER the bearer key
        required: false
        type: string
      failed_telegram_run_id:
        description: Telegram recovery only; exact prior failed run ID, never the current run or a guessed attempt
        required: false
        type: string
      legacy_source_sha:
        description: REQUIRED cutover-a-worker-preflight - original installed controller historical source SHA (40-hex), verified from immutable receipts
        required: false
        type: string
      legacy_image_ref:
        description: REQUIRED cutover-a-worker-preflight - original installed controller historical GHCR @sha256:64-hex digest from verified receipts
        required: false
        type: string
      legacy_release_run_id:
        description: REQUIRED cutover-a-worker-preflight - historical original controller release run ID, NOT a Cutover PREPARE run; verify receipt
        required: false
        type: string
      legacy_controller_id:
        description: REQUIRED cutover-a-worker-preflight - exact original 64-hex legacy controller CID from verified host receipt, not probe
        required: false
        type: string
      official_controller_id:
        description: Official notice only; exact running Boca controller container ID, never name inference
        required: false
        type: string
      official_news_run_id:
        description: Official notice only; reviewed successful PR-only public news source workflow run ID
        required: false
        type: string
      official_news_source_sha:
        description: Official notice only; exact public source PR workflow commit SHA
        required: false
        type: string
      official_news_artifact_id:
        description: Official notice only; exact GitHub artifact ID, no arbitrary URL
        required: false
        type: string
      official_news_zip_sha256:
        description: Official notice only; reviewed complete ZIP SHA-256
        required: false
        type: string
      official_news_jsonl_sha256:
        description: Official notice only; reviewed JSONL SHA-256
        required: false
        type: string
      official_news_html_sha256:
        description: Official notice only; public article body SHA-256 from source receipt
        required: false
        type: string
      official_news_observed_at_utc:
        description: Official notice only; exact source observation UTC timestamp
        required: false
        type: string
      protected_action_context:
        description: cutover-a-apply V3 REQUIRES blank; Leave blank for Boca READ_ONLY PREPARE (official/lifecycle only); cutover-a-worker-preflight is EFFECTFUL (NOT READ_ONLY) yet REQUIRES blank; official/lifecycle APPLY uses only prior PREPARE run ID; never JSON/PIN/secret.
        required: false
        type: string
      service:
        description: Fixed Boca-only service
        required: true
        type: choice
        options: [controller]
      resource_budget:
        description: REQUIRED cutover-a-worker-preflight - select 1.5cpu-1024m-192pids; other operations obey their separate exact caps
        required: true
        type: choice
        options: [0.5cpu-256m-64pids, 1.5cpu-1024m-192pids, 1.75cpu-1152m-224pids]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('boca-first-deploy-pr-{0}', github.event.pull_request.number) || 'boca-first-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-validation:
    if: github.event_name == 'pull_request'
    name: first-deploy-pr-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout proposed workflow without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install frozen development graph
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          uv sync --frozen
      - name: Check dispatch and first-install boundaries offline
        run: |
          uv run pytest -q tests/test_host_beta_resume.py tests/test_host_cutover_adapter.py tests/test_effective_unit_shape.py tests/test_infrastructure_diagnostics.py tests/test_kernel_netfilter_readonly.py tests/test_owner_enrollment_argv.py tests/test_host_cpu_capacity.py tests/test_infrastructure_preflight.py tests/test_deploy_inputs.py tests/test_deploy_contract.py tests/test_beta_deploy_contract.py tests/test_beta_browser_deploy_contract.py tests/test_browser_ipc_workflow.py tests/test_host_browser_lifecycle.py tests/test_host_browser_ipc_file_stage.py tests/test_host_browser_ipc_install.py tests/test_host_browser_ipc_cleanup.py tests/test_host_browser_ipc_cross_contract.py tests/test_host_first_deploy.py tests/test_host_loopback_port.py tests/test_host_beta_install.py tests/test_host_beta_cleanup.py tests/test_host_beta_acceptance.py tests/test_host_site_bootstrap.py tests/test_owner_bootstrap.py tests/test_host_owner_enroll_lifecycle.py tests/test_host_owner_enroll_cleanup.py tests/test_host_operation_gate.py tests/test_main_ref_gate.py tests/test_host_cleanup.py tests/test_host_stop_test.py tests/test_host_start_existing.py tests/test_telegram_storage_gate.py tests/test_telegram_one_shot.py tests/test_host_telegram.py tests/test_key_custody.py tests/test_release_run.py
          uv run pytest -q tests/test_r124_linger_readonly.py tests/test_r124_linger_receipt_verify.py
          uv run python scripts/check_repo_policy.py
      - name: Validate optional served BETA Compose model without host access
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_PANEL_ORIGIN: http://localhost:8443
          BOCA_OWNER_SUBJECT: synthetic-owner
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml config --format json > "$RUNNER_TEMP/boca-beta-model.json"
          uv run python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-beta-model.json" "$BOCA_IMAGE"
      - name: Validate opt-in dual-service browser IPC Compose model offline
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_BROWSER_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant-browser@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BOCA_BROWSER_ATTEMPT_ID: "123456789"
          BOCA_BROWSER_SECCOMP_PATH: /srv/boca-socios/seccomp_profile.json
          BOCA_CONTROL_DIR: /home/boca-deploy/.boca-on-demand/socket
          BOCA_PANEL_ORIGIN: http://localhost:8443
          BOCA_OWNER_SUBJECT: synthetic-owner
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml config --format json > "$RUNNER_TEMP/boca-browser-model.json"
          uv run python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-browser-model.json" "$BOCA_IMAGE" --topology=browser-ipc-v2
      - name: Validate protected Cutover A, Option B ZIP and cleanup offline only
        run: |
          uv run pytest -q tests/test_host_boca_cleanup.py tests/test_host_boca_attempt.py tests/test_host_boca_transaction.py tests/test_host_boca_cutover.py tests/test_host_boca_cutover_backend.py tests/test_host_boca_cutover_receipt.py tests/test_host_boca_cutover_cli.py tests/test_host_cutover_postapply_reconcile.py tests/test_host_cutover_stage.py tests/test_protected_boca_bundle.py tests/test_cutover_worker_preflight.py tests/test_cutover_a_go.py tests/test_cutover_candidate_receipt.py tests/test_boca_deploy_finalizer_r23.py tests/test_protected_action_context_r26.py tests/test_protected_go_prepare_r26.py tests/test_protected_ops_workflow_r26.py tests/test_protected_mobile_go_r28.py tests/test_lifecycle_mobile_workflow_r28.py tests/test_cutover_worker_recovery.py tests/test_protected_boca_bundle_recovery.py tests/test_r79_workflow_contract.py tests/test_r80_recovery_gate.py tests/test_r82_exact_worker_807_recovery.py tests/test_r82_recovery_bundle.py tests/test_r82_recovery_dispatch.py tests/test_r82_recovery_workflow.py tests/test_r83_primary_phase.py tests/test_r83_cleanup_stages.py tests/test_r83_preflight_workflow.py tests/test_r83_bundle_caps.py tests/test_r84_worker_storage_admission.py tests/test_r84_worker_preflight_dispatch.py tests/test_r85_cutover_observe_provenance.py tests/test_r87_exact_worker_819_recovery.py tests/test_r87_recovery_bundle.py tests/test_r87_recovery_dispatch.py tests/test_r87_recovery_workflow.py tests/test_r88_preflight_capture.py tests/test_r88_stop_diagnostics.py tests/test_r89_preflight_input_descriptions.py
          uv run pytest -q tests/test_r86_exact_worker_819_observer.py tests/test_r90_exact_worker_827_observer.py tests/test_r93_exact_worker_834_observer.py
          uv run pytest -q tests/test_r91_worker_827_recovery.py tests/test_r91_worker_827_dispatch.py tests/test_r91_worker_827_workflow.py tests/test_r92_stop_ack_evidence.py tests/test_r92_preflight_receipt.py tests/test_r95_stop_short_alias.py
          uv run pytest -q tests/test_r94_worker_834_recovery.py tests/test_r94_worker_834_dispatch.py tests/test_r94_worker_834_workflow.py
          uv run pytest -q tests/test_r96_stage844_one_shot_workflow.py tests/test_r96_stage844_evidence_gate.py tests/test_r96_stage844_dispatch_gate.py tests/test_v3_stage_github_gate.py tests/test_host_cutover_stage_recovery.py
          uv run pytest -q tests/test_boca_deploy_dispatch_v3.py tests/test_cutover_dispatch_protocol_v3.py
          uv run pytest -q tests/test_r128_893_readonly_reconcile.py
          uv run python scripts/build_protected_boca_bundle.py . "$RUNNER_TEMP/boca-cutover-a-review.pyz"
      - name: Validate W1 one-start evidence and isolated bounded ZIP offline only
        run: |
          uv run pytest -q tests/test_host_worker_w1.py tests/test_worker_w1_dispatch.py tests/test_worker_w1_bundle.py tests/test_worker_w1_workflow.py
          uv run mypy src/boca_socios/host_worker_w1.py
      - name: Validate physical worker isolated ZIP and one-start guards offline only
        run: |
          uv run pytest -q tests/test_host_worker_physical.py tests/test_worker_physical_bundle.py tests/test_worker_physical_workflow.py tests/test_worker_physical_dispatch.py
          uv run mypy src/boca_socios/host_worker_physical.py
          uv run mypy --follow-imports=skip scripts/check_worker_physical_dispatch.py
      - name: Validate protected official notice artifact import offline only
        run: |
          uv run pytest -q tests/test_host_official_notice_actions_r24.py tests/test_official_import_actions_r24.py tests/test_host_official_notice_import.py
      - name: Assert PR cannot produce host cutover or cleanup receipt
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -e "$RUNNER_TEMP/boca-cutover-a-host.receipt" ]]; then
            printf 'Boca Cutover A PR validation: NO_GO unexpected host receipt; abort.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/boca-lifecycle-host.receipt" || -e "$RUNNER_TEMP/boca-lifecycle-prepare.receipt.json" || -e "$RUNNER_TEMP/boca-lifecycle-observed-public.json" ]]; then
            printf 'Boca lifecycle PR validation: NO_GO unexpected host/PREPARE receipt; abort.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/boca-official-import-host.receipt" ]]; then
            printf 'Boca official notice PR validation: NO_GO unexpected host import receipt; abort.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'BOCA_CUTOVER_A_PR_VERIFY state=SOURCE_ONLY host_calls=0 deploy=NO_GO physical_cleanup=UNVERIFIED; any future protected host failure/lost runner must fail closed without assuming if:always executed.\n' >> "$GITHUB_STEP_SUMMARY"

  pr-runtime-smoke:
    if: github.event_name == 'pull_request'
    name: first-deploy-runtime-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BOCA_IMAGE: boca-first-install-smoke:${{ github.sha }}
      BOCA_BROWSER_IMAGE: boca-browser-lifecycle-smoke:${{ github.sha }}
      BOCA_BROWSER_ATTEMPT_ID: ${{ github.run_id }}
      BOCA_BROWSER_SECCOMP_PATH: ${{ github.workspace }}/docker/seccomp_profile.json
      BOCA_CONTROL_DIR: /home/boca-deploy/.boca-on-demand/socket
      BOCA_ENVIRONMENT: staging
      BOCA_PANEL_ORIGIN: http://localhost:8443
      BOCA_OWNER_SUBJECT: synthetic-owner
    steps:
      - name: Checkout proposed runtime without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build local simulation image only
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$BOCA_IMAGE" .
      - name: Build local browser lifecycle image without publication
        run: docker build --file Dockerfile.browser --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$BOCA_BROWSER_IMAGE" .
      - name: Prove Docker-created service labels are discoverable by Compose on disposable runner
        run: |
          set -euo pipefail
          # Pure label/topology probe. Never starts controller/worker, never
          # mounts owner/key/data/IPC, never publishes a port or invokes the
          # protected browser package. No image is pushed to GHCR.
          original_name="boca-socios-controller-1"
          parked_name="boca-socios-controller-legacy-$GITHUB_RUN_ID"
          worker_name="boca-socios-browser-worker-1"
          original_id=''
          candidate_id=''
          worker_id=''
          cleanup_cutover_labels() {
            for id in "$candidate_id" "$original_id" "$worker_id"; do
              if [[ "$id" =~ ^[0-9a-f]{64}$ ]]; then
                attempt="$(docker inspect --format '{{ index .Config.Labels "boca.ci.cutover-label-probe" }}' "$id" 2>/dev/null)" || continue
                if [[ "$attempt" = "$GITHUB_RUN_ID" ]]; then
                  docker container rm "$id" >/dev/null 2>&1 || true
                fi
              fi
            done
          }
          trap cleanup_cutover_labels EXIT
          # Docker Compose *also* requires the config-hash label to list
          # manually created containers. Derive it from each reviewed resolved
          # service model, including the different legacy/candidate variants.
          original_hash_line="$(docker compose -p boca-socios -f compose.beta.yaml config --hash controller)"
          candidate_hash_line="$(docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml config --hash controller)"
          worker_hash_line="$(docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml config --hash browser-worker)"
          [[ "$original_hash_line" =~ ^controller\ [0-9a-f]{64}$ ]]
          [[ "$candidate_hash_line" =~ ^controller\ [0-9a-f]{64}$ ]]
          [[ "$worker_hash_line" =~ ^browser-worker\ [0-9a-f]{64}$ ]]
          original_hash="${original_hash_line#controller }"
          candidate_hash="${candidate_hash_line#controller }"
          worker_hash="${worker_hash_line#browser-worker }"
          labels=(--label com.docker.compose.project=boca-socios --label com.docker.compose.container-number=1 --label com.docker.compose.oneoff=False --label "boca.ci.cutover-label-probe=$GITHUB_RUN_ID")
          original_id="$(docker create --pull never --name "$original_name" --network none --restart no "${labels[@]}" --label "com.docker.compose.config-hash=$original_hash" --label com.docker.compose.service=controller "$BOCA_IMAGE" python -c 'pass')"
          worker_id="$(docker create --pull never --name "$worker_name" --network none --restart no "${labels[@]}" --label "com.docker.compose.config-hash=$worker_hash" --label com.docker.compose.service=browser-worker "$BOCA_BROWSER_IMAGE" python -c 'pass')"
          [[ "$original_id" =~ ^[0-9a-f]{64}$ && "$worker_id" =~ ^[0-9a-f]{64}$ ]]
          test "$(docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml ps -a -q browser-worker)" = "$worker_id"
          docker rename "$original_id" "$parked_name"
          test "$(docker inspect --format '{{.Id}}' "$parked_name")" = "$original_id"
          candidate_id="$(docker create --pull never --name "$original_name" --network none --restart no "${labels[@]}" --label "com.docker.compose.config-hash=$candidate_hash" --label com.docker.compose.service=controller "$BOCA_IMAGE" python -c 'pass')"
          [[ "$candidate_id" =~ ^[0-9a-f]{64}$ && "$candidate_id" != "$original_id" ]]
          # The transient duplicate controller service labels are expected.
          # Physical cutover may NOT rely on compose ps until old ID retires.
          mapfile -t controller_ids < <(docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml ps -a -q controller)
          test "${#controller_ids[@]}" -eq 2
          docker container rm "$original_id" >/dev/null
          original_id=''
          test "$(docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml ps -a -q controller)" = "$candidate_id"
          test "$(docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml ps -a -q browser-worker)" = "$worker_id"
          printf 'BOCA_CUTOVER_A_RUNNER state=LABEL_TOPOLOGY_PASS original=retired candidate=created_only worker=created_only starts=0 contacts=0\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify disposable browser IPC one-shot Docker inspect and auto-remove defaults
        run: |
          set -euo pipefail
          # A disposable GitHub runner ONLY: no droplet, external image, host
          # socket mount, owner/key/data, published port or provider traffic.
          probe_name="boca-ci-ipc-one-shot-$GITHUB_RUN_ID"
          cidfile="$RUNNER_TEMP/boca-ci-ipc-one-shot.cid"
          probe_id=''
          cleanup_probe() {
            if [[ -z "$probe_id" && -f "$cidfile" ]]; then probe_id="$(cat "$cidfile")"; fi
            if [[ "$probe_id" =~ ^[0-9a-f]{64}$ ]]; then
              # Never stop an identity with another attempt's label.
              owned="$(docker inspect --format '{{ index .Config.Labels "boca.ci.ipc-probe" }}' "$probe_id" 2>/dev/null)" || return 0
              if [[ "$owned" = "$GITHUB_RUN_ID" ]]; then
                timeout 10s docker stop -t 2 "$probe_id" >/dev/null 2>&1 || true
              fi
            fi
          }
          trap cleanup_probe EXIT
          probe_id="$(timeout 30s docker run -d --rm --pull never --cidfile "$cidfile" \
            --name "$probe_name" --label "boca.ci.ipc-probe=$GITHUB_RUN_ID" \
            --user 10001:10001 --network none --ipc=private --cgroupns=private \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            "$BOCA_IMAGE" python -c 'import time; time.sleep(60)')"
          [[ "$probe_id" =~ ^[0-9a-f]{64}$ ]]
          timeout 10s docker inspect "$probe_id" > "$RUNNER_TEMP/boca-ci-ipc-one-shot.inspect.json"
          python - "$RUNNER_TEMP/boca-ci-ipc-one-shot.inspect.json" "$probe_id" "$probe_name" "$BOCA_IMAGE" "$GITHUB_RUN_ID" <<'PY'
          import json
          import sys

