            if [[ "$BOCA_OPERATION" = cutover-a-stage-recover || ( "$BOCA_OPERATION" = cutover-a-reconcile && ( "$BOCA_PROTECTED_ACTION_CONTEXT" = 42750940352 || "$BOCA_PROTECTED_ACTION_CONTEXT" =~ ^(42405706503|42426260583|42658939650|42742150879)$ ) ) ]]; then
