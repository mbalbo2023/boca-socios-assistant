name: Boca first deploy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Boca host operation; BETA install requires separate private owner/TLS and protected release gates
        required: true
        type: choice
        options: [inspect-prerequisites, prepare-rootless, preflight, first-install, diagnostic, stop-test, site-prepare, site-install, site-verify, beta-install]
      source_sha:
        description: Exact current main commit approved for the operation
        required: true
        type: string
      image_ref:
        description: Full reviewed GHCR digest for install/diagnostic; blank for inspection/preflight
        required: false
        type: string
      release_run_id:
        description: Reviewed image release run ID for install/diagnostic/Site; blank for inspection/preflight
        required: false
        type: string
      site_envelope:
        description: Site-install only; canonical sealed JSON envelope encoded as unpadded base64url (ciphertext, never plaintext)
        required: false
        type: string
      service:
        description: Fixed Boca-only service
        required: true
        type: choice
        options: [controller]
      resource_budget:
        description: Fixed Boca-only maximum budget
        required: true
        type: choice
        options: [0.5cpu-256m-64pids]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('boca-first-deploy-pr-{0}', github.event.pull_request.number) || 'boca-first-deploy' }}
  cancel-in-progress: false

jobs:
  pr-validation:
    if: github.event_name == 'pull_request'
    name: first-deploy-pr-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout proposed workflow without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install frozen development graph
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          uv sync --frozen
      - name: Check dispatch and first-install boundaries offline
        run: |
          uv run pytest -q tests/test_deploy_inputs.py tests/test_deploy_contract.py tests/test_beta_deploy_contract.py tests/test_host_first_deploy.py tests/test_host_beta_install.py tests/test_host_site_bootstrap.py tests/test_host_cleanup.py tests/test_host_stop_test.py tests/test_key_custody.py tests/test_release_run.py
          uv run python scripts/check_repo_policy.py
      - name: Validate optional served BETA Compose model without host access
        env:
          BOCA_IMAGE: ghcr.io/mbalbo2023/boca-socios-assistant@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOCA_PANEL_ORIGIN: https://beta.boca.example.test:8443
          BOCA_OWNER_SUBJECT: synthetic-owner
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml config --format json > "$RUNNER_TEMP/boca-beta-model.json"
          uv run python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-beta-model.json" "$BOCA_IMAGE"

  pr-runtime-smoke:
    if: github.event_name == 'pull_request'
    name: first-deploy-runtime-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BOCA_IMAGE: boca-first-install-smoke:${{ github.sha }}
      BOCA_ENVIRONMENT: staging
      BOCA_PANEL_ORIGIN: https://beta.boca.example.test:8443
      BOCA_OWNER_SUBJECT: synthetic-owner
    steps:
      - name: Checkout proposed runtime without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build local simulation image only
        run: docker build --tag "$BOCA_IMAGE" .
      - name: Exercise sealed Site intake in a disposable Boca owner volume
        run: |
          set -euo pipefail
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_owner boca-socios_boca_owner
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -c 'import os; os.chmod("/run/owner", 0o700); os.chown("/run/owner", 10001, 10001)'
          receipt="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.site_bootstrap prepare)"
          [[ "$receipt" =~ ^BOCA_SITE_BOOTSTRAP\ state=PREPARED\ public_key=([A-Za-z0-9_-]{43})\ fingerprint=([0-9a-f]{64})$ ]]
          public="${BASH_REMATCH[1]}"
          fingerprint="${BASH_REMATCH[2]}"
          sealed="$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "$BOCA_IMAGE" python -c 'import base64,sys; from boca_socios.site_bootstrap import RecipientReceipt,seal_for_recipient; sealed=seal_for_recipient(RecipientReceipt("PREPARED",sys.argv[1],sys.argv[2]),"synthetic-ci-payload-00000000",b"x"*32); print(base64.urlsafe_b64encode(sealed).rstrip(b"=").decode("ascii"))' "$public" "$fingerprint")"
          PYTHONPATH=src python3 -c 'import sys; from boca_socios.host_first_deploy import _site_envelope; sys.stdout.write(_site_envelope(sys.argv[1]))' "$sealed" | \
            docker run --rm -i --pull never --user 10001:10001 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
              --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy \
              "$BOCA_IMAGE" python -m boca_socios.site_bootstrap install
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.site_bootstrap verify)" = \
            "BOCA_SITE_BOOTSTRAP state=VERIFIED fingerprint=$fingerprint"
          docker volume rm boca-socios_boca_owner
      - name: Provision separate owner-only key volume on disposable runner
        run: |
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_key boca-socios_boca_key
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.security.key_custody init
          if docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,volume-nocopy \
            "$BOCA_IMAGE" python -m boca_socios.security.key_custody init >/dev/null 2>&1; then
            exit 1
          fi
          docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.security.key_custody verify
      - name: Start isolated Compose controller and verify health without third-party traffic
        run: |
          docker compose -p boca-socios -f compose.yaml up --no-build --no-deps --wait --wait-timeout 90 -d controller
          container="$(docker compose -p boca-socios -f compose.yaml ps -q controller)"
          test -n "$container"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          test "$(docker exec --user 10001:10001 "$container" python -m boca_socios.security.key_custody inspect)" = BOCA_KEY_READY
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert (h["NanoCpus"], h["Memory"], h["PidsLimit"], h["ReadonlyRootfs"], h["Privileged"], h["PortBindings"], h["PublishAllPorts"]) == (500000000, 268435456, 64, True, False, {}, False)'
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["NetworkMode"] == "boca-socios_boca_private" and h["CapDrop"] == ["ALL"] and h["CapAdd"] in (None, []) and h["SecurityOpt"] == ["no-new-privileges:true"] and h["Tmpfs"] == {"/tmp": "rw,noexec,nosuid,size=16m"} and h["CgroupnsMode"] in ("private", "")'
          docker inspect --format '{{json .NetworkSettings}}' "$container" | python3 -c 'import json,sys; n=json.load(sys.stdin); assert n["Ports"] == {} and set(n["Networks"]) == {"boca-socios_boca_private"} and len(n["Networks"]["boca-socios_boca_private"]["NetworkID"]) == 64'
          network_id="$(docker inspect --format '{{json .NetworkSettings}}' "$container" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Networks"]["boca-socios_boca_private"]["NetworkID"])')"
          docker network inspect --format '{{json .}}' "$network_id" | python3 -c 'import json,sys; n=json.load(sys.stdin); cid,nid=sys.argv[1:]; assert n["Id"] == nid and n["Name"] == "boca-socios_boca_private" and n["Driver"] == "bridge" and n["Scope"] == "local" and n["Internal"] is False and n["Attachable"] is False and n["Ingress"] is False and set(n["Containers"]) == {cid} and n["Labels"]["com.docker.compose.project"] == "boca-socios" and n["Labels"]["com.docker.compose.network"] == "boca_private"' "$container" "$network_id"
          docker exec --user 10001:10001 "$container" python -m boca_socios.runtime_probe
          docker inspect --format '{{json .Mounts}}' "$container" | python3 -c 'import json,sys; m=json.load(sys.stdin); assert {(x["Type"], x["Name"], x["Destination"], x["RW"]) for x in m} == {("volume", "boca-socios_boca_data", "/data", True), ("volume", "boca-socios_boca_key", "/run/secrets", False)}'
          docker logs "$container" | python3 -c 'import json,sys; rows=[json.loads(x) for x in sys.stdin if x.strip()]; assert rows == [{"event": "started", "mode": "simulation", "engine": "off", "site_calls": 0}]'
      - name: Prepare synthetic owner bundle and new-only BETA database on disposable runner
        run: |
          docker compose -p boca-socios -f compose.yaml stop controller
          docker compose -p boca-socios -f compose.yaml rm -sf controller
          docker volume rm boca-socios_boca_data
          mkdir -m 700 "$RUNNER_TEMP/boca-owner-fixture"
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/boca-owner-fixture/passkey.pem"
          openssl pkey -in "$RUNNER_TEMP/boca-owner-fixture/passkey.pem" -pubout -outform DER -out "$RUNNER_TEMP/boca-owner-fixture/public_key.der"
          python3 -c 'import os,pathlib,sys; pathlib.Path(sys.argv[1]).write_bytes(os.urandom(32))' "$RUNNER_TEMP/boca-owner-fixture/credential_id"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$RUNNER_TEMP/boca-owner-fixture/tls.key" \
            -out "$RUNNER_TEMP/boca-owner-fixture/tls.crt" \
            -subj /CN=beta.boca.example.test -addext subjectAltName=DNS:beta.boca.example.test -days 1
          cp "$RUNNER_TEMP/boca-owner-fixture/tls.crt" "$RUNNER_TEMP/boca-owner-fixture/health-ca.pem"
          # Only disposable synthetic inputs are readable by the cap-dropped copy container.
          chmod 0755 "$RUNNER_TEMP/boca-owner-fixture"
          chmod 0644 "$RUNNER_TEMP/boca-owner-fixture/credential_id" \
            "$RUNNER_TEMP/boca-owner-fixture/public_key.der" \
            "$RUNNER_TEMP/boca-owner-fixture/tls.crt" \
            "$RUNNER_TEMP/boca-owner-fixture/tls.key" \
            "$RUNNER_TEMP/boca-owner-fixture/health-ca.pem"
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_owner boca-socios_boca_owner
          docker run --rm --pull never --user 0:0 --network none --read-only \
            --cap-drop ALL --cap-add CHOWN --security-opt no-new-privileges \
            --pids-limit 16 --memory 64m --cpus 0.25 \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner \
            --mount "type=bind,source=$RUNNER_TEMP/boca-owner-fixture,target=/fixture,readonly" \
            "$BOCA_IMAGE" sh -eu -c 'cp /fixture/credential_id /fixture/public_key.der /fixture/tls.crt /fixture/tls.key /fixture/health-ca.pem /run/owner/; chmod 0400 /run/owner/*; chown 10001:10001 /run/owner/*; chmod 0700 /run/owner; chown 10001:10001 /run/owner'
          # Probe the actual image with an owner-only mount, then key+owner;
          # neither can open a database or listener before data creation.
          beta_env=(
            --env BOCA_ENVIRONMENT=staging --env BOCA_RUNTIME_MODE=simulation
            --env BOCA_ENGINE_MODE=off --env BOCA_DB_PATH=/data/boca.sqlite3
            --env BOCA_MASTER_KEY_FILE=/run/secrets/boca_master_key
            --env "BOCA_PANEL_ORIGIN=$BOCA_PANEL_ORIGIN"
            --env "BOCA_OWNER_SUBJECT=$BOCA_OWNER_SUBJECT"
            --env BOCA_PASSKEY_CREDENTIAL_ID_FILE=/run/owner/credential_id
            --env BOCA_PASSKEY_PUBLIC_KEY_DER_FILE=/run/owner/public_key.der
            --env BOCA_TLS_CERT_FILE=/run/owner/tls.crt
            --env BOCA_TLS_KEY_FILE=/run/owner/tls.key
            --env BOCA_HEALTH_CA_FILE=/run/owner/health-ca.pem
            --env BOCA_BIND_HOST=0.0.0.0 --env BOCA_BIND_PORT=8443
          )
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "${beta_env[@]}" \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.runtime check-beta-owner)" = \
            '{"event":"beta_owner_ready","mode":"simulation","engine":"off"}'
          test "$(docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 16 --memory 64m --cpus 0.25 \
            "${beta_env[@]}" \
            --mount type=volume,source=boca-socios_boca_owner,target=/run/owner,volume-nocopy,readonly \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,volume-nocopy,readonly \
            "$BOCA_IMAGE" python -m boca_socios.runtime check-beta-config)" = \
            '{"event":"beta_config_ready","mode":"simulation","engine":"off"}'
          docker volume create --driver local \
            --label com.docker.compose.project=boca-socios \
            --label com.docker.compose.volume=boca_data boca-socios_boca_data
          docker run --rm --pull never --user 10001:10001 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 256m --cpus 0.50 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --env BOCA_ENVIRONMENT=staging \
            --env BOCA_RUNTIME_MODE=simulation --env BOCA_ENGINE_MODE=off \
            --env BOCA_DB_PATH=/data/boca.sqlite3 \
            --env BOCA_MASTER_KEY_FILE=/run/secrets/boca_master_key \
            --mount type=volume,source=boca-socios_boca_data,target=/data \
            --mount type=volume,source=boca-socios_boca_key,target=/run/secrets,readonly \
            "$BOCA_IMAGE" python -m boca_socios.runtime init-beta
      - name: Serve BETA on runner loopback with exact image, TLS and isolation
        run: |
          docker compose -p boca-socios -f compose.beta.yaml up --no-build --no-deps --wait --wait-timeout 90 -d controller
          container="$(docker compose -p boca-socios -f compose.beta.yaml ps -q controller)"
          test -n "$container"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert (h["NanoCpus"], h["Memory"], h["PidsLimit"], h["ReadonlyRootfs"], h["Privileged"], h["PortBindings"], h["PublishAllPorts"]) == (500000000, 268435456, 64, True, False, {"8443/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8443"}]}, False)'
          docker inspect --format '{{json .HostConfig}}' "$container" | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["NetworkMode"] == "boca-socios_boca_private" and h["CapDrop"] == ["ALL"] and h["CapAdd"] in (None, []) and h["SecurityOpt"] == ["no-new-privileges:true"] and h["Tmpfs"] == {"/tmp": "rw,noexec,nosuid,size=16m"} and h["CgroupnsMode"] in ("private", "")'
          docker inspect --format '{{json .NetworkSettings}}' "$container" | python3 -c 'import json,sys; n=json.load(sys.stdin); assert set(n["Networks"]) == {"boca-socios_boca_private"} and n["Ports"] == {"8443/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8443"}]}'
          docker inspect --format '{{json .Mounts}}' "$container" | python3 -c 'import json,sys; m=json.load(sys.stdin); assert {(x["Type"], x["Name"], x["Destination"], x["RW"]) for x in m} == {("volume", "boca-socios_boca_data", "/data", True), ("volume", "boca-socios_boca_key", "/run/secrets", False), ("volume", "boca-socios_boca_owner", "/run/owner", False)}'
          docker exec --user 10001:10001 "$container" python -m boca_socios.runtime_probe
          curl --fail --silent --show-error --noproxy '*' \
            --resolve beta.boca.example.test:8443:127.0.0.1 \
            --cacert "$RUNNER_TEMP/boca-owner-fixture/tls.crt" \
            https://beta.boca.example.test:8443/healthz > "$RUNNER_TEMP/boca-beta-health.receipt"
          test "$(cat "$RUNNER_TEMP/boca-beta-health.receipt")" = BOCA_BETA_READY
      - name: Remove only synthetic Boca resources from disposable runner
        if: always()
        run: |
          docker compose -p boca-socios -f compose.beta.yaml stop controller || true
          docker compose -p boca-socios -f compose.beta.yaml rm -sf controller || true
          docker compose -p boca-socios -f compose.yaml stop controller || true
          docker compose -p boca-socios -f compose.yaml rm -sf controller || true
          docker volume rm boca-socios_boca_data || true
          docker volume rm boca-socios_boca_key || true
          docker volume rm boca-socios_boca_owner || true
          docker network rm boca-socios_boca_private || true

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.actor == 'mbalbo2023'
    name: approved-boca-manual-operation
    environment: boca-first-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      BOCA_OPERATION: ${{ inputs.operation }}
      BOCA_IMAGE_REF: ${{ inputs.image_ref }}
      BOCA_SOURCE_SHA: ${{ inputs.source_sha }}
      BOCA_SERVICE: ${{ inputs.service }}
      BOCA_BUDGET: ${{ inputs.resource_budget }}
      BOCA_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - name: Require verified protected environment and matching main commit
        env:
          BOCA_HOST_READONLY_ENV_READY: ${{ vars.BOCA_HOST_READONLY_ENV_READY }}
          BOCA_DEPLOY_ENV_READY: ${{ vars.BOCA_DEPLOY_ENV_READY }}
          BOCA_BETA_ENV_READY: ${{ vars.BOCA_BETA_ENV_READY }}
          BOCA_BETA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          BOCA_SITE_ENVELOPE: ${{ inputs.site_envelope }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BOCA_SOURCE_SHA" = "$GITHUB_SHA"
          test "$BOCA_SERVICE" = controller
          test "$BOCA_BUDGET" = 0.5cpu-256m-64pids
          case "$BOCA_OPERATION" in
            inspect-prerequisites|preflight)
              test "$BOCA_HOST_READONLY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            prepare-rootless)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            stop-test)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            first-install|diagnostic)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            site-prepare|site-verify)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            site-install)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -n "$BOCA_SITE_ENVELOPE"
              ;;
            beta-install)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -n "$BOCA_BETA_PANEL_ORIGIN"
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact main commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm current main HEAD before host access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref.json" "$BOCA_SOURCE_SHA"
      - name: Validate immutable inputs and successful matching release
