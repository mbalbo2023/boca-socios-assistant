          # state remains UNVERIFIED and a new Cutover is not authorised.
          python3 scripts/check_cutover_observe_diagnostic.py \
            "$observe_rc" "$observe_dir/receipt" \
            "$observe_dir/stderr" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$observe_dir/receipt" <<'PY'
          import os
          import re
          import sys

          def require(condition: bool) -> None:
              if not condition:
                  raise ValueError("noncanonical Cutover observation")

          def verify() -> str:
              # R85 RCA: the canonical complete READY is 710 ASCII bytes,
              # not 640. Pin checks must work even under PYTHONOPTIMIZE.
              with open(sys.argv[1], "rb") as source:
                  raw = source.read(711)
              require(len(raw) == 710 and raw.endswith(b"\n") and raw.count(b"\n") == 1)
              receipt = raw.decode("ascii")
              fields = receipt.removesuffix("\n").split(" ")
              require(fields[:2] == ["BOCA_CUTOVER_A_OBSERVE", "state=READY"])
              require(fields[2] == f"legacy_sha={os.environ['BOCA_LEGACY_SOURCE_SHA']}")
              require(re.fullmatch(r"legacy_id=[0-9a-f]{64}", fields[3]) is not None)
              if os.environ["BOCA_LEGACY_CONTROLLER_ID"]:
                  require(fields[3] == f"legacy_id={os.environ['BOCA_LEGACY_CONTROLLER_ID']}")
              require(fields[4] == f"legacy_image={os.environ['BOCA_LEGACY_IMAGE_REF']}")
              require(fields[5] == f"target_sha={os.environ['BOCA_SOURCE_SHA']}")
              require(fields[6] == f"target_image={os.environ['BOCA_IMAGE_REF']}")
              require(fields[7] == f"browser_image={os.environ['BOCA_BROWSER_IMAGE_REF']}")
              require(fields[8:] == [
                  "original=RUNNING", "port=127.0.0.1:8443", "worker=absent",
                  "owner=preserved", "key=preserved", "data=preserved", "effects=none",
              ])
              return fields[3]

          try:
              legacy_id = verify()
          except (OSError, UnicodeError, ValueError, IndexError, AssertionError, KeyError):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      "BOCA_CUTOVER_A_OBSERVE state=NO_GO class=UNVERIFIED "
                      "reason=INVALID_READY host=UNVERIFIED original=UNVERIFIED "
                      "effects=UNVERIFIED cutover=NO_GO no_retry=1\n"
                  )
              raise SystemExit(1) from None
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "BOCA_CUTOVER_A_OBSERVE state=READY " + legacy_id
                  + " original=RUNNING worker=absent effects=none; "
                  "physical cutover remains NO_GO pending separate reviewed adapter.\n"
              )
          PY
