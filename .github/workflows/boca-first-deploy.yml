          set +e
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target python3 - "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$(cat "$RUNNER_TEMP/boca-compose.sha")" < src/boca_socios/host_cleanup.py > "$RUNNER_TEMP/boca-cleanup.receipt" 2>/dev/null
          cleanup_rc=$?
          set -e
          receipt=''
          if [[ "$cleanup_rc" -eq 0 ]]; then
            receipt="$(cat "$RUNNER_TEMP/boca-cleanup.receipt")"
          fi
          receipt_pattern='^BOCA_CLEANUP state=(CLEANED|ALREADY_CLEAN|PARTIAL|RETAINED) image=(removed|absent) stage=(removed|absent|retained) retained=(yes|no) image_logical_mib=[0-9]+ same_fs=(yes|no) stage_free_mib_before=[0-9]+ stage_free_mib_after=[0-9]+ docker_free_mib_before=[0-9]+ docker_free_mib_after=[0-9]+ stage_inodes_before=[0-9]+ stage_inodes_after=[0-9]+ docker_inodes_before=[0-9]+ docker_inodes_after=[0-9]+$'
