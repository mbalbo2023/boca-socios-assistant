          docker compose -p boca-socios -f compose.beta.yaml stop controller || true
          docker compose -p boca-socios -f compose.beta.yaml rm -sf controller || true
          docker compose -p boca-socios -f compose.yaml stop controller || true
          docker compose -p boca-socios -f compose.yaml rm -sf controller || true
          docker rm -f boca-socios-telegram-test-1 || true
          docker network rm boca-socios_telegram_egress || true
          docker volume rm boca-socios_boca_data || true
          docker volume rm boca-socios_boca_key || true
          docker volume rm boca-socios_boca_owner || true
          docker volume rm boca-socios_boca_telegram || true
          docker network rm boca-socios_boca_private || true

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mbalbo2023/boca-socios-assistant' && github.actor == 'mbalbo2023'
    name: approved-boca-manual-operation
    environment: boca-first-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      BOCA_OPERATION: ${{ inputs.operation }}
      BOCA_IMAGE_REF: ${{ inputs.image_ref }}
      BOCA_BROWSER_IMAGE_REF: ${{ inputs.browser_image_ref }}
      BOCA_SOURCE_SHA: ${{ inputs.source_sha }}
      BOCA_SERVICE: ${{ inputs.service }}
      BOCA_BUDGET: ${{ inputs.resource_budget }}
      BOCA_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      BOCA_OWNER_CAPABILITY_SHA256: ${{ inputs.owner_capability_sha256 }}
      BOCA_FAILED_TELEGRAM_RUN_ID: ${{ inputs.failed_telegram_run_id }}
    steps:
      - name: Require verified protected environment and matching main commit
        env:
          BOCA_HOST_READONLY_ENV_READY: ${{ vars.BOCA_HOST_READONLY_ENV_READY }}
          BOCA_DEPLOY_ENV_READY: ${{ vars.BOCA_DEPLOY_ENV_READY }}
          BOCA_BETA_ENV_READY: ${{ vars.BOCA_BETA_ENV_READY }}
          BOCA_BROWSER_ENV_READY: ${{ vars.BOCA_BROWSER_ENV_READY }}
          BOCA_TELEGRAM_ENV_READY: ${{ vars.BOCA_TELEGRAM_ENV_READY }}
          BOCA_TELEGRAM_OWNER_READY: ${{ vars.BOCA_TELEGRAM_OWNER_READY }}
          BOCA_TELEGRAM_EXPECTED_BOT_ID: ${{ secrets.BOCA_TELEGRAM_EXPECTED_BOT_ID }}
          BOCA_TELEGRAM_EXPECTED_CHAT_HMAC: ${{ secrets.BOCA_TELEGRAM_EXPECTED_CHAT_HMAC }}
          BOCA_BETA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_BETA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          BOCA_SITE_ENVELOPE: ${{ inputs.site_envelope }}
          BOCA_TELEGRAM_ENVELOPE: ${{ inputs.telegram_envelope }}
          BOCA_OWNER_ENVELOPE: ${{ inputs.owner_envelope }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BOCA_SOURCE_SHA" = "$GITHUB_SHA"
          test "$BOCA_SERVICE" = controller
          if [[ "$BOCA_OPERATION" = beta-browser-telegram-recover ]]; then
            [[ "$BOCA_FAILED_TELEGRAM_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            test "$BOCA_FAILED_TELEGRAM_RUN_ID" != "$GITHUB_RUN_ID"
          else
            test -z "$BOCA_FAILED_TELEGRAM_RUN_ID"
          fi
          if [[ "$BOCA_OPERATION" = infrastructure-preflight || "$BOCA_OPERATION" = infrastructure-inspect ]]; then
            [[ "$BOCA_BUDGET" = 1.5cpu-1024m-192pids || "$BOCA_BUDGET" = 1.75cpu-1152m-224pids ]]
          elif [[ "$BOCA_OPERATION" = beta-browser-install ]]; then
            test "$BOCA_BUDGET" = 1.5cpu-1024m-192pids
          elif [[ "$BOCA_OPERATION" = beta-browser-telegram-start || ( "$BOCA_TELEGRAM_OWNER_READY" = ready && ( "$BOCA_OPERATION" = beta-browser-* || ( "$BOCA_OPERATION" = telegram-* && -n "$BOCA_BROWSER_IMAGE_REF" ) ) ) ]]; then
            test "$BOCA_BUDGET" = 1.75cpu-1152m-224pids
          elif [[ "$BOCA_OPERATION" = beta-browser-* || ( "$BOCA_OPERATION" = telegram-* && -n "$BOCA_BROWSER_IMAGE_REF" ) ]]; then
            test "$BOCA_BUDGET" = 1.5cpu-1024m-192pids
          else
            test "$BOCA_BUDGET" = 0.5cpu-256m-64pids
          fi
          if [[ "$BOCA_OPERATION" != beta-browser-* && "$BOCA_OPERATION" != telegram-* ]]; then test -z "$BOCA_BROWSER_IMAGE_REF"; fi
          if [[ "$BOCA_OPERATION" != telegram-install ]]; then test -z "$BOCA_TELEGRAM_ENVELOPE"; fi
          if [[ "$BOCA_OPERATION" != owner-install ]]; then test -z "$BOCA_OWNER_ENVELOPE"; fi
          if [[ "$BOCA_OPERATION" != owner-enroll ]]; then test -z "$BOCA_OWNER_CAPABILITY_SHA256"; fi
          case "$BOCA_OPERATION" in
            infrastructure-preflight)
              test "$BOCA_HOST_READONLY_ENV_READY" = ready
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            inspect-prerequisites|chrome-host-inspect|chrome-host-public-smoke|port-check|preflight|infrastructure-inspect)
              test "$BOCA_HOST_READONLY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            prepare-rootless)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            stop-test)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            network-probe|network-probe-icc-true)
              test "$BOCA_HOST_READONLY_ENV_READY" = ready
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -z "$BOCA_IMAGE_REF"
              test -z "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            first-install|diagnostic)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            site-prepare|site-verify)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            site-install)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test -n "$BOCA_SITE_ENVELOPE"
              ;;
            owner-prepare|owner-verify|owner-install|owner-enroll)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = owner-install ]]; then
                test -n "$BOCA_OWNER_ENVELOPE"
              fi
              if [[ "$BOCA_OPERATION" = owner-enroll ]]; then
                [[ "$BOCA_OWNER_CAPABILITY_SHA256" =~ ^[0-9a-f]{64}$ ]]
              fi
              ;;
            beta-install|beta-acceptance)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            beta-browser-install)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_BROWSER_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              ;;
            beta-browser-start|beta-browser-restart|beta-browser-status|beta-browser-acceptance|beta-browser-telegram-start|beta-browser-telegram-recover)
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_BROWSER_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = beta-browser-telegram-start || "$BOCA_OPERATION" = beta-browser-telegram-recover ]]; then
                test "$BOCA_TELEGRAM_ENV_READY" = ready
                test "$BOCA_TELEGRAM_OWNER_READY" = ready
                [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              fi
              if [[ "$BOCA_TELEGRAM_OWNER_READY" = ready ]]; then
                test "$BOCA_TELEGRAM_ENV_READY" = ready
                [[ "$BOCA_TELEGRAM_EXPECTED_BOT_ID" =~ ^[1-9][0-9]{0,15}$ ]]
                [[ "$BOCA_TELEGRAM_EXPECTED_CHAT_HMAC" =~ ^[0-9a-f]{64}$ ]]
              fi
              ;;
            telegram-migrate|telegram-prepare|telegram-install|telegram-verify|telegram-test)
              if [[ -n "$BOCA_BROWSER_IMAGE_REF" ]]; then
                test "$BOCA_BROWSER_ENV_READY" = ready
                [[ "$BOCA_BROWSER_IMAGE_REF" =~ ^ghcr[.]io/mbalbo2023/boca-socios-assistant-browser@sha256:[0-9a-f]{64}$ ]]
              fi
              test "$BOCA_DEPLOY_ENV_READY" = ready
              test "$BOCA_BETA_ENV_READY" = ready
              test "$BOCA_TELEGRAM_ENV_READY" = ready
              test -n "$BOCA_IMAGE_REF"
              test -n "$BOCA_RELEASE_RUN_ID"
              test "$BOCA_BETA_PANEL_ORIGIN" = http://localhost:8443
              test -n "$BOCA_BETA_OWNER_SUBJECT"
              test -z "$BOCA_SITE_ENVELOPE"
              if [[ "$BOCA_OPERATION" = telegram-install ]]; then test -n "$BOCA_TELEGRAM_ENVELOPE"; fi
              if [[ "$BOCA_OPERATION" = telegram-test ]]; then
                test "$BOCA_TELEGRAM_OWNER_READY" = ready
                [[ "$BOCA_TELEGRAM_EXPECTED_BOT_ID" =~ ^[1-9][0-9]{0,15}$ ]]
                [[ "$BOCA_TELEGRAM_EXPECTED_CHAT_HMAC" =~ ^[0-9a-f]{64}$ ]]
              fi
              ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact main commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm current main HEAD before host access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref.json" "$BOCA_SOURCE_SHA"
      - name: Validate image-free infrastructure coordinates before SSH
        if: inputs.operation == 'infrastructure-preflight' || inputs.operation == 'infrastructure-inspect'
        env:
          PYTHONPATH: src
        run: python scripts/check_deploy_inputs.py --infrastructure-preflight "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
      - name: Validate immutable inputs and successful matching release
        if: inputs.operation == 'first-install' || inputs.operation == 'diagnostic' || inputs.operation == 'site-prepare' || inputs.operation == 'site-install' || inputs.operation == 'site-verify' || startsWith(inputs.operation, 'owner-') || inputs.operation == 'beta-install' || startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '') || inputs.operation == 'beta-acceptance' || startsWith(inputs.operation, 'telegram-')
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$BOCA_BUDGET" = 1.75cpu-1152m-224pids ]]; then
            python scripts/check_deploy_inputs.py --browser-ipc-v2 --telegram-runtime "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
          elif [[ "$BOCA_OPERATION" = beta-browser-* || ( "$BOCA_OPERATION" = telegram-* && -n "$BOCA_BROWSER_IMAGE_REF" ) ]]; then
            python scripts/check_deploy_inputs.py --browser-ipc-v2 "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
          else
            python scripts/check_deploy_inputs.py "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_SERVICE" "$BOCA_BUDGET" "$BOCA_RELEASE_RUN_ID"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOCA_RELEASE_RUN_ID" \
            > "$RUNNER_TEMP/boca-release-run.json"
          python scripts/check_release_run.py "$RUNNER_TEMP/boca-release-run.json" "$BOCA_SOURCE_SHA" "$BOCA_RELEASE_RUN_ID"
          gh run download "$BOCA_RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name boca-release-manifest --dir "$RUNNER_TEMP/boca-release-manifest"
          python -m boca_socios.release_manifest verify \
            "$RUNNER_TEMP/boca-release-manifest/boca-release-manifest.json" \
            "$BOCA_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_RELEASE_RUN_ID"
      - name: Require same-run immutable browser companion release manifest
        if: startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '')
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh run download "$BOCA_RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name boca-browser-release-manifest --dir "$RUNNER_TEMP/boca-browser-release-manifest"
          python -m boca_socios.browser_release_manifest verify \
            "$RUNNER_TEMP/boca-browser-release-manifest/boca-browser-release-manifest.json" \
            "$BOCA_IMAGE_REF" "$BOCA_BROWSER_IMAGE_REF" "$BOCA_SOURCE_SHA" "$BOCA_RELEASE_RUN_ID"
      - name: Hash reviewed Boca Compose file
        run: sha256sum compose.yaml | cut -d' ' -f1 > "$RUNNER_TEMP/boca-compose.sha"
      - name: Hash reviewed served BETA Compose file
        if: inputs.operation == 'beta-install' || startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '') || inputs.operation == 'beta-acceptance' || startsWith(inputs.operation, 'telegram-')
        run: sha256sum compose.beta.yaml | cut -d' ' -f1 > "$RUNNER_TEMP/boca-beta-compose.sha"
      - name: Hash reviewed optional browser IPC overlay and seccomp
        if: startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '')
        run: |
          sha256sum compose.beta.browser.yaml | cut -d' ' -f1 > "$RUNNER_TEMP/boca-browser-overlay.sha"
          sha256sum docker/seccomp_profile.json | cut -d' ' -f1 > "$RUNNER_TEMP/boca-browser-seccomp.sha"
      - name: Validate reviewed runner Compose model
        if: inputs.operation == 'first-install' || inputs.operation == 'diagnostic'
        env:
          BOCA_IMAGE: ${{ inputs.image_ref }}
          BOCA_ENVIRONMENT: staging
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.yaml config --format json > "$RUNNER_TEMP/boca-runner-model.json"
          python scripts/check_deploy_contract.py "$RUNNER_TEMP/boca-runner-model.json" "$BOCA_IMAGE_REF"
      - name: Validate reviewed served BETA runner Compose model
        if: inputs.operation == 'beta-install' || inputs.operation == 'beta-acceptance' || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref == '')
        env:
          BOCA_IMAGE: ${{ inputs.image_ref }}
          BOCA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml config --format json > "$RUNNER_TEMP/boca-beta-runner-model.json"
          python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-beta-runner-model.json" "$BOCA_IMAGE_REF"
      - name: Validate exact optional dual-service IPC Compose model before SSH
        if: startsWith(inputs.operation, 'beta-browser-') || (startsWith(inputs.operation, 'telegram-') && inputs.browser_image_ref != '')
        env:
          BOCA_IMAGE: ${{ inputs.image_ref }}
          BOCA_BROWSER_IMAGE: ${{ inputs.browser_image_ref }}
          BOCA_BROWSER_ATTEMPT_ID: ${{ github.run_id }}
          BOCA_BROWSER_SECCOMP_PATH: /srv/boca-socios/seccomp_profile.json
          BOCA_PANEL_ORIGIN: ${{ secrets.BOCA_BETA_PANEL_ORIGIN }}
          BOCA_OWNER_SUBJECT: ${{ secrets.BOCA_BETA_OWNER_SUBJECT }}
          PYTHONPATH: src
        run: |
          docker compose -p boca-socios -f compose.beta.yaml -f compose.beta.browser.yaml config --format json > "$RUNNER_TEMP/boca-browser-runner-model.json"
          python scripts/check_beta_deploy_contract.py "$RUNNER_TEMP/boca-browser-runner-model.json" "$BOCA_IMAGE_REF" --topology=browser-ipc-v2
      - name: Configure pinned SSH host key and dedicated identity
        env:
          BOCA_HOST: ${{ vars.BOCA_DEPLOY_HOST }}
          BOCA_SSH_KEY: ${{ secrets.BOCA_DEPLOY_SSH_KEY }}
          BOCA_KNOWN_HOSTS: ${{ secrets.BOCA_DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$BOCA_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,252}$ ]]
          test -n "$BOCA_SSH_KEY"
          test -n "$BOCA_KNOWN_HOSTS"
          mkdir -m 700 "$RUNNER_TEMP/boca-ssh"
          printf '%s\n' "$BOCA_SSH_KEY" > "$RUNNER_TEMP/boca-ssh/key"
          printf '%s\n' "$BOCA_KNOWN_HOSTS" > "$RUNNER_TEMP/boca-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/boca-ssh/key" "$RUNNER_TEMP/boca-ssh/known_hosts"
          {
            printf 'Host boca-target\n'
            printf '  HostName %s\n' "$BOCA_HOST"
            printf '  User boca-deploy\n'
            printf '  IdentityFile %s/boca-ssh/key\n' "$RUNNER_TEMP"
            printf '  UserKnownHostsFile %s/boca-ssh/known_hosts\n' "$RUNNER_TEMP"
            printf '  GlobalKnownHostsFile /dev/null\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  BatchMode yes\n'
            printf '  IdentitiesOnly yes\n'
            printf '  IdentityAgent none\n'
            printf '  PasswordAuthentication no\n'
            printf '  KbdInteractiveAuthentication no\n'
            printf '  ClearAllForwardings yes\n'
            printf '  RequestTTY no\n'
            printf '  UpdateHostKeys no\n'
            printf '  ConnectTimeout 10\n'
            printf '  NumberOfPasswordPrompts 0\n'
            printf '  ForwardAgent no\n'
          } > "$RUNNER_TEMP/boca-ssh/config"
          chmod 600 "$RUNNER_TEMP/boca-ssh/config"
      - name: Recheck current main before Site custody operation
        if: inputs.operation == 'site-prepare' || inputs.operation == 'site-install' || inputs.operation == 'site-verify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-site.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-site.json" "$BOCA_SOURCE_SHA"
      - name: Recheck current main before owner custody operation
        if: startsWith(inputs.operation, 'owner-') || startsWith(inputs.operation, 'network-probe')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/boca-main-ref-owner.json"
          python scripts/check_main_ref.py "$RUNNER_TEMP/boca-main-ref-owner.json" "$BOCA_SOURCE_SHA"
      - name: Mark owner custody host attempt before starting dedicated daemon
        id: boca_owner_attempt
        if: startsWith(inputs.operation, 'owner-') || startsWith(inputs.operation, 'network-probe')
        run: printf 'started=true\n' >> "$GITHUB_OUTPUT"
      - name: Start only the stopped prepared Boca rootless daemon for owner custody
        if: startsWith(inputs.operation, 'owner-') || startsWith(inputs.operation, 'network-probe')
        run: |
          set +e
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - start-existing "$BOCA_SOURCE_SHA")"
          ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_rootless_setup.py > "$RUNNER_TEMP/boca-owner-start.receipt" 2>/dev/null
          start_rc=$?
          set -e
          receipt=''
          if [[ "$start_rc" -eq 0 ]]; then receipt="$(cat "$RUNNER_TEMP/boca-owner-start.receipt")"; fi
          pattern='^BOCA_ROOTLESS_START state=READY source_sha=([0-9a-f]{40}) inventory=known_stopped data=preserved$'
          if [[ "$start_rc" -ne 0 || ${#receipt} -gt 180 || ! "$receipt" =~ $pattern || "${BASH_REMATCH[1]}" != "$BOCA_SOURCE_SHA" ]]; then
            printf 'Boca owner custody: prepared daemon start NO_GO; Boca-only stop follows.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Boca rootless network probe without app image or published port
        if: startsWith(inputs.operation, 'network-probe')
        run: |
          set +e
          remote_command="$(python3 -c 'import shlex,sys; print(shlex.join(sys.argv[1:]))' python3 - "$BOCA_OPERATION" '' "$BOCA_SOURCE_SHA" "$(cat "$RUNNER_TEMP/boca-compose.sha")")"
          timeout --signal=TERM --kill-after=5s 60s ssh -F "$RUNNER_TEMP/boca-ssh/config" boca-target "$remote_command" < src/boca_socios/host_first_deploy.py > "$RUNNER_TEMP/boca-network-probe.receipt" 2>/dev/null
          probe_rc=$?
          set -e
          receipt=''
