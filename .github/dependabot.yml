version: 2
updates:
  # The project is locked with uv.lock, not requirements.txt.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Delay normal version bumps while keeping security updates immediate.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies

