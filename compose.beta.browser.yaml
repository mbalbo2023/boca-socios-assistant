# Optional browser-ipc-v2 overlay. NEVER selected by legacy beta-install.
# The protected V3 installer prepares an idle worker and the controller-only
# socket. A request from the authenticated panel can then start that worker.
# Dedicated outbound-only Boca worker bridge; no published worker port,
# owner/key/data mount, host networking, or shared application network.
name: boca-socios

services:
  controller:
    # Restore the panel after a host restart. Every panel boot keeps the engine stopped.
    restart: unless-stopped
    environment:
      BOCA_BROWSER_BACKEND: ipc
      BOCA_BOT_CONTROL: on-demand
      # Only after protected Cutover A installs the IPC controller; sender stays OFF.
      BOCA_TELEGRAM_PAIRING_STAGE_MODE: "encrypted-only"
    labels:
      boca.socios.browser-ipc-attempt: ${BOCA_BROWSER_ATTEMPT_ID:?single_reviewed_GitHub_run_required}
    volumes:
      - boca_browser_ipc:/run/boca-browser-ipc:ro
      # Minimal destination-only configuration; never mount the member DB in worker.
      - boca_site_config:/run/boca-site-config
      - type: bind
        source: ${BOCA_CONTROL_DIR:?reviewed_Boca_socket_directory_required}
        target: /run/boca-bot-control
        read_only: true
        bind:
          create_host_path: false

  browser-worker:
    image: ${BOCA_BROWSER_IMAGE:?reviewed_browser_digest_required}
    command: ["python", "-m", "boca_socios.browser.ipc_server"]
    user: "10002:10002"
    init: true
    restart: "no"
    stop_grace_period: 8s
    logging:
      driver: "none"
    environment:
      BOCA_ENVIRONMENT: staging
      BOCA_RUNTIME_MODE: simulation
      BOCA_ENGINE_MODE: "off"
    labels:
      boca.socios.browser-ipc-attempt: ${BOCA_BROWSER_ATTEMPT_ID:?single_reviewed_GitHub_run_required}
    volumes:
      - boca_browser_ipc:/run/boca-browser-ipc
      - boca_site_config:/run/boca-site-config:ro
    networks:
      - boca_browser_egress
    cgroup: private
    ipc: private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /home/boca-browser:rw,noexec,nosuid,size=16m
    shm_size: 64m
    security_opt:
      - no-new-privileges:true
      - seccomp=${BOCA_BROWSER_SECCOMP_PATH:?reviewed_Boca_seccomp_path_required}
    cap_drop:
      - ALL
    # Only the verified Playwright Chromium sandbox exception (ADR 0020).
    cap_add:
      - SYS_CHROOT
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.00
    healthcheck:
      # Docker keeps health output independently of the service logging driver.
      test:
        - CMD-SHELL
        - python -m boca_socios.browser.worker_health >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  # External=new-only/protected preprovisioning; mode 0711 and UID/GID 10002
  # are required by ADR 0094 and cannot be established by Compose alone.
  boca_browser_ipc:
    external: true
    name: boca-socios_boca_browser_ipc
  # Preprovisioned by the dedicated Boca-only host operation, UID10001.
  boca_site_config:
    external: true
    name: boca-socios_boca_site_config

networks:
  # External Internet is required by the owner. Keep the worker on its OWN
  # rootless Boca bridge, never on the controller or Porota networks.
  boca_browser_egress:
    name: boca-socios_boca_browser_egress
    driver: bridge
    internal: false
